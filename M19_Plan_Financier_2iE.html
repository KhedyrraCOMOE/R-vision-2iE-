  {q:"À quoi sert le plan financier d'un business plan ?",type:'multi',opts:[{t:"À donner une indication sur la performance financière et la position de trésorerie future",c:true},{t:"À prévoir l'avenir avec précision",c:false},{t:"À remplacer le compte de résultat prévisionnel",c:false},{t:"À fixer le prix de vente des produits",c:false}],diff:'easy',piege:false,expl:"Le plan financier donne une indication sur la performance financière et la position de trésorerie future de l'entreprise. Il ne prédit pas l'avenir mais chiffre le scénario le plus crédible.",ref:"Chapitre 1 › III › Page 7"},
  {q:"Le plan financier engage l'entreprise sur quelle durée ?",type:'multi',opts:[{t:"Long terme",c:true},{t:"Moyen terme uniquement",c:false},{t:"Court terme",c:false},{t:"Inférieure à 1 an",c:false}],diff:'med',piege:true,expl:"PIÈGE : Le plan financier récapitule les décisions financières dont la formulation et la mise en œuvre engagent l'entreprise sur le LONG terme. Toute réponse indiquant 'moyen terme' est fausse.",ref:"Chapitre 2 › II › Page 9"},
  {q:"Quels sont les trois types d'amortissement distingués dans le cours ?",type:'multi',opts:[{t:"Fiscal, technique/économique, financier",c:true},{t:"Linéaire, dégressif, exceptionnel",c:false},{t:"Annuel, mensuel, trimestriel",c:false},{t:"Direct, indirect, différé",c:false}],diff:'med',piege:false,expl:"Les 3 types d'amortissement sont : l'amortissement fiscal (déduction des impôts), l'amortissement technique ou économique (usure et perte d'utilité), et l'amortissement financier (déduction des intérêts sur prêts).",ref:"Chapitre 2 › I › Page 9"},
  {q:"Les amortissements apparaissent dans quel(s) document(s) comptable(s) ?",type:'multi',opts:[{t:"Dans les comptes de production-exploitation uniquement",c:true},{t:"Dans les comptes de trésorerie et de bilan des flux",c:false},{t:"Dans tous les documents financiers sans exception",c:false},{t:"Uniquement dans le bilan",c:false}],diff:'med',piege:true,expl:"PIÈGE : Les amortissements n'apparaissent QUE dans les comptes de production-exploitation. Ils n'apparaissent JAMAIS dans les comptes de trésorerie ou de bilan des flux car ce sont des charges calculées et non réelles.",ref:"Chapitre 2 › I › Page 9"},
  {q:"Quel pourcentage d'imprévus prend-on généralement sur les estimations initiales d'investissement ?",type:'multi',opts:[{t:"Entre 5 et 15%",c:true},{t:"Entre 1 et 5%",c:false},{t:"Entre 15 et 25%",c:false},{t:"Exactement 10% systématiquement",c:false}],diff:'med',piege:false,expl:"Pour tenir compte des aléas techniques et financiers, on prend généralement un pourcentage des estimations initiales totales de coût, le plus souvent entre 5 et 15%.",ref:"Chapitre 2 › I › Page 9"},
  {q:"Dans le plan de financement initial, à quel minimum doivent correspondre les fonds propres par rapport au financement global ?",type:'multi',opts:[{t:"25 à 30% du financement global",c:true},{t:"10 à 15% du financement global",c:false},{t:"50% du financement global",c:false},{t:"Il n'existe pas de minimum recommandé",c:false}],diff:'med',piege:false,expl:"En principe, les fonds propres doivent représenter au moins 25 à 30% du financement global. Un emprunt démesuré par rapport aux apports des associés est un signal d'alerte.",ref:"Chapitre 1 › III › Page 7"},
  {q:"Quelles sont les ressources financières initiales pouvant figurer dans le plan de financement initial ?",type:'multi',opts:[{t:"Apports en capital, emprunts souscrits, subventions d'équipement",c:true},{t:"Uniquement les apports en numéraire des associés",c:false},{t:"Chiffre d'affaires prévisionnel de la première année",c:false},{t:"Dividendes distribués aux actionnaires",c:false}],diff:'med',piege:false,expl:"Les ressources financières initiales comprennent : apports en capital social (numéraire et nature), apports de l'exploitant, apports en compte courant d'associé, emprunts souscrits, et subventions d'équipement reçues à la création.",ref:"Chapitre 2 › 2.1.2 › Page 12"},
  {q:"Quelle est la formule de la relation entre trésorerie et plan de financement ?",type:'multi',opts:[{t:"Trésorerie fin de période = Trésorerie début de période + Solde du plan de financement",c:true},{t:"Trésorerie = Ressources – Besoins",c:false},{t:"Trésorerie = CAF + Emprunts – Investissements",c:false},{t:"Trésorerie fin = Ressources cumulées – Besoins cumulés",c:false}],diff:'hard',piege:false,expl:"La relation exacte est : Trésorerie fin de période = Trésorerie début de période + Solde du plan de financement. Cette relation est valable à la fin de chaque année du plan de financement.",ref:"Chapitre 2 › C › Page 16"},
  {q:"Le plan de trésorerie varie en fonction de quels types d'opérations ?",type:'multi',opts:[{t:"Opérations courantes d'exploitation, d'investissement ET de financement",c:true},{t:"Uniquement des opérations courantes d'exploitation",c:false},{t:"Uniquement des opérations d'investissement",c:false},{t:"Il ne varie pas, il reste constant",c:false}],diff:'med',piege:true,expl:"PIÈGE : Le plan de trésorerie varie en fonction des opérations courantes d'exploitation, MAIS AUSSI des opérations liées à l'investissement et au financement. Dire qu'il reste constant est faux.",ref:"Chapitre 3 › IV › Page 22"},
  {q:"Quelle est la condition pour qu'un projet soit rentable selon la VAN ?",type:'multi',opts:[{t:"VAN > 0",c:true},{t:"VAN = 0",c:false},{t:"VAN < 0",c:false},{t:"VAN positive ou nulle",c:false}],diff:'easy',piege:false,expl:"Un projet est rentable (acceptable) dès lors que VAN > 0. La VAN strictement positive indique que le projet génère plus de valeur que le coût du capital.",ref:"Chapitre 3 › 6.1 › Page 25"},
  {q:"Comment est calculée la CAF d'exploitation utilisée dans le calcul de la VAN ?",type:'multi',opts:[{t:"CAF d'exploitation = EBE – Impôt sur les sociétés sur le résultat d'exploitation",c:true},{t:"CAF = Résultat net + Amortissements",c:false},{t:"CAF = Chiffre d'affaires – Charges totales",c:false},{t:"CAF = EBE + Dotations aux amortissements",c:false}],diff:'hard',piege:true,expl:"Les recettes nettes d'exploitation prévues (R dans la formule VAN) correspondent à la CAF d'exploitation = EBE – Impôt sur les sociétés sur le résultat d'exploitation.",ref:"Chapitre 3 › 6.1 › Page 25"},
  {q:"Le TRI peut-il être calculé directement par une formule analytique ?",type:'multi',opts:[{t:"Non, il faut tâtonner ou utiliser un algorithme/logiciel",c:true},{t:"Oui, directement par la formule L = Σ Rt/(1+i)^t",c:false},{t:"Oui, en utilisant simplement un tableau Excel standard",c:false},{t:"Oui, c'est plus simple à calculer que la VAN",c:false}],diff:'med',piege:true,expl:"PIÈGE : Contrairement à la VAN, le TRI ne peut pas être calculé directement par une formule. Il faut 'tâtonner' jusqu'à trouver une approximation satisfaisante, ou utiliser un algorithme/logiciel adéquat.",ref:"Chapitre 3 › 6.2.2 › Page 26"},
  {q:"Que représente la valeur résiduelle d'un investissement dans le calcul de la VAN ?",type:'multi',opts:[{t:"La valeur vénale de l'investissement en fin de projet + BFR d'exploitation récupéré",c:true},{t:"Le montant restant dû sur l'emprunt en fin de projet",c:false},{t:"La valeur comptable nette de l'actif en fin de projet",c:false},{t:"Les dividendes non distribués en fin de projet",c:false}],diff:'hard',piege:false,expl:"La valeur résiduelle = valeur vénale de l'investissement en fin de projet + besoin en fonds de roulement d'exploitation récupéré en fin de projet. Elle s'ajoute à la recette d'exploitation de la dernière année.",ref:"Chapitre 3 › 6.1 › Page 25"},
  {q:"Quels éléments incorpore-t-on dans le plan de financement sur 3 à 5 exercices ?",type:'multi',opts:[{t:"Nouveaux investissements, variation du BFR, CAF, remboursements emprunts, dividendes",c:true},{t:"Uniquement les investissements et les emprunts bancaires",c:false},{t:"Seulement la CAF et les dividendes distribués",c:false},{t:"Uniquement les subventions reçues et les apports en capital",c:false}],diff:'med',piege:false,expl:"Le plan de financement sur 3 à 5 exercices incorpore : nouveaux investissements, nouveaux apports en capital, nouveaux emprunts, distributions de dividendes, subventions, variation du BFR, et la CAF (ou insuffisance d'autofinancement).",ref:"Chapitre 2 › 2.2.1 › Page 13"},
  {q:"Dans les tests de sensibilité standard, quel taux de baisse du CA est utilisé en première hypothèse ?",type:'multi',opts:[{t:"10% de baisse du chiffre d'affaires",c:true},{t:"5% de baisse du chiffre d'affaires",c:false},{t:"20% de baisse du chiffre d'affaires",c:false},{t:"15% de baisse du chiffre d'affaires",c:false}],diff:'med',piege:false,expl:"La première hypothèse des tests de sensibilité est une baisse de 10% du CA pouvant découler d'une baisse d'activité ou de l'entrée d'un concurrent, tout en maintenant les charges au niveau initial.",ref:"Chapitre 3 › VII › Page 27"},
  {q:"Quels sont les 3 groupes de formes de financement disponibles pour satisfaire aux besoins d'une entreprise ?",type:'multi',opts:[{t:"Financement par emprunt, par subvention et par fonds propres",c:true},{t:"Financement par crédit-bail, par ligne de crédit et par leasing",c:false},{t:"Financement par crédit-bail, par subvention et par fonds propres",c:false},{t:"Financement par emprunt, par subvention et par leasing",c:false}],diff:'hard',piege:true,expl:"PIÈGE : Les 3 groupes principaux de financement sont : emprunt + subvention + fonds propres. Le crédit-bail et le leasing ne sont PAS des groupes distincts dans cette classification.",ref:"Chapitre 4 › I › Page 28"},
  {q:"Qu'est-ce que le prêt d'honneur ?",type:'multi',opts:[{t:"Un crédit à taux d'intérêt zéro, sans garantie, destiné à la création ou reprise d'entreprise",c:true},{t:"Un prêt accordé par un ami de confiance sans formalité bancaire",c:false},{t:"Un prêt bancaire à taux préférentiel pour les entrepreneurs",c:false},{t:"Un financement participatif remboursable avec intérêts",c:false}],diff:'med',piege:false,expl:"Le prêt d'honneur est un crédit à taux d'intérêt zéro destiné à la création, la reprise d'entreprise et les projets personnels, accordé sans intérêts ni garantie. L'emprunteur s'engage sur l'honneur à rembourser.",ref:"Chapitre 4 › 5 › Page 32"},
  {q:"Le crowdfunding (financement participatif) est-il très répandu en Afrique ?",type:'multi',opts:[{t:"Non, il est beaucoup plus pratiqué en Europe et en Amérique",c:true},{t:"Oui, c'est la source de financement dominante en Afrique",c:false},{t:"Oui, il connaît une croissance rapide dans toute l'Afrique",c:false},{t:"Oui, notamment grâce aux plateformes mobiles africaines",c:false}],diff:'easy',piege:false,expl:"Selon le cours, le financement participatif (crowdfunding) n'est pas très répandu en Afrique. C'est plus en Europe et en Amérique qu'on pratique le crowdfunding.",ref:"Chapitre 4 › 4 › Page 31"},
  {q:"Quelle est la particularité du prêt d'honneur par rapport à un prêt bancaire classique ?",type:'multi',opts:[{t:"Il est accordé sans intérêts et sans garantie",c:true},{t:"Il offre un taux d'intérêt préférentiel inférieur au marché",c:false},{t:"Il est accordé uniquement aux grandes entreprises",c:false},{t:"Il ne nécessite pas de remboursement du capital",c:false}],diff:'easy',piege:false,expl:"Le prêt d'honneur est accordé sans intérêts (taux zéro) et sans garantie ni caution personnelle. L'emprunteur rembourse uniquement la somme empruntée, sans intérêts.",ref:"Chapitre 4 › 5 › Page 32"},
  {q:"Dans quel cas l'entreprise est-elle confrontée à un besoin de financement supplémentaire lors de l'ajustement du plan ?",type:'multi',opts:[{t:"Lorsque le plan de financement fait apparaître un excès des besoins sur les ressources",c:true},{t:"Lorsque la CAF est supérieure aux investissements prévus",c:false},{t:"Lorsque les dividendes distribués sont trop faibles",c:false},{t:"Lorsque la variation du BFR est négative",c:false}],diff:'hard',piege:false,expl:"Lorsque le plan de financement fait apparaître un besoin de financement (excès des emplois sur les ressources), l'entreprise doit trouver des ressources complémentaires : emprunts ou crédit bancaire court terme.",ref:"Chapitre 2 › III › Page 16"},
  {q:"Quelle est la différence principale entre le plan financier et un tableau de financement comptable ?",type:'multi',opts:[{t:"Le plan financier est prévisionnel et non normalisé ; le tableau de financement est un constat historique normalisé",c:true},{t:"Le plan financier porte sur le court terme et le tableau sur le long terme",c:false},{t:"Le tableau de financement inclut la CAF mais pas le plan financier",c:false},{t:"Ils sont identiques, c'est juste une différence de terminologie",c:false}],diff:'hard',piege:false,expl:"Le plan financier est un document prévisionnel reflétant les anticipations et les choix de la politique financière. Le tableau de financement comptable est un constat se nourrissant des informations du passé. De plus, le plan financier n'est pas normalisé (pluralité de modèles).",ref:"Chapitre 2 › II › Page 9"},
  {q:"Quels sont les 3 types d'approche dans le calcul du chiffre d'affaires prévisionnel ?",type:'multi',opts:[{t:"Par imitation, par les charges, par les produits",c:true},{t:"Par le marché, par les coûts, par les bénéfices",c:false},{t:"Par la demande, l'offre et la concurrence",c:false},{t:"Ascendant, descendant et horizontal",c:false}],diff:'med',piege:false,expl:"Les 3 approches sont : (1) par imitation = CA moyen du secteur, (2) par les charges = CA minimal pour couvrir les charges (seuil de rentabilité), (3) par les produits = commandes fermes ou conditionnelles des clients.",ref:"Chapitre 3 › 1.2 › Page 18"},
  {q:"Le plan financier comprend combien de parties distinctes ?",type:'multi',opts:[{t:"Trois : besoins, ressources et soldes",c:true},{t:"Deux : emplois et ressources",c:false},{t:"Quatre : investissements, exploitation, financement et trésorerie",c:false},{t:"Cinq : correspondant aux 5 années d'exercice",c:false}],diff:'med',piege:false,expl:"Le plan financier comprend trois parties distinctes : les besoins (emplois), les ressources, et les soldes. Les soldes comprennent les soldes annuels mais aussi les soldes cumulés.",ref:"Chapitre 2 › II › Page 9"},
  {q:"Que représente la CAF dans le plan de financement sur plusieurs exercices ?",type:'multi',opts:[{t:"Une ressource durable générée en interne pour financer les besoins prévisionnels",c:true},{t:"Un besoin supplémentaire lié à l'expansion de l'activité",c:false},{t:"Une subvention accordée par l'État",c:false},{t:"Un emprunt à court terme remboursable dans l'année",c:false}],diff:'med',piege:false,expl:"La CAF (Capacité d'Auto-Financement) est une ressource durable. Les ressources durables représentent l'ensemble des ressources susceptibles de financer les besoins stables prévisionnels. La CAF tient compte de l'outil de production et des investissements inscrits en emplois.",ref:"Chapitre 2 › B › Page 15"},
  {q:"Quels frais doit-on obligatoirement inclure dans l'évaluation des investissements pour un équipement importé ?",type:'multi',opts:[{t:"Frais de transport maritime, taxes douanières, et toutes autres taxes",c:true},{t:"Uniquement le prix d'achat HT de l'équipement",c:false},{t:"Uniquement la TVA locale",c:false},{t:"Frais de formation du personnel uniquement",c:false}],diff:'med',piege:false,expl:"Pour les équipements importés, il faut obligatoirement inclure : le prix d'achat + frais de transport maritime + taxes douanières + toutes autres taxes. Le cours insiste (!!!) sur l'importance de tenir compte de TOUS ces frais.",ref:"Chapitre 2 › 2.1.1 › Page 10"},
  {q:"Quel est le taux de charges sociales applicable sur le salaire brut dans le cours M19 ?",type:'multi',opts:[{t:"16% du salaire brut",c:true},{t:"18% du salaire brut",c:false},{t:"10% du salaire brut",c:false},{t:"25% du salaire brut",c:false}],diff:'easy',piege:false,expl:"Les charges sociales = 16% du Salaire Brut (SB). Ce taux est clairement indiqué dans le tableau des charges de personnel du cours.",ref:"Chapitre 3 › 2.8 › Page 20"},
  {q:"Dans le plan de financement initial (Année 0), les besoins initiaux sont constitués de quoi ?",type:'multi',opts:[{t:"Des investissements nécessaires à la création de l'activité et du BFR initial",c:true},{t:"Uniquement des investissements en équipements",c:false},{t:"Du chiffre d'affaires prévisionnel de la première année",c:false},{t:"Des charges d'exploitation de la première année",c:false}],diff:'easy',piege:false,expl:"Les besoins initiaux à financer sont constitués des investissements nécessaires à la création de l'activité ET du besoin de fonds de roulement initial. Ces deux éléments composent le plan de financement initial (Année 0).",ref:"Chapitre 2 › 2.1.1 › Page 10"},
  {q:"Selon le cours, pourquoi le plan financier revêt-il un caractère intégrateur ?",type:'multi',opts:[{t:"Il reflète les implications financières de tous les projets et permet de tester leur cohérence",c:true},{t:"Il intègre tous les contrats signés avec les fournisseurs",c:false},{t:"Il récapitule toutes les opérations bancaires de l'entreprise",c:false},{t:"Il regroupe l'ensemble des ressources humaines disponibles",c:false}],diff:'med',piege:false,expl:"Le plan financier revêt un caractère intégrateur dans la mesure où il reflète les implications financières de tous les projets arrêtés par l'entreprise et permet ainsi de tester leur cohérence et leur compatibilité.",ref:"Chapitre 2 › Introduction › Page 8"},
  {q:"Si une entreprise doit réaliser des travaux dans des locaux qui ne lui appartiennent pas, dans quel poste comptable enregistre-t-on cette dépense ?",type:'multi',opts:[{t:"Installations générales, agencement, aménagements divers",c:true},{t:"Installation spéciale du locale",c:false},{t:"Bâtiments à installation spéciale",c:false},{t:"Bâtiments, installations techniques et agencement",c:false}],diff:'hard',piege:true,expl:"PIÈGE : Les travaux réalisés dans des constructions n'appartenant pas à l'entreprise ou au projet sont enregistrés dans le poste 'Installations générales, agencement, aménagements divers'.",ref:"Sujet d'examen › Q36"},
  {q:"Après son élaboration, le plan financier reste-t-il invariable ?",type:'multi',opts:[{t:"Non, il doit être mis à jour en fonction de l'évolution économique et financière",c:true},{t:"Oui, il reste figé jusqu'à la fin de la période prévue",c:false},{t:"Oui, car toute modification invaliderait les hypothèses de base",c:false},{t:"Oui, sauf en cas de force majeure",c:false}],diff:'med',piege:true,expl:"PIÈGE : L'affirmation selon laquelle le plan financier reste invariable est FAUSSE. Le plan financier est un outil permanent de gestion utilisé pour suivre, contrôler et guider le développement — il est donc mis à jour.",ref:"Chapitre 2 & Sujet d'examen › Q37"},
  {q:"L'élaboration du plan financier conduit à s'interroger sur quels points essentiels ?",type:'multi',opts:[{t:"Le niveau de risque assumé et le niveau de flexibilité financière face aux changements",c:true},{t:"Les conséquences d'un conflit entre employés et le niveau de rigidité financière",c:false},{t:"Uniquement la rentabilité du projet sans tenir compte du risque",c:false},{t:"Le montant des dividendes et la politique de recrutement",c:false}],diff:'hard',piege:false,expl:"L'élaboration du plan financier conduit à s'interroger sur : (1) le niveau de risque que l'entreprise est prête à assumer en fonction de l'objectif de rentabilité, et (2) le niveau de flexibilité financière qui permettra à l'entreprise de s'adapter à l'évolution de son environnement.",ref:"Sujet d'examen › Q38"},
  {q:"Dans le calcul de la VAN, que représente le taux d'actualisation (i) ?",type:'multi',opts:[{t:"Le taux de rentabilité souhaité par l'entreprise, correspondant au coût du capital",c:true},{t:"Le taux d'intérêt bancaire appliqué sur les emprunts",c:false},{t:"Le taux d'inflation prévu sur la durée du projet",c:false},{t:"Le taux de croissance du chiffre d'affaires",c:false}],diff:'hard',piege:false,expl:"Le taux d'actualisation correspond au taux de rentabilité souhaité par l'entreprise. Il correspond au coût du capital finançant le projet et s'exprime en pourcentage.",ref:"Chapitre 3 › 6.1 › Page 24"},
  {q:"Quels sont les tableaux financiers prévisionnels compris dans un business plan ?",type:'multi',opts:[{t:"Compte de résultat prévisionnel, bilan prévisionnel, plan de financement, budget de trésorerie",c:true},{t:"Uniquement le bilan et le compte de résultat",c:false},{t:"Seulement le plan de trésorerie et le plan de financement",c:false},{t:"Uniquement la VAN et le TRI",c:false}],diff:'med',piege:false,expl:"Les tableaux financiers prévisionnels du business plan comprennent : le compte de résultat et le bilan prévisionnel, le plan de financement et le budget de trésorerie.",ref:"Chapitre 3 › Introduction › Page 18"},
  {q:"Comment évalue-t-on le montant du chiffre d'affaires prévisionnel ?",type:'multi',opts:[{t:"CA = Quantité vendue × Prix de vente unitaire",c:true},{t:"CA = Charges totales + Bénéfice souhaité",c:false},{t:"CA = Investissements ÷ Taux de rentabilité",c:false},{t:"CA = BFR × Rotation des stocks",c:false}],diff:'easy',piege:false,expl:"Pour évaluer le montant du CA, il suffit de multiplier la quantité de marchandises vendues (activité commerciale) ou la production vendue (activité industrielle) par leurs prix de vente respectifs.",ref:"Chapitre 3 › 1.2 › Page 18"},
  {q:"Le schéma de financement d'un projet peut également être désigné sous quelle appellation ?",type:'multi',opts:[{t:"Plan de financement initial ou structure financière du projet",c:true},{t:"Plan de trésorerie ou budget d'exploitation",c:false},{t:"Tableau de bord financier ou rapport annuel",c:false},{t:"Business plan ou étude de marché",c:false}],diff:'med',piege:false,expl:"Le schéma de financement d'un projet est encore désigné par 'plan de financement initial' ou 'structure financière d'un projet'. Ces termes sont utilisés de façon interchangeable.",ref:"Sujet d'examen › Q33"},
  {q:"Dans le plan de financement sur 3 à 5 exercices, comment inscrit-on les emprunts obligataires ?",type:'multi',opts:[{t:"Pour leur prix d'émission",c:true},{t:"Pour leur valeur nominale",c:false},{t:"Pour leur valeur de remboursement",c:false},{t:"Pour leur valeur actualisée nette",c:false}],diff:'hard',piege:true,expl:"PIÈGE : Les emprunts indivis sont inscrits pour leur valeur nominale, MAIS les emprunts obligataires sont inscrits pour leur PRIX D'ÉMISSION. Ne pas confondre les deux.",ref:"Chapitre 2 › B › Page 15"},
  {q:"Quel est le rôle des subventions dans le plan de financement ?",type:'multi',opts:[{t:"L'année où elle est perçue, la subvention constitue une ressource pour son montant total",c:true},{t:"La subvention est toujours étalée sur la durée du projet",c:false},{t:"La subvention constitue un besoin à financer",c:false},{t:"La subvention est inscrite en ressources seulement si remboursable",c:false}],diff:'med',piege:false,expl:"L'année où elle est perçue, la subvention constitue une ressource pour son montant total. Son imposition est prise en compte dans le calcul de la CAF.",ref:"Chapitre 2 › B › Page 15"},

// ✏ ZONE C — SÉRIE 2 : QCM CAS PRATIQUES
const serie2 = [
  {q:"L'entreprise ECOVERT achète un broyeur plastique à 3 660 000 FCFA HT. Elle doit l'importer du Chine avec des frais de transport de 400 000 FCFA et des taxes douanières de 32,5%. Quel est le montant total TTC à intégrer dans le plan d'investissement ?",type:'multi',opts:[{t:"(3 660 000 + 400 000) × 1,325 = 5 373 500 FCFA",c:true},{t:"3 660 000 × 1,325 = 4 849 500 FCFA",c:false},{t:"3 660 000 + 400 000 = 4 060 000 FCFA",c:false},{t:"3 660 000 FCFA uniquement (hors taxes)",c:false}],diff:'hard',piege:true,expl:"PIÈGE TAXES : Le montant de base = 3 660 000 + 400 000 frais transport = 4 060 000 FCFA. Puis on applique les taxes douanières : 4 060 000 × 1,325 = 5 379 500 FCFA. Il faut TOUJOURS inclure frais de transport ET taxes dans le coût d'investissement TTC.",ref:"Chapitre 2 › 2.1.1 › Page 10"},
  {q:"La société SOLAIRE-BF prévoit un investissement total de 52 000 000 FCFA. Pour couvrir les imprévus, quel est le montant minimum et maximum à provisionner ?",type:'multi',opts:[{t:"Min = 2 600 000 FCFA (5%) · Max = 7 800 000 FCFA (15%)",c:true},{t:"Min = 1 040 000 FCFA (2%) · Max = 5 200 000 FCFA (10%)",c:false},{t:"Exactement 5 200 000 FCFA (10%)",c:false},{t:"Min = 5 200 000 FCFA · Max = 10 400 000 FCFA",c:false}],diff:'med',piege:false,expl:"Pour les imprévus (aléas techniques et financiers), on prend entre 5 et 15% des estimations initiales totales. Sur 52 000 000 FCFA : minimum = 52 000 000 × 5% = 2 600 000 FCFA ; maximum = 52 000 000 × 15% = 7 800 000 FCFA.",ref:"Chapitre 2 › I › Page 9"},
  {q:"L'entreprise AGRI-PRO prévoit pour la première année : stocks de matières premières (2 mois d'achats = 2 200 000 FCFA), salaires 2 mois (3 000 000 FCFA), frais généraux 2 mois (800 000 FCFA). Elle n'a pas de dettes fournisseurs. Quel est son BFR initial ?",type:'multi',opts:[{t:"6 000 000 FCFA",c:true},{t:"5 200 000 FCFA",c:false},{t:"3 800 000 FCFA",c:false},{t:"8 000 000 FCFA",c:false}],diff:'med',piege:false,expl:"BFR initial = Total des besoins – Total des ressources (dettes) = (2 200 000 + 3 000 000 + 800 000) – 0 = 6 000 000 FCFA. Puisqu'il n'y a pas de dettes fournisseurs, le BFR correspond à l'intégralité des besoins.",ref:"Chapitre 2 › 2.1.1 › Page 11"},
  {q:"Un projet génère les cash flows annuels suivants sur 3 ans : 10 000 000 / 12 000 000 / 15 000 000 FCFA. Le capital investi est de 30 000 000 FCFA. Le taux d'actualisation est 10%. La VAN est-elle positive ?",type:'multi',opts:[{t:"Oui, VAN positive car la somme actualisée dépasse 30 000 000 FCFA",c:true},{t:"Non, VAN négative car les flux cumulés (37 000 000) ne dépassent pas 30 000 000 × facteur d'intérêts composés",c:false},{t:"VAN = 0 car le TRI = 10%",c:false},{t:"Impossible à dire sans le calcul exact",c:false}],diff:'hard',piege:true,expl:"VAN = -30 000 000 + 10 000 000/1,1 + 12 000 000/1,21 + 15 000 000/1,331 = -30 000 000 + 9 090 909 + 9 917 355 + 11 270 097 = +278 361 FCFA. VAN > 0 donc projet rentable.",ref:"Chapitre 3 › 6.1 › Page 24"},
  {q:"L'entreprise TECH-BURKINA a un Salaire Brut mensuel total de 2 500 000 FCFA pour 10 employés. Quel est le montant mensuel total des charges de personnel (SB + charges sociales) ?",type:'multi',opts:[{t:"2 900 000 FCFA (2 500 000 × 1,16)",c:true},{t:"2 750 000 FCFA (2 500 000 × 1,10)",c:false},{t:"2 500 000 FCFA (SB seul suffit)",c:false},{t:"3 000 000 FCFA (2 500 000 × 1,20)",c:false}],diff:'easy',piege:false,expl:"Charges sociales = 16% × SB = 0,16 × 2 500 000 = 400 000 FCFA. Total charges personnel = SB + Charges sociales = 2 500 000 + 400 000 = 2 900 000 FCFA.",ref:"Chapitre 3 › 2.8 › Page 20–21"},
  {q:"Le plan de financement initial de SAVANE-INVEST montre : Besoins totaux = 45 000 000 FCFA. Ressources disponibles : fonds propres = 15 000 000 FCFA. Quel est le montant d'emprunt minimum pour respecter la règle des fonds propres ?",type:'multi',opts:[{t:"Les fonds propres représentent 33% du total > 25% → l'emprunt de 30 000 000 est acceptable",c:true},{t:"Il faut augmenter les fonds propres à 22 500 000 FCFA minimum",c:false},{t:"L'emprunt doit être inférieur aux fonds propres",c:false},{t:"Les fonds propres de 15 000 000 sont insuffisants (< 25% de 45 000 000 = 11 250 000)",c:false}],diff:'hard',piege:true,expl:"PIÈGE CALCUL : La règle est que les fonds propres représentent au moins 25 à 30% du financement GLOBAL. 15 000 000 / 45 000 000 = 33,3% > 25%. Donc les fonds propres sont SUFFISANTS. L'emprunt de 30 000 000 est acceptable.",ref:"Chapitre 1 › III › Page 7"},
  {q:"Dans le plan de trésorerie de MAPRO-CI (mois 1), les encaissements CA TTC sont de 5 000 000 FCFA, les créances clients reportées = 1 500 000 FCFA. Les achats TTC = 2 000 000, charges personnel = 1 200 000, TVA = 500 000. Quel est le flux net d'exploitation du mois 1 ?",type:'multi',opts:[{t:"-200 000 FCFA",c:true},{t:"800 000 FCFA",c:false},{t:"1 300 000 FCFA",c:false},{t:"-700 000 FCFA",c:false}],diff:'hard',piege:false,expl:"Encaissements réels = 5 000 000 – 1 500 000 créances = 3 500 000. Décaissements = 2 000 000 + 1 200 000 + 500 000 = 3 700 000. Flux net exploitation = 3 500 000 – 3 700 000 = -200 000 FCFA.",ref:"Chapitre 3 › IV › Page 22"},
  {q:"SOLAR-INVEST demande un prêt bancaire de 36 000 000 FCFA sur 5 ans au taux de 10%. Le remboursement annuel constant est de 7 238 888 FCFA. La trésorerie initiale en Année 1 est 0. Quelle est la trésorerie cumulée fin d'Année 1 si la CAF = 20 642 551 FCFA et la variation BFR = -5 773 691 FCFA ?",type:'multi',opts:[{t:"Environ 19 177 354 FCFA",c:true},{t:"26 000 000 FCFA",c:false},{t:"13 403 663 FCFA",c:false},{t:"7 403 663 FCFA",c:false}],diff:'hard',piege:false,expl:"Besoins An1 = Variation BFR (5 773 691) + Remboursement emprunt (7 238 888) = 13 012 579. Trésorerie dégagée = CAF – Besoins = 20 642 551 – (5 773 691 + 7 238 888) = 19 629 972 ≈ 19 177 354 FCFA. (Le cours indique exactement 19 177 354 FCFA dans l'exemple.)",ref:"Chapitre 2 › Plan de Financement › Page 16"},
  {q:"PLASTIQUE-BF réalise un investissement de 42 279 398 FCFA et un BFR initial de 10 591 337 FCFA. Elle apporte 16 676 294 FCFA en fonds propres. Quel est le montant d'emprunt nécessaire pour équilibrer le plan de financement initial ?",type:'multi',opts:[{t:"36 194 441 FCFA",c:true},{t:"25 603 104 FCFA",c:false},{t:"42 279 398 FCFA",c:false},{t:"52 870 735 FCFA",c:false}],diff:'hard',piege:false,expl:"Total besoins = 42 279 398 + 10 591 337 = 52 870 735 FCFA. Emprunts = Total besoins – Fonds propres = 52 870 735 – 16 676 294 = 36 194 441 FCFA. C'est l'exemple exact du cours.",ref:"Chapitre 2 › Plan de Financement › Page 16"},
  {q:"Une entreprise réalise un résultat avant impôts de 5 000 000 FCFA. Quel est le montant de l'IBIC et du résultat net ?",type:'multi',opts:[{t:"IBIC = 1 900 000 FCFA · Résultat net = 3 100 000 FCFA",c:true},{t:"IBIC = 1 500 000 FCFA · Résultat net = 3 500 000 FCFA",c:false},{t:"IBIC = 2 500 000 FCFA · Résultat net = 2 500 000 FCFA",c:false},{t:"IBIC = 900 000 FCFA · Résultat net = 4 100 000 FCFA",c:false}],diff:'med',piege:false,expl:"IBIC = 38% × Résultat avant impôts = 38% × 5 000 000 = 1 900 000 FCFA. Résultat net = 5 000 000 – 1 900 000 = 3 100 000 FCFA.",ref:"Chapitre 3 › III › Page 22"},
  {q:"L'entreprise FASO-BUILD souhaite réaliser un test de sensibilité sur son projet. Son CA prévisionnel est de 80 000 000 FCFA. Quel CA doit-elle retenir pour l'hypothèse 1 (baisse de 10%) ?",type:'multi',opts:[{t:"72 000 000 FCFA",c:true},{t:"70 000 000 FCFA",c:false},{t:"68 000 000 FCFA",c:false},{t:"76 000 000 FCFA",c:false}],diff:'easy',piege:false,expl:"La première hypothèse du test de sensibilité est une baisse de 10% du CA. CA test = 80 000 000 × (1 – 0,10) = 80 000 000 × 0,90 = 72 000 000 FCFA.",ref:"Chapitre 3 › VII › Page 27"},
  {q:"ECOPLAST-BF aménage les bureaux administratifs d'un local loué pour 5 000 000 FCFA HT, TVA 18%. Dans quel poste et pour quel montant TTC enregistre-t-on cet investissement ?",type:'multi',opts:[{t:"Installations générales, agencement divers · 5 900 000 FCFA TTC",c:true},{t:"Bâtiments et aménagements · 5 900 000 FCFA TTC",c:false},{t:"Installations générales · 5 000 000 FCFA HT",c:false},{t:"Charges immobilisées · 5 900 000 FCFA TTC",c:false}],diff:'hard',piege:true,expl:"Travaux dans un local non propriété → poste 'Installations générales, agencement, aménagements divers'. Montant TTC = 5 000 000 × 1,18 = 5 900 000 FCFA.",ref:"Sujet d'examen › Q36 & Chapitre 2 › 2.1.1"},
  {q:"Un entrepreneur souhaite financer son projet de 60 000 000 FCFA. Il dispose de 18 000 000 FCFA en fonds propres. Quel pourcentage représentent ses fonds propres et cette structure est-elle acceptable selon le cours ?",type:'multi',opts:[{t:"30% → acceptable (≥ 25–30% exigés)",c:true},{t:"30% → pas acceptable (il faut 50% minimum)",c:false},{t:"30% → acceptable mais insuffisant (il faut 40% minimum)",c:false},{t:"18% → non acceptable",c:false}],diff:'med',piege:false,expl:"18 000 000 / 60 000 000 = 30%. Le cours indique que les fonds propres doivent représenter AU MOINS 25 à 30% du financement global. Avec exactement 30%, cette structure est à la limite mais acceptable.",ref:"Chapitre 1 › III › Page 7"},
  {q:"La société INNOV-WEST prévoit la formation de son personnel pour 2 000 000 FCFA avant le démarrage. Dans quelle rubrique d'investissement intègre-t-on cette dépense ?",type:'multi',opts:[{t:"Charges immobilisées (frais de premier établissement)",c:true},{t:"Services extérieurs (frais de formation)",c:false},{t:"Charges de personnel de l'exercice 1",c:false},{t:"Plan de trésorerie uniquement",c:false}],diff:'hard',piege:true,expl:"PIÈGE : Les frais de formation du personnel AVANT le démarrage font partie des investissements initiaux liés à la mise en route du projet — classés dans les 'charges immobilisées' (frais de premier établissement). Les formations EN COURS d'exploitation vont dans les services extérieurs.",ref:"Chapitre 2 › I › Page 8"},
  {q:"ENERGIE-SAHEL a une CAF d'exploitation de 25 000 000 FCFA. Son EBE est de 35 000 000 FCFA. Quel est le montant de l'impôt sur les sociétés applicable sur le résultat d'exploitation ?",type:'multi',opts:[{t:"10 000 000 FCFA",c:true},{t:"13 300 000 FCFA",c:false},{t:"9 500 000 FCFA",c:false},{t:"3 800 000 FCFA",c:false}],diff:'hard',piege:false,expl:"CAF d'exploitation = EBE – Impôt sur les sociétés sur résultat d'exploitation. Donc : 25 000 000 = 35 000 000 – IS. IS = 35 000 000 – 25 000 000 = 10 000 000 FCFA.",ref:"Chapitre 3 › 6.1 › Page 25"},
  {q:"Un investisseur compare deux projets A et B, de même coût. TRI(A) = 18% et TRI(B) = 12%. Lequel devrait être entrepris en priorité ?",type:'multi',opts:[{t:"Projet A car TRI(A) > TRI(B) → plus de croissance potentielle",c:true},{t:"Projet B car TRI(B) est plus prudent et moins risqué",c:false},{t:"Les deux projets sont équivalents car la VAN doit être calculée",c:false},{t:"Le projet B car 12% est un taux plus standard",c:false}],diff:'med',piege:false,expl:"Quand les coûts d'investissement sont les mêmes, celui dont le TRI est le plus élevé devrait être entrepris en premier. TRI(A) = 18% > TRI(B) = 12%, donc projet A en priorité.",ref:"Chapitre 3 › 6.2.3 › Page 26"},
  {q:"HORIZON-BF achète 3 machines à presse au prix unitaire de 2 175 000 FCFA HT avec une TVA de 18%. Quel est le montant TTC à inscrire dans le plan d'investissement ?",type:'multi',opts:[{t:"7 699 500 FCFA",c:true},{t:"6 525 000 FCFA",c:false},{t:"7 098 750 FCFA",c:false},{t:"6 525 000 + 18% = 7 699 500 / 3 = 2 566 500 par machine",c:false}],diff:'med',piege:false,expl:"Prix HT total = 3 × 2 175 000 = 6 525 000 FCFA. TVA = 6 525 000 × 18% = 1 174 500 FCFA. Total TTC = 6 525 000 + 1 174 500 = 7 699 500 FCFA.",ref:"Chapitre 2 › 2.1.1 › Exemple page 11"},
  {q:"L'entreprise BATISS-INVEST construit dans le cadre de son projet un plan de financement initial avec : Investissements TTC = 61 093 244, Imprévus (5%) = 3 052 662, BFR initial = 10 593 693. Les fonds propres disponibles sont de 17 150 713. Quel est le montant de financement externe recherché ?",type:'multi',opts:[{t:"Environ 57 588 886 FCFA",c:true},{t:"43 942 531 FCFA",c:false},{t:"61 093 244 FCFA",c:false},{t:"74 739 599 FCFA",c:false}],diff:'hard',piege:false,expl:"Total besoins = 61 093 244 + 3 052 662 + 10 593 693 = 74 739 599 FCFA. Financement externe = 74 739 599 – 17 150 713 = 57 588 886 FCFA.",ref:"Chapitre 2 › 2.1.2 › Page 12–13"},
  {q:"Le plan de financement sur 5 ans de RECYCLO-BF affiche : Trésorerie cumulée An4 = 51 966 845 FCFA. Solde dégagé en An5 = 24 768 899 FCFA. Quelle est la trésorerie cumulée en An5 ?",type:'multi',opts:[{t:"76 735 744 FCFA",c:true},{t:"24 768 899 FCFA",c:false},{t:"27 197 946 FCFA",c:false},{t:"51 966 845 FCFA",c:false}],diff:'med',piege:false,expl:"Trésorerie cumulée An5 = Trésorerie cumulée An4 + Solde dégagé An5 = 51 966 845 + 24 768 899 = 76 735 744 FCFA. C'est l'application directe de la formule du cours.",ref:"Chapitre 2 › C › Page 16"},
  {q:"L'entreprise SAHEL-TECH prévoit 2 mois de stock de matières plastiques (achat mensuel = 1 121 912 FCFA) et 2 mois de salaires (mensuel = 1 513 800 FCFA). Quel est le montant du BFR partiel correspondant à ces deux seuls postes ?",type:'multi',opts:[{t:"5 271 424 FCFA",c:true},{t:"2 635 712 FCFA",c:false},{t:"3 027 600 FCFA",c:false},{t:"4 271 424 FCFA",c:false}],diff:'med',piege:false,expl:"Stock matières = 2 × 1 121 912 = 2 243 824 FCFA. Salaires = 2 × 1 513 800 = 3 027 600 FCFA. BFR partiel = 2 243 824 + 3 027 600 = 5 271 424 FCFA.",ref:"Chapitre 2 › 2.1.1 › Exemple page 12"},
  {q:"Un projet doit financer ses besoins avec emprunt + fonds propres uniquement (pas de subvention). Les fonds propres de 20 000 000 FCFA représentent 25% du total. Quel est le montant de l'emprunt ?",type:'multi',opts:[{t:"60 000 000 FCFA",c:true},{t:"40 000 000 FCFA",c:false},{t:"80 000 000 FCFA",c:false},{t:"15 000 000 FCFA",c:false}],diff:'med',piege:false,expl:"Si fonds propres = 25% du total, alors total = 20 000 000 / 0,25 = 80 000 000 FCFA. Emprunt = Total – Fonds propres = 80 000 000 – 20 000 000 = 60 000 000 FCFA.",ref:"Chapitre 1 › III › Page 7"},
  {q:"ENERGIE-VERT réalise en An3 : Chiffre d'affaires = 120 000 000 FCFA, Achats + Δ stocks = 45 000 000, Transports = 5 000 000, Services ext. = 10 000 000, Impôts & taxes = 2 000 000. Quelle est la Valeur Ajoutée ?",type:'multi',opts:[{t:"58 000 000 FCFA",c:true},{t:"63 000 000 FCFA",c:false},{t:"68 000 000 FCFA",c:false},{t:"75 000 000 FCFA",c:false}],diff:'hard',piege:false,expl:"VA = CA – (Achats + Δ stocks) – Transports – Services extérieurs – Impôts et taxes = 120 000 000 – 45 000 000 – 5 000 000 – 10 000 000 – 2 000 000 = 58 000 000 FCFA.",ref:"Chapitre 3 › III › Page 22"},
  {q:"Un entrepreneur souhaite créer une fromagerie artisanale. Il n'a pas d'historique de ventes. Il rencontre 50 clients potentiels dont 30 lui signent une promesse d'achat de 500 000 FCFA/mois chacun. Quelle méthode de calcul du CA utilise-t-il et quel est le CA mensuel prévisionnel ?",type:'multi',opts:[{t:"Méthode par les produits · CA = 30 × 500 000 = 15 000 000 FCFA/mois",c:true},{t:"Méthode par imitation · CA = 15 000 000 FCFA/mois",c:false},{t:"Méthode par les charges · CA = 15 000 000 FCFA/mois",c:false},{t:"Méthode par le marché · CA = 25 000 000 FCFA/mois",c:false}],diff:'med',piege:true,expl:"La méthode 'par les produits' correspond aux promesses d'achat conditionnelles ou fermes recueillies auprès de clients potentiels. CA mensuel = 30 × 500 000 = 15 000 000 FCFA/mois.",ref:"Chapitre 3 › 1.2 › Page 18"},
  {q:"Un entrepreneur demande un prêt bancaire pour démarrer son activité sans avoir encore réalisé une seule vente. Quelle est la recommandation du cours M19 ?",type:'multi',opts:[{t:"C'est fortement déconseillé : en cas de défaillance, les cautions (biens immobiliers) seront saisies",c:true},{t:"C'est recommandé car le prêt bancaire offre les taux les plus bas",c:false},{t:"C'est indifférent, l'entrepreneur choisit librement",c:false},{t:"C'est conseillé car cela force à avoir un business plan solide",c:false}],diff:'easy',piege:false,expl:"Le cours dit explicitement qu'il est FORTEMENT DÉCONSEILLÉ aux entrepreneurs de recourir aux prêts bancaires au démarrage sans être sûrs et certains des ventes réelles. Les cautions (biens immobiliers, biens précieux) sont saisies en cas de non-respect des remboursements.",ref:"Chapitre 4 › 7 › Page 33"},
  {q:"BIOGREEN-SA prévoit de souscrire un emprunt obligataire d'une valeur nominale de 50 000 000 FCFA émis à 95% de la valeur nominale. Pour quel montant cet emprunt sera-t-il inscrit dans le plan de financement ?",type:'multi',opts:[{t:"47 500 000 FCFA (prix d'émission = 95% × 50 000 000)",c:true},{t:"50 000 000 FCFA (valeur nominale)",c:false},{t:"52 500 000 FCFA (valeur de remboursement estimée)",c:false},{t:"Le montant effectivement reçu à la fin du mois",c:false}],diff:'hard',piege:true,expl:"PIÈGE : Les emprunts obligataires sont inscrits pour leur PRIX D'ÉMISSION (et non la valeur nominale). Prix d'émission = 50 000 000 × 95% = 47 500 000 FCFA.",ref:"Chapitre 2 › B › Page 15"},
  {q:"PLASTIK-RECYCLE a une valeur résiduelle en fin de projet composée de : valeur vénale équipement = 5 000 000 FCFA et BFR d'exploitation récupéré = 3 000 000 FCFA. Quelle est la valeur résiduelle totale à intégrer dans le calcul de la VAN ?",type:'multi',opts:[{t:"8 000 000 FCFA",c:true},{t:"5 000 000 FCFA",c:false},{t:"3 000 000 FCFA",c:false},{t:"2 000 000 FCFA",c:false}],diff:'med',piege:false,expl:"La valeur résiduelle = valeur vénale de l'investissement en fin de projet + BFR d'exploitation récupéré en fin de projet = 5 000 000 + 3 000 000 = 8 000 000 FCFA.",ref:"Chapitre 3 › 6.1 › Page 25"},
  {q:"Une startup a remporté un concours entrepreneurial et reçoit 15 000 000 FCFA de prix. Dans quel groupe de sources de financement classe-t-on cette ressource ?",type:'multi',opts:[{t:"Fonds propres (apports personnels)",c:true},{t:"Subventions publiques",c:false},{t:"Emprunts",c:false},{t:"Crowdfunding",c:false}],diff:'med',piege:true,expl:"PIÈGE : Les prix remportés lors des concours entrepreneuriaux constituent des APPORTS PERSONNELS (fonds propres) — ils permettent de démarrer librement les activités. Ils ne sont pas des subventions au sens strict du cours.",ref:"Chapitre 4 › 3 › Page 30"},
  {q:"Pour le test de sensibilité hypothèse 2 d'HYDRO-BURKINA : CA maintenu à 100 000 000 FCFA, charges augmentées de 10% (charges initiales = 70 000 000 FCFA). Quel est le résultat avant IS dans ce scénario ?",type:'multi',opts:[{t:"23 000 000 FCFA",c:true},{t:"30 000 000 FCFA",c:false},{t:"7 000 000 FCFA",c:false},{t:"37 000 000 FCFA",c:false}],diff:'hard',piege:false,expl:"Charges après hausse 10% = 70 000 000 × 1,10 = 77 000 000 FCFA. Résultat avant IS = CA – Charges = 100 000 000 – 77 000 000 = 23 000 000 FCFA.",ref:"Chapitre 3 › VII › Page 27"},
  {q:"SOLAIRE-INVEST veut élaborer son plan de financement initial. En quelle étape faut-il calculer le BFR selon le cours ?",type:'multi',opts:[{t:"Étape 3 : après avoir budgétisé les frais de création et recensé les investissements",c:true},{t:"Étape 1 : en premier lieu avant tout autre calcul",c:false},{t:"Étape 6 : à la toute fin après l'équilibrage",c:false},{t:"Étape 2 : avant les investissements mais après les frais de création",c:false}],diff:'med',piege:false,expl:"Le cours donne 6 étapes : 1) Budgétiser frais de création, 2) Recenser investissements, 3) Calculer le BFR, 4) Recenser les apports, 5) Rechercher les financements, 6) Équilibrer et analyser. Le BFR est donc à l'étape 3.",ref:"Chapitre 2 › 2.1.2 › Page 12"},
  {q:"AGROTECH-BF prévoit des distributions de dividendes de 5 000 000 FCFA en An3. Cette charge doit-elle figurer dans les 'emplois' ou les 'ressources' du plan de financement ?",type:'multi',opts:[{t:"Dans les emplois (besoins), car c'est une amputation de l'autofinancement",c:true},{t:"Dans les ressources, car c'est un flux sortant de l'entreprise",c:false},{t:"Uniquement dans le compte de résultat",c:false},{t:"Cela n'apparaît pas dans le plan de financement",c:false}],diff:'hard',piege:true,expl:"Les dividendes distribués figurent dans les EMPLOIS (besoins) car c'est une amputation des ressources d'autofinancement. Alternativement, on peut inscrire en ressources une CAF nette de dividendes versés aux actionnaires.",ref:"Chapitre 2 › 2.2.2 › Page 14"},
  {q:"INNOV-SAHEL réalise des ventes de 50 000 000 FCFA/an. Son BFR représente 15% du CA (ratio sectoriel). Quel est le BFR prévisionnel ?",type:'multi',opts:[{t:"7 500 000 FCFA",c:true},{t:"5 000 000 FCFA",c:false},{t:"15 000 000 FCFA",c:false},{t:"750 000 FCFA",c:false}],diff:'easy',piege:false,expl:"BFR = Ratio BFR/CA × CA = 15% × 50 000 000 = 7 500 000 FCFA. Le cours mentionne qu'on peut évaluer les besoins supplémentaires à partir du ratio BFR/CA observé par le passé.",ref:"Chapitre 2 › 2.2.2 › Page 14"},

  {q:"[Q35] L'élaboration de plan financier comprend plusieurs niveaux et ce en fonction de l'horizon de planification retenue qui peut être : (plusieurs réponses possibles)",type:'multi',opts:[{t:"L'horizon de court terme de 1 an.",c:true},{t:"L'horizon de moyen terme allant de 2 à 3 ans.",c:true},{t:"L'horizon de long terme allant de 4 à 10 ans.",c:false},{t:"L'horizon de moyen et long terme allant de 3 à 5 ans.",c:true}],diff:'hard',piege:true,expl:"✅ Réponses A, B et D. Les horizons sont : court terme (1 an), moyen terme (2–3 ans), et moyen & long terme (3–5 ans). L'horizon 'long terme allant de 4 à 10 ans' (C) n'est pas mentionné dans le cours comme horizon standard — le cours parle de 3 à 5 ans maximum.",ref:"Sujet Examen UE7 › Q35 & Chapitre 1 › II › Page 7"},

const series=[serie1,serie2,serie3];
const STORAGE_KEY='QCM_PROGRESS_M19';
let currentSerie=0,currentQ=0,sessionQs=[],answers={},validated={},markedWrong={},wrongList=[],isRetryMode=false,pendingResume=null;
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({serie:currentSerie,question:currentQ,answers,validated,markedWrong,wrongList,isRetryMode,sessionOrder:sessionQs.map(q=>q.origIdx)}));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function clearProgress(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function checkResume(){const saved=loadProgress();if(!saved||Object.keys(saved.validated||{}).length===0)return;pendingResume=saved;const names=['Série 1 — Théorie','Série 2 — Cas Pratiques','Série 3 — Examen Réel'];document.getElementById('resumeInfo').textContent=(names[saved.serie]||'Série '+(saved.serie+1))+' · Question '+(saved.question+1);document.getElementById('resumeOverlay').style.display='flex';}
function doResume(){document.getElementById('resumeOverlay').style.display='none';if(!pendingResume)return;const s=pendingResume;currentSerie=s.serie;currentQ=s.question;answers=s.answers||{};validated=s.validated||{};markedWrong=s.markedWrong||{};wrongList=s.wrongList||[];isRetryMode=s.isRetryMode||false;const src=series[currentSerie];sessionQs=(s.sessionOrder||[]).map(origIdx=>{const q=src[origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});updateSerieButtons();updateScoreLive();renderQuestion();showSection('qcm');}
function doRestart(){document.getElementById('resumeOverlay').style.display='none';clearProgress();pendingResume=null;loadSerie(0);}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateSerieButtons(){document.querySelectorAll('.serie-btn').forEach((b,i)=>b.classList.toggle('active',i===currentSerie&&!isRetryMode));}
function updateScoreLive(){const vKeys=Object.keys(validated);let correct=0;sessionQs.forEach((q,i)=>{if(!validated[i])return;const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);if(cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x)))correct++;});const vCount=vKeys.length;document.getElementById('liveCorrect').textContent=correct;document.getElementById('liveWrong').textContent=vCount-correct;document.getElementById('liveTotal').textContent=sessionQs.length;document.getElementById('livePct').textContent=vCount>0?Math.round((correct/vCount)*100)+'%':'—';}
function loadSerie(idx,retry=false){currentSerie=idx;isRetryMode=retry;currentQ=0;answers={};validated={};if(!retry){wrongList=[];const shuffledIdxs=shuffleArray(series[idx].map((_,i)=>i));sessionQs=shuffledIdxs.map(origIdx=>{const q=series[idx][origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});}updateSerieButtons();updateScoreLive();renderQuestion();clearProgress();}
function loadRetry(){if(wrongList.length===0)return;isRetryMode=true;currentQ=0;answers={};validated={};sessionQs=wrongList.map(qi=>{const q=series[currentSerie][qi];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx:qi};});updateScoreLive();renderQuestion();}
function renderQuestion(){const container=document.getElementById('qcmContainer');const total=sessionQs.length;const pct=total>0?((currentQ+1)/total)*100:0;document.getElementById('qcmProgressBar').style.width=pct+'%';if(currentQ>=total){showScore();return;}const q=sessionQs[currentQ];const isVal=!!validated[currentQ];const sel=answers[currentQ]||[];const isMarked=!!markedWrong[q.origIdx];const letters=['A','B','C','D','E','F'];const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const isCorrect=isVal&&cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));let optsHtml='';q.shuffledOpts.forEach((opt,i)=>{let cls='option-item';if(isVal){cls+=' disabled';if(opt.c)cls+=' correct';else if(sel.includes(i))cls+=' wrong';}else if(sel.includes(i))cls+=' selected';optsHtml+=`<button class="${cls}" onclick="selectOpt(${i})" ${isVal?'disabled':''}><div class="option-letter">${letters[i]}</div><div class="option-text">${opt.t}</div></button>`;});const feedbackHtml=isVal?`<div class="feedback-banner ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ Bonne réponse !':'❌ Mauvaise réponse'}</div>`:'';const explHtml=isVal?`<div class="explanation-box"><div class="explanation-title">💡 Explication</div><div class="explanation-text">${q.expl}</div><span class="page-ref">📄 ${q.ref}</span></div>`:'';const multiHint=`<div class="multi-hint">⚠ Sélectionnez la ou les réponses correctes</div>`;const markLabel=isMarked?'✕ Retirer marque':'🔶 Marquer';container.innerHTML=`<div class="question-card"><div class="question-meta"><span class="q-num">Q${currentQ+1}/${total}${isRetryMode?' (Révision)':''}</span><span class="badge badge-${q.diff==='easy'?'easy':q.diff==='med'?'med':'hard'}">${q.diff==='easy'?'🟢 Facile':q.diff==='med'?'🟡 Moyen':'🔴 Difficile'}</span>${q.piege?'<span class="badge badge-piege">⚠ PIÈGE POSSIBLE</span>':''}${isMarked?'<span class="badge badge-marked">🔶 Marquée</span>':''}</div><div class="question-text">${q.q}</div>${multiHint}<div class="options-list">${optsHtml}</div>${feedbackHtml}${explHtml}</div><div class="qcm-nav">${!isVal?`<button class="btn-primary" onclick="validateQ()" ${sel.length===0?'disabled':''}>✓ Valider</button>`:`<button class="btn-primary" onclick="nextQ()">Suivant →</button>`}${currentQ>0?`<button class="btn-secondary" onclick="prevQ()">← Précédent</button>`:''}<button class="mark-btn ${isMarked?'marked':''}" onclick="toggleMark(${q.origIdx})">${markLabel}</button></div>`;}
function selectOpt(i){if(validated[currentQ])return;const q=sessionQs[currentQ];if(!answers[currentQ])answers[currentQ]=[];const idx=answers[currentQ].indexOf(i);if(idx>-1)answers[currentQ].splice(idx,1);else answers[currentQ].push(i);renderQuestion();}
function validateQ(){const q=sessionQs[currentQ];const sel=answers[currentQ]||[];if(sel.length===0)return;validated[currentQ]=true;const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const ok=cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));if(!ok&&!wrongList.includes(q.origIdx))wrongList.push(q.origIdx);if(!ok)markedWrong[q.origIdx]=true;updateScoreLive();saveProgress();renderQuestion();}
function nextQ(){currentQ++;saveProgress();renderQuestion();}
function prevQ(){if(currentQ>0){currentQ--;saveProgress();renderQuestion();}}
function toggleMark(origIdx){markedWrong[origIdx]=!markedWrong[origIdx];if(!markedWrong[origIdx]){const idx=wrongList.indexOf(origIdx);if(idx>-1)wrongList.splice(idx,1);}else if(!wrongList.includes(origIdx))wrongList.push(origIdx);saveProgress();renderQuestion();}
function showScore(){const total=sessionQs.length;const correct=sessionQs.filter((q,i)=>{const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);return cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));}).length;const wrong=total-correct;const pct=Math.round((correct/total)*100);const markedCount=Object.values(markedWrong).filter(v=>v).length;clearProgress();document.getElementById('qcmContainer').innerHTML=`<div class="score-card" id="scoreCard" style="display:block"><div class="score-big">${pct}%</div><div class="score-label">${isRetryMode?'Session de révision terminée':'Série '+(currentSerie+1)+' terminée'}</div><div class="score-stats"><div class="score-stat green"><div class="score-stat-val">${correct}</div><div class="score-stat-label">✅ Correct</div></div><div class="score-stat red"><div class="score-stat-val">${wrong}</div><div class="score-stat-label">❌ Incorrect</div></div><div class="score-stat"><div class="score-stat-val">${total}</div><div class="score-stat-label">Total</div></div>${markedCount>0?`<div class="score-stat orange"><div class="score-stat-val">${markedCount}</div><div class="score-stat-label">🔶 Marquées</div></div>`:''}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn-primary" onclick="loadSerie(${currentSerie})">🔄 Recommencer</button>${wrongList.length>0?`<button class="btn-retry" onclick="loadRetry()">🎯 Questions ratées (${wrongList.length})</button>`:''}</div><div style="margin-top:16px;font-size:12px;color:var(--text3)">${pct>=70?'🎉 Excellent !':pct>=50?'📚 Continuez à réviser.':'⚠ Révisez les fiches et recommencez.'}</div></div>`;document.getElementById('qcmProgressBar').style.width='100%';}

// ✏ ZONE E — buildMethode
function buildMethode(){const container=document.getElementById('section-methode');container.innerHTML=`
<div style="margin-bottom:20px">
  <div style="font-family:'DM Serif Display',serif;font-size:22px;color:var(--text);margin-bottom:6px">🔬 Méthode & Anti-Pièges — M19 Plan Financier</div>

</div>

<div class="methode-grid">
  <div class="methode-card">
    <div class="methode-card-title">⚠ Mots-Pièges Fatals</div>
    <span class="piege-word">moyen terme</span>
    <span class="piege-word">constant</span>
    <span class="piege-word">court terme seulement</span>
    <span class="piege-word">invariable</span>
    <span class="piege-word">rigidité</span>
    <span class="piege-word">crédit-bail</span>

  <div class="methode-card">
    <div class="methode-card-title">🔢 Chiffres-Clés à Mémoriser</div>

      <tr><th>Valeur</th><th>Signification</th></tr>
      <tr><td>3–5 ans</td><td>Durée standard du plan financier</td></tr>
      <tr><td>5–15%</td><td>Fourchette des imprévus sur investissements</td></tr>
      <tr><td>25–30%</td><td>Part minimale des fonds propres dans le financement global</td></tr>
      <tr><td>16%</td><td>Charges sociales sur le salaire brut</td></tr>
      <tr><td>38%</td><td>Taux IBIC (Impôt sur Bénéfices Industriels et Commerciaux)</td></tr>
      <tr><td>10%</td><td>Variation utilisée dans les tests de sensibilité</td></tr>
      <tr><td>2 mois</td><td>Hypothèse standard pour le calcul du BFR initial</td></tr>
    </table>
  </div>
</div>

<div class="methode-card" style="margin-bottom:12px">
  <div class="methode-card-title">📐 Schéma : Élaboration Plan Financement Initial (Étapes)</div>
  <div class="schema-step"><div class="schema-num">1</div><div class="schema-text"><strong>Budgétiser les frais de création</strong> (immatriculation, EIES, autorisations)</div></div>
  <div class="schema-step"><div class="schema-num">2</div><div class="schema-text"><strong>Recenser et évaluer tous les investissements</strong> TTC (inclure transport maritime + taxes douanières + TVA + imprévus 5–15%)</div></div>
  <div class="schema-step"><div class="schema-num">3</div><div class="schema-text"><strong>Calculer le BFR au démarrage</strong> (généralement 2 mois de stocks + 2 mois salaires + 2 mois frais généraux)</div></div>
  <div class="schema-step"><div class="schema-num">4</div><div class="schema-text"><strong>Recenser les apports des associés</strong> (numéraire, nature, compte courant) → vérifier ≥ 25–30% du total</div></div>
  <div class="schema-step"><div class="schema-num">5</div><div class="schema-text"><strong>Rechercher les financements externes</strong> (emprunts, subventions) → Emprunt = Total besoins – Fonds propres</div></div>
  <div class="schema-step"><div class="schema-num">6</div><div class="schema-text"><strong>Équilibrer et analyser la cohérence</strong> (Ressources ≥ Besoins, vérifier la trésorerie cumulée positive)</div></div>
</div>

<div class="methode-card" style="margin-bottom:12px">
  <div class="methode-card-title">📊 Schéma : Compte d'Exploitation Prévisionnel (Cascade)</div>
  <div class="schema-step"><div class="schema-num">→</div><div class="schema-text"><strong>Chiffre d'Affaires</strong><br>− Achats et variations de stocks<br>− Transports consommés<br>− Services extérieurs A&B<br>− Impôts et taxes<br>= <strong style="color:var(--accent)">VALEUR AJOUTÉE (VA)</strong></div></div>
  <div class="schema-step"><div class="schema-num">→</div><div class="schema-text"><strong>Valeur Ajoutée</strong><br>− Charges du personnel (SB + 16% charges sociales)<br>= <strong style="color:var(--accent)">EBE (Excédent Brut d'Exploitation)</strong></div></div>
  <div class="schema-step"><div class="schema-num">→</div><div class="schema-text"><strong>EBE</strong><br>− Dotations aux amortissements<br>= <strong style="color:var(--accent)">RÉSULTAT D'EXPLOITATION</strong></div></div>
  <div class="schema-step"><div class="schema-num">→</div><div class="schema-text"><strong>Résultat d'exploitation</strong><br>− Frais financiers (intérêts emprunts)<br>= <strong style="color:var(--accent)">RÉSULTAT AVANT IMPÔTS</strong></div></div>
  <div class="schema-step"><div class="schema-num">→</div><div class="schema-text"><strong>Résultat avant impôts</strong><br>− IBIC (38%)<br>= <strong style="color:var(--accent)">RÉSULTAT NET</strong></div></div>
</div>

<div class="methode-grid">
  <div class="methode-card">
    <div class="methode-card-title">🎯 Schéma Décisionnel VAN/TRI</div>
    <div class="schema-step"><div class="schema-num">?</div><div class="schema-text"><strong>VAN &gt; 0 ?</strong><br>OUI → projet rentable ✅<br>NON → projet à rejeter ❌</div></div>
    <div class="schema-step"><div class="schema-num">?</div><div class="schema-text"><strong>Comparer 2 projets (même coût) ?</strong><br>→ Choisir le TRI le plus élevé</div></div>
    <div class="schema-step"><div class="schema-num">?</div><div class="schema-text"><strong>TRI vs coût du capital ?</strong><br>TRI &gt; coût capital → rentable ✅<br>TRI &lt; coût capital → non rentable ❌</div></div>
    <div class="piege-box"><div class="piege-title">⚠ PIÈGE TRI</div><div class="piege-text">Le TRI ne se calcule PAS directement par formule — il faut itérer (tâtonner) ou utiliser un logiciel.</div></div>
  </div>
  <div class="methode-card">
    <div class="methode-card-title">🌱 Sources de Financement — Classification</div>
    <div class="def-grid">
      <div class="def-item"><div class="def-term">Groupe 1 — Fonds Propres</div><div class="def-text">Apport personnel, love money, concours, crowdfunding, prêt d'honneur (taux 0%)</div></div>
      <div class="def-item"><div class="def-term">Groupe 2 — Emprunts</div><div class="def-text">Prêt bancaire (⚠ risqué au démarrage), microcrédit, emprunts MLT</div></div>
    </div>
    <div class="def-item" style="margin-top:8px"><div class="def-term">Groupe 3 — Subventions</div><div class="def-text">Aides publiques, subventions d'équipement (inscrire l'année de perception, montant total)</div></div>
    <div class="piege-box" style="margin-top:10px"><div class="piege-title">⚠ PIÈGE Q40 EXAMEN</div><div class="piege-text">Réponse correcte = <strong>Emprunt + Subvention + Fonds propres</strong>. Ni crédit-bail, ni leasing ne sont des groupes distincts.</div></div>
  </div>
</div>

<div class="methode-card" style="margin-bottom:12px">
  <div class="methode-card-title">🔬 Confusions Classiques M19</div>
  <table class="chiffres-table">
    <tr><th>Confusion</th><th>Bonne réponse</th><th>Piège courant</th></tr>
    <tr><td>Durée plan financier</td><td>Long terme (3–5 ans)</td><td>Dire "moyen terme" → FAUX</td></tr>
    <tr><td>Amortissements</td><td>Comptes de production uniquement</td><td>Penser qu'ils sont dans la trésorerie → FAUX</td></tr>
    <tr><td>VAN = 0</td><td>TRI = taux d'actualisation (neutre)</td><td>Penser que c'est rentable → FAUX</td></tr>
    <tr><td>Plan de trésorerie</td><td>Varie : exploitation + investissement + financement</td><td>Dire "constant" ou "court terme uniquement" → FAUX</td></tr>
    <tr><td>Prêt d'honneur</td><td>Taux 0%, sans garantie</td><td>Confondre avec prêt bancaire classique</td></tr>
    <tr><td>BFR initial</td><td>Inclut stocks + salaires + frais généraux (2 mois)</td><td>Penser que c'est juste les stocks</td></tr>
    <tr><td>Charges sociales</td><td>16% du Salaire Brut</td><td>Utiliser 18% ou 10%</td></tr>
    <tr><td>Travaux dans local loué</td><td>Installations générales, agencement, aménagements divers</td><td>Choisir "Bâtiments" → FAUX</td></tr>
  </table>
</div>

<div class="methode-card">
  <div class="methode-card-title">💡 Formules Essentielles M19</div>
  <div class="key-box"><div class="key-title">Formules à maîtriser</div><div class="key-text">
    <ul>
      <li><strong>Trésorerie fin période</strong> = Trésorerie début + Solde plan financement</li>
      <li><strong>BFR initial</strong> = Total besoins démarrage – Dettes fournisseurs</li>
      <li><strong>VAN</strong> = –C + Σ[Rt / (1+i)^t] + V/(1+i)^n</li>
      <li><strong>CAF d'exploitation</strong> = EBE – Impôt sur les sociétés/résultat d'exploitation</li>
      <li><strong>Charges de personnel</strong> = Salaire Brut × 1,16</li>
      <li><strong>IBIC</strong> = Résultat avant impôts × 38%</li>
      <li><strong>Résultat Net</strong> = Résultat avant impôts × (1 – 38%)</li>
      <li><strong>Investissement TTC</strong> = Prix HT × (1 + taux de taxe applicable)</li>
      <li><strong>Imprévus</strong> = Coût total investissements × (5% à 15%)</li>
    </ul>
  </div></div>
</div>
`;}
