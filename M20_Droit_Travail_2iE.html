  {q:"S'il survient une modification dans la situation juridique de l'employeur (vente, fusion…), que deviennent les contrats de travail en cours ?",type:'multi',opts:[{t:"Ils sont automatiquement rompus",c:false},{t:"Ils sont suspendus jusqu'à la fin de la transition",c:false},{t:"Ils subissent une modification automatique",c:false},{t:"Ils subsistent entre le nouvel employeur et le personnel",c:true}],diff:'med',piege:true,expl:"Art.91 CTB : tous les contrats de travail en cours au jour de la modification subsistent entre le nouvel employeur et le personnel. C'est la règle de la permanence du contrat de travail.",ref:"Chap. 4 › I › Page 21"},
  {q:"La caractéristique essentielle du contrat de travail à durée indéterminée est :",type:'multi',opts:[{t:"Le caractère indéterminé du contrat",c:false},{t:"L'interdiction de toute rupture unilatérale",c:false},{t:"La faculté de résiliation unilatérale et réciproque laissée à chacun des contractants",c:true},{t:"La faculté de résiliation de commun accord uniquement",c:false}],diff:'med',piege:true,expl:"La caractéristique essentielle du CDI est la FACULTÉ de résiliation unilatérale ET réciproque. Attention : ce n'est pas simplement le caractère indéterminé de la durée.",ref:"Chap. 5 › I › Page 26"},
  {q:"Le préavis a pour objet de permettre aux parties au contrat :",type:'multi',opts:[{t:"D'apprécier les compétences du travailleur",c:false},{t:"D'apprécier les conditions de travail",c:false},{t:"De donner à l'autre partie un délai pour prendre les mesures propres à pallier les conséquences de la rupture",c:true},{t:"D'apprécier la qualité du lien de subordination",c:false}],diff:'easy',piege:false,expl:"Le préavis donne à l'autre partie le temps nécessaire pour se préparer aux conséquences de la rupture : recherche d'emploi pour le travailleur, remplacement pour l'employeur.",ref:"Chap. 5 › I.2 › Page 26"},
  {q:"La durée du préavis pour les agents de maîtrise, cadres et assimilés est de :",type:'multi',opts:[{t:"8 jours",c:false},{t:"1 mois",c:false},{t:"2 mois",c:false},{t:"3 mois",c:true}],diff:'easy',piege:false,expl:"CCIP Art.30 : agents de maîtrise, cadres et assimilés = 3 mois de préavis. Personnel non mensuel = 8 jours. Personnel mensuel = 1 mois.",ref:"Chap. 5 › I.2.a › Page 26"},
  {q:"Le licenciement est dit IRRÉGULIER lorsque :",type:'multi',opts:[{t:"Il est fondé sur la religion du travailleur",c:false},{t:"Il est motivé par l'appartenance syndicale",c:false},{t:"La procédure n'a pas été respectée",c:true},{t:"Il est motivé par les opinions politiques",c:false}],diff:'med',piege:true,expl:"Irrégulier = problème de FORME (procédure non respectée). Abusif = problème de FOND (motif illégitime comme la religion, le syndicat, les opinions). Distinction fondamentale à mémoriser.",ref:"Chap. 5 › I.2 › Page 28"},
  {q:"Le licenciement est dit ABUSIF lorsque (plusieurs réponses possibles) :",type:'multi',opts:[{t:"Motivé par la grossesse de la travailleuse",c:true},{t:"La procédure n'a pas été respectée",c:false},{t:"Motivé par le dépôt d'une plainte du travailleur contre l'employeur",c:true},{t:"Motivé par la baisse de rendement",c:false}],diff:'hard',piege:true,expl:"Licenciement abusif = motif illégitime : grossesse, syndicat, opinions, recours contre l'employeur. La baisse de rendement est un motif professionnel LÉGITIME. La procédure non respectée = irrégulier (pas abusif).",ref:"Chap. 5 › I.2 › Page 28"},
  {q:"En cas de DÉMISSION, le travailleur peut prétendre à (plusieurs réponses possibles) :",type:'multi',opts:[{t:"Son salaire de présence",c:true},{t:"Son certificat de travail",c:true},{t:"Son indemnité compensatrice de préavis",c:false},{t:"Son indemnité de licenciement",c:false}],diff:'hard',piege:true,expl:"Le travailleur démissionnaire reçoit son salaire de présence et son certificat de travail. Il ne reçoit PAS d'indemnité compensatrice de préavis (car c'est lui qui démissionne) ni d'indemnité de licenciement.",ref:"Chap. 5 › II › Page 29"},
  {q:"À l'arrivée du terme d'un CDD, le travailleur a droit à (plusieurs réponses possibles) :",type:'multi',opts:[{t:"Indemnité de fin de contrat",c:true},{t:"Indemnité compensatrice de congé s'il en existe",c:true},{t:"Indemnité compensatrice de préavis",c:false},{t:"Bonification d'échelon après 15 ans d'ancienneté",c:false}],diff:'hard',piege:true,expl:"À l'arrivée du terme d'un CDD, le travailleur reçoit l'indemnité de fin de contrat et l'indemnité compensatrice de congé si applicable. Il ne bénéficie PAS du préavis (inconvénient du CDD) ni d'une bonification d'échelon.",ref:"Chap. 5 › II › Page 29"},
  {q:"Toute femme enceinte dont l'état a été dûment constaté a le droit de :",type:'multi',opts:[{t:"S'absenter sans autorisation préalable de son employeur",c:false},{t:"Demander une augmentation de salaire",c:false},{t:"Suspendre son contrat de travail sur prescription médicale",c:true},{t:"Demander de l'aide à un autre travailleur",c:false}],diff:'med',piege:true,expl:"Art.144 CTB : la femme enceinte peut SUSPENDRE son travail sur prescription médicale, sans que cela soit une cause de rupture de contrat. Elle ne peut pas s'absenter sans autorisation.",ref:"Chap. 5 › I.2.d › Page 28"},
  {q:"Le contrat d'apprentissage est obligatoirement soumis au visa de :",type:'multi',opts:[{t:"Le Ministre du Travail",c:false},{t:"L'Inspecteur du Travail du ressort",c:true},{t:"L'A.N.P.E.",c:false},{t:"Le tribunal du travail",c:false}],diff:'med',piege:false,expl:"Le contrat d'apprentissage doit être soumis au visa de l'Inspecteur du Travail du ressort. C'est lui qui procède aux vérifications. Après visa, il est enregistré à l'A.N.P.E.",ref:"Chap. 6 › I › Page 31"},
  {q:"En cas d'OMISSION du visa du contrat d'apprentissage, que se passe-t-il ?",type:'multi',opts:[{t:"Le contrat d'apprentissage est nul et sans effet",c:false},{t:"Le maître doit verser une allocation d'apprentissage",c:false},{t:"Le contrat est requalifié en contrat de travail et le maître doit verser un salaire ≥ SMIG",c:true},{t:"Le contrat reste valable mais est régularisé dans les 30 jours",c:false}],diff:'hard',piege:false,expl:"En cas d'omission du visa, il n'y a pas de contrat d'apprentissage mais un contrat de travail. Le maître doit alors payer un salaire au moins égal au SMIG (et non une simple allocation d'apprentissage).",ref:"Chap. 6 › I › Page 32"},
  {q:"Le différend individuel du travail oppose :",type:'multi',opts:[{t:"Un groupement de travailleurs à un groupement d'employeurs",c:false},{t:"Un ou plusieurs travailleurs à leurs employeurs pour la reconnaissance d'un droit individuel",c:true},{t:"Un groupement de travailleurs à un employeur dans lequel des intérêts collectifs sont en jeu",c:false},{t:"Plusieurs travailleurs à un employeur sur l'interprétation d'une convention collective",c:false}],diff:'med',piege:true,expl:"Art.319 CTB : le différend individuel oppose un ou plusieurs travailleurs à leurs employeurs à l'occasion de l'exécution du contrat de travail, pour la reconnaissance d'un DROIT INDIVIDUEL.",ref:"Partie 2 › Chap. 1 › Page 38"},
  {q:"Tout conflit collectif circonscrit dans le ressort territorial d'une Inspection du Travail doit être notifié à :",type:'multi',opts:[{t:"Le Secrétaire Général du ministère chargé du travail",c:false},{t:"L'inspecteur ou le contrôleur du travail du ressort",c:true},{t:"Le Ministre chargé du travail",c:false},{t:"Le Directeur Général du Travail",c:false}],diff:'med',piege:true,expl:"Si le conflit collectif est limité à un seul ressort territorial → notification à l'Inspecteur/Contrôleur du travail du ressort. Si le conflit s'étend sur plusieurs ressorts → Directeur Général du Travail.",ref:"Partie 2 › Chap. 2 › I › Page 42"},
  {q:"Le conflit collectif du travail oppose :",type:'multi',opts:[{t:"Plusieurs travailleurs à un employeur (intérêts individuels)",c:false},{t:"Un groupement de travailleurs à un groupement d'employeurs ou à un employeur isolément dans lequel des intérêts COLLECTIFS sont en jeu",c:true},{t:"Un ou plusieurs travailleurs à leur employeur pour la reconnaissance d'un droit individuel",c:false},{t:"Un groupement de travailleurs à un employeur dans lequel des intérêts INDIVIDUELS sont en jeu",c:false}],diff:'hard',piege:true,expl:"Le conflit collectif implique OBLIGATOIREMENT des intérêts COLLECTIFS (pas individuels). L'option 'intérêts individuels' est un piège classique à éviter.",ref:"Partie 2 › Chap. 2 › Page 41"},
  {q:"Dans la procédure de règlement du conflit collectif, le conseil d'arbitrage est désigné par :",type:'multi',opts:[{t:"Le Directeur Général du Travail",c:false},{t:"L'inspecteur ou le contrôleur du travail du ressort",c:false},{t:"Le Ministre chargé du travail",c:true},{t:"Le Ministre chargé de l'emploi",c:false}],diff:'med',piege:true,expl:"C'est le MINISTRE CHARGÉ DU TRAVAIL qui désigne le conseil d'arbitrage dans les 10 jours suivant la réception du PV de non-conciliation.",ref:"Partie 2 › Chap. 2 › I › Page 43"},
  {q:"Lorsque le conflit collectif s'étend sur plusieurs ressorts territoriaux, il est notifié au :",type:'multi',opts:[{t:"Inspecteur ou contrôleur du travail",c:false},{t:"Conseil d'arbitrage",c:false},{t:"Ministre chargé du travail",c:false},{t:"Directeur Général du Travail",c:true}],diff:'med',piege:true,expl:"Si le conflit dépasse un seul ressort territorial, c'est le DIRECTEUR GÉNÉRAL DU TRAVAIL qui est compétent pour la conciliation (pas le Ministre, pas l'Inspecteur).",ref:"Partie 2 › Chap. 2 › I › Page 42"},
  {q:"La source du droit désigne :",type:'multi',opts:[{t:"L'ensemble des règles applicables aux cadres dans une entreprise donnée",c:false},{t:"L'ensemble des règles applicables au monde du travail",c:false},{t:"L'ensemble des règles applicables aux travailleurs étrangers",c:false},{t:"L'ensemble des règles applicables dans un État à un moment donné",c:true}],diff:'easy',piege:true,expl:"La 'source du droit' (notion générale de droit) désigne l'ensemble des règles applicables dans un État à un moment donné. Ne pas confondre avec le 'droit du travail' qui lui est plus spécifique.",ref:"Introduction › Page 6"},
  {q:"La durée légale de travail hebdomadaire au Burkina Faso est de :",type:'multi',opts:[{t:"35 heures",c:false},{t:"40 heures",c:true},{t:"45 heures",c:false},{t:"48 heures",c:false}],diff:'easy',piege:false,expl:"Art.137 CTB : la durée légale de travail dans les établissements publics ou privés ne peut excéder 40 heures par semaine.",ref:"Partie 3 › Chap. 1 › Page 47"},
  {q:"Le repos hebdomadaire est de :",type:'multi',opts:[{t:"12 heures consécutives",c:false},{t:"24 heures minimum par semaine",c:true},{t:"48 heures minimum par semaine",c:false},{t:"36 heures consécutives",c:false}],diff:'easy',piege:false,expl:"Art.155 CTB : le repos hebdomadaire est de 24 heures minimum par semaine et a lieu en principe le dimanche.",ref:"Partie 3 › Chap. 2 › I › Page 55"},
  {q:"La durée de la période d'essai pour les agents de maîtrise, techniciens et ingénieurs est de :",type:'multi',opts:[{t:"8 jours",c:false},{t:"1 mois",c:false},{t:"3 mois",c:true},{t:"5 mois",c:false}],diff:'easy',piege:true,expl:"CCIP Art.12 : agents de maîtrise, techniciens, ingénieurs = 3 mois maximum. Attention : 5 mois n'existe pas dans le texte.",ref:"Chap. 2 › II.2 › Page 16"},
  {q:"La majoration des heures supplémentaires pour chacune des 8 premières heures de jour (jours ordinaires) est de :",type:'multi',opts:[{t:"10%",c:false},{t:"15%",c:true},{t:"35%",c:false},{t:"50%",c:false}],diff:'med',piege:false,expl:"Arrêté 2007-003 : les 8 premières heures supplémentaires de jour donnent lieu à une majoration de 15%. Les heures suivantes : 35%. Jours de repos/fériés : 60%.",ref:"Partie 3 › Chap. 2 › II.1 › Page 52"},
  {q:"La majoration des heures supplémentaires effectuées la nuit pendant les jours ordinaires est de :",type:'multi',opts:[{t:"35%",c:false},{t:"50%",c:true},{t:"60%",c:false},{t:"120%",c:false}],diff:'med',piege:true,expl:"Arrêté 2007-003 : heures supplémentaires de NUIT les jours ordinaires = 50%. Pour les jours de repos et fériés de nuit = 120%.",ref:"Partie 3 › Chap. 2 › II.2 › Page 53"},
  {q:"Le contrat de travail à durée déterminée abusivement renouvelé se transforme en :",type:'multi',opts:[{t:"Contrat d'apprentissage",c:false},{t:"Contrat de mandat",c:false},{t:"Contrat de travail à durée indéterminée",c:true},{t:"Contrat d'entreprise",c:false}],diff:'easy',piege:false,expl:"Art.54 CTB : le CDD abusivement renouvelé se transforme automatiquement en CDI. C'est une protection essentielle du travailleur contre l'abus de contrats précaires.",ref:"Chap. 2 › I.1.b › Page 15"},
  {q:"Le contrat de travail est conclu 'intuiti personae' du côté du :",type:'multi',opts:[{t:"Employeur uniquement",c:false},{t:"Travailleur uniquement",c:true},{t:"Des deux parties",c:false},{t:"Ni de l'un ni de l'autre",c:false}],diff:'med',piege:true,expl:"Le contrat de travail est conclu intuiti personae DU CÔTÉ DU TRAVAILLEUR seulement. C'est pourquoi en cas de modification de la situation juridique de l'employeur, les contrats subsistent.",ref:"Chap. 4 › I.1 › Page 21"},
  {q:"Quels éléments sont inclus dans le calcul de l'indemnité compensatrice de préavis ? (plusieurs réponses)",type:'multi',opts:[{t:"Le salaire catégoriel et le sursalaire",c:true},{t:"La prime d'ancienneté",c:true},{t:"L'indemnité de transport",c:false},{t:"Les indemnités de fonction",c:true}],diff:'hard',piege:true,expl:"Inclus : salaire catégoriel + sursalaire + prime d'ancienneté + heures supplémentaires + indemnités de fonction. EXCLUS : primes de remboursement de frais (transport, logement, rendement, assiduité).",ref:"Chap. 5 › I.2.c › Page 27"},
  {q:"Les heures supplémentaires sont limitées à quel maximum hebdomadaire ?",type:'multi',opts:[{t:"10 heures",c:false},{t:"15 heures",c:false},{t:"20 heures",c:true},{t:"25 heures",c:false}],diff:'med',piege:false,expl:"Les heures supplémentaires ne peuvent être effectuées que dans la limite de 20 heures maximum par semaine.",ref:"Partie 3 › Chap. 2 › Page 50"},
  {q:"Pendant la période d'essai, les parties peuvent rompre le contrat :",type:'multi',opts:[{t:"Avec préavis d'1 mois obligatoire",c:false},{t:"Sans indemnités ni préavis",c:true},{t:"Avec versement d'une indemnité de rupture",c:false},{t:"Uniquement d'un commun accord",c:false}],diff:'easy',piege:false,expl:"La période d'essai offre aux deux parties la faculté réciproque de rompre le contrat sans indemnités ni préavis — c'est l'un de ses avantages pour les deux parties.",ref:"Chap. 2 › II › Page 16"},
  {q:"La durée du contrat d'apprentissage ne peut être supérieure à :",type:'multi',opts:[{t:"1 an",c:false},{t:"2 ans",c:false},{t:"3 ans",c:true},{t:"5 ans",c:false}],diff:'easy',piege:false,expl:"La durée du contrat d'apprentissage ne peut excéder 3 ans. Les deux premiers mois sont considérés comme période d'essai.",ref:"Chap. 6 › III.1 › Page 33"},
  {q:"La majoration des heures supplémentaires effectuées le jour du repos hebdomadaire (de nuit) est de :",type:'multi',opts:[{t:"60%",c:false},{t:"80%",c:false},{t:"100%",c:false},{t:"120%",c:true}],diff:'hard',piege:false,expl:"Arrêté 2007-003 : le taux maximum de majoration est de 120% pour les heures supplémentaires effectuées de nuit pendant le jour du repos hebdomadaire ou les jours fériés.",ref:"Partie 3 › Chap. 2 › II.2 › Page 53"},
  {q:"Le lock-out est une décision par laquelle un employeur interdit :",type:'multi',opts:[{t:"Aux clients l'accès de l'entreprise lors d'un conflit collectif",c:false},{t:"Aux salariés l'accès de l'entreprise lors d'un conflit collectif",c:true},{t:"Aux partenaires financiers l'accès lors d'un conflit",c:false},{t:"À l'inspection du travail l'accès lors d'un conflit",c:false}],diff:'easy',piege:true,expl:"Le lock-out concerne exclusivement les SALARIÉS. C'est l'employeur qui ferme l'accès de l'entreprise aux travailleurs pendant un conflit collectif.",ref:"Partie 2 › Chap. 2 › Art.388 › Page 44"},
  {q:"L'heure équivalente à 40h pour les gardiens de jour et de nuit est :",type:'multi',opts:[{t:"48h",c:false},{t:"56h",c:false},{t:"60h",c:false},{t:"72h",c:true}],diff:'hard',piege:false,expl:"Arrêté 2007-004 : 72 heures de présence par semaine pour les gardiens de jour et de nuit sont considérées comme équivalentes à 40 heures de travail effectif.",ref:"Partie 3 › Chap. 1 › I › Page 47"},
  {q:"La demande du visa du contrat de travail incombe à :",type:'multi',opts:[{t:"Le travailleur",c:false},{t:"L'inspection du travail d'office",c:false},{t:"L'employeur",c:true},{t:"L'A.N.P.E.",c:false}],diff:'easy',piege:false,expl:"La demande du visa incombe à l'employeur. Si ce dernier omet de le faire, le travailleur peut faire constater la nullité du contrat et réclamer des dommages-intérêts.",ref:"Chap. 2 › I.2 › Page 16"},
  {q:"L'accord de conciliation lors du règlement d'un conflit collectif est :",type:'multi',opts:[{t:"Soumis à homologation du tribunal",c:false},{t:"Immédiatement exécutoire",c:true},{t:"Exécutoire après 15 jours",c:false},{t:"Valable uniquement si toutes les parties signent",c:false}],diff:'med',piege:false,expl:"L'accord de conciliation est immédiatement exécutoire. Il est déposé au greffe du tribunal et une ampliation est remise aux parties.",ref:"Partie 2 › Chap. 2 › I › Page 43"},
  {q:"Les heures de récupération effectuées sur autorisation de l'Inspecteur du Travail sont rémunérées :",type:'multi',opts:[{t:"Avec une majoration de 15%",c:false},{t:"Avec une majoration de 25%",c:false},{t:"Au taux normal sans majoration",c:true},{t:"Avec une majoration de 50%",c:false}],diff:'med',piege:true,expl:"Les heures de RÉCUPÉRATION (autorisées par l'Inspecteur pour compenser des heures perdues) sont rémunérées au taux NORMAL, sans majoration. À distinguer des heures supplémentaires.",ref:"Partie 3 › Chap. 2 › I.2 › Page 52"},
  {q:"Combien de conditions de fond doit remplir un contrat de travail pour être valable ?",type:'multi',opts:[{t:"2 conditions",c:false},{t:"3 conditions",c:true},{t:"4 conditions",c:false},{t:"5 conditions",c:false}],diff:'med',piege:false,expl:"3 conditions de fond : 1) Capacité juridique des parties, 2) Licéité du contrat, 3) Consentement personnel et exempt de vices (erreur, dol, violence).",ref:"Chap. 2 › I › Page 14"}
];

// ✏ ZONE C — SÉRIE 2 : CAS PRATIQUES
const serie2 = [
  {q:"M. Sawadogo est engagé par une société minière comme agent de sécurité. La société change de propriétaire par cession de parts. M. Sawadogo peut-il continuer à travailler normalement ?",type:'multi',opts:[{t:"Non, la cession entraîne automatiquement la rupture de son contrat",c:false},{t:"Oui, son contrat subsiste avec le nouveau propriétaire (Art.91 CTB)",c:true},{t:"Son contrat est suspendu jusqu'à la fin des formalités",c:false},{t:"Il doit renégocier un nouveau contrat avec le nouvel employeur",c:false}],diff:'med',piege:false,expl:"Art.91 CTB : toute modification dans la situation juridique de l'employeur (dont la cession) laisse subsister tous les contrats en cours. M. Sawadogo continue donc de travailler normalement avec le nouvel employeur.",ref:"Chap. 4 › I › Page 21"},
  {q:"Mme Ouédraogo, enceinte de 4 mois, présente un certificat médical recommandant une réduction de travail. Son employeur veut la licencier. Ce licenciement est-il possible ?",type:'multi',opts:[{t:"Oui, l'employeur peut toujours licencier pour faute grave",c:false},{t:"Non, la grossesse est une cause de suspension — le licenciement serait abusif",c:true},{t:"Oui, si la procédure est respectée",c:false},{t:"Oui, mais avec préavis doublé",c:false}],diff:'med',piege:true,expl:"Un licenciement motivé par la grossesse est ABUSIF (Art.144 CTB). La femme enceinte peut suspendre son contrat sur prescription médicale. Licencier pour grossesse = licenciement abusif.",ref:"Chap. 5 › I.2.d + Chap. 5 › I.2 › Page 28"},
  {q:"M. Kaboré, comptable depuis 12 ans avec un salaire global de 150 000 FCFA/mois, est licencié. Quel est son taux d'indemnité de licenciement pour les années 11 et 12 ?",type:'multi',opts:[{t:"25% par an",c:false},{t:"30% par an",c:false},{t:"40% par an",c:true},{t:"50% par an",c:false}],diff:'med',piege:false,expl:"CCIP Art.35 : pour les années au-delà de 10 ans, le taux est de 40% par année. Les années 11 et 12 sont donc calculées à 40% × salaire global mensuel moyen des 6 derniers mois.",ref:"Chap. 5 › II › Page 29"},
  {q:"Un syndicat déclenche une grève sans avoir épuisé les procédures de conciliation et d'arbitrage. Quelle est la conséquence pour les travailleurs grévistes ?",type:'multi',opts:[{t:"Les travailleurs perdent leur prime d'ancienneté",c:false},{t:"Les travailleurs perdent le droit à l'indemnité de préavis et aux dommages-intérêts pour rupture",c:true},{t:"Les travailleurs sont automatiquement licenciés",c:false},{t:"Il n'y a aucune conséquence légale",c:false}],diff:'hard',piege:false,expl:"Art.389 CTB : la grève avant épuisement des procédures est une faute grave. Les travailleurs perdent le droit à l'indemnité de préavis ET aux dommages-intérêts pour rupture du contrat.",ref:"Partie 2 › Chap. 2 › II › Page 44"},
  {q:"Un employeur souhaite muter un agent de sécurité de Ouagadougou à Bobo-Dioulasso sans que cette clause ne figure au contrat. Le travailleur refuse. Qui est responsable de la rupture ?",type:'multi',opts:[{t:"Le travailleur, car il refuse un ordre légitime",c:false},{t:"L'employeur, car la mutation est une modification substantielle non prévue au contrat",c:true},{t:"Les deux parties à égalité",c:false},{t:"Personne — le contrat continue sans modification",c:false}],diff:'hard',piege:false,expl:"Un changement de lieu de travail non prévu au contrat et important constitue une modification substantielle. Si le travailleur refuse, la rupture est imputable à l'EMPLOYEUR, qui doit préavis et indemnités.",ref:"Chap. 4 › II › Page 23"},
  {q:"Mme Traoré, employée à salaire mensuel, est licenciée sans préavis pour raisons disciplinaires. Elle a droit à :",type:'multi',opts:[{t:"Rien — le licenciement disciplinaire dispense toujours du préavis",c:false},{t:"Une indemnité compensatrice de préavis d'1 mois (sauf faute lourde prouvée)",c:true},{t:"3 mois d'indemnité compensatrice de préavis",c:false},{t:"Uniquement un certificat de travail",c:false}],diff:'med',piege:true,expl:"L'indemnité compensatrice de préavis est due sauf en cas de FAUTE LOURDE (Art.69 CTB). Un licenciement disciplinaire n'est pas automatiquement une faute lourde. Pour un salarié mensuel : 1 mois de préavis.",ref:"Chap. 5 › I.2 › Page 27"},
  {q:"Un apprenti de 15 ans travaille dans un atelier de menuiserie. Après 2 mois, le maître souhaite rompre le contrat unilatéralement. Est-ce possible sans indemnité ?",type:'multi',opts:[{t:"Non, toute rupture unilatérale d'un contrat d'apprentissage donne lieu à indemnité",c:false},{t:"Oui, les 2 premiers mois sont une période d'essai — rupture possible sans indemnité",c:true},{t:"Oui, mais uniquement avec l'accord des parents de l'apprenti",c:false},{t:"Non, le maître ne peut jamais rompre unilatéralement",c:false}],diff:'med',piege:false,expl:"Les deux premiers mois du contrat d'apprentissage constituent une période d'essai pendant laquelle chacune des parties peut résilier sans indemnité de résiliation.",ref:"Chap. 6 › III.2 › Page 33"},
  {q:"Un litige naît entre M. Zongo et son employeur sur le montant de son salaire. L'inspecteur du travail tente une conciliation mais échoue. Que se passe-t-il ensuite ?",type:'multi',opts:[{t:"L'affaire est directement soumise au conseil d'arbitrage",c:false},{t:"L'inspecteur dresse un PV de non-conciliation et l'affaire est portée au tribunal du travail",c:true},{t:"Le Ministre du travail est saisi pour trancher",c:false},{t:"Le conflit est abandonné faute de solution",c:false}],diff:'med',piege:false,expl:"Pour un conflit INDIVIDUEL, en cas d'échec à l'Inspection du Travail : PV de non-conciliation est dressé, puis action introduite au greffe du tribunal du travail territorialement compétent.",ref:"Partie 2 › Chap. 1 › I › Page 39"},
  {q:"M. Compaoré, agent de maîtrise, démissionne sans respecter le délai de préavis obligatoire. Son employeur peut exiger :",type:'multi',opts:[{t:"Rien — seul l'employeur peut imposer le préavis",c:false},{t:"Le versement d'une indemnité compensatrice de préavis de 3 mois par le travailleur",c:true},{t:"La continuation du travail pendant 1 mois uniquement",c:false},{t:"Des dommages-intérêts forfaitaires de 500 000 FCFA",c:false}],diff:'hard',piege:false,expl:"Le préavis est réciproque. En cas de démission sans préavis d'un agent de maîtrise (3 mois de préavis), l'employeur est fondé à demander l'indemnité compensatrice correspondante.",ref:"Chap. 5 › I.2 › Page 26"},
  {q:"Un litige collectif éclate dans une entreprise de BTP ayant des chantiers à Ouagadougou et à Koudougou. À qui le différend doit-il être notifié ?",type:'multi',opts:[{t:"À l'Inspecteur du travail de Ouagadougou uniquement",c:false},{t:"Au Directeur Général du Travail, car le conflit couvre plusieurs ressorts",c:true},{t:"Au Ministre chargé du travail directement",c:false},{t:"Au Conseil d'arbitrage",c:false}],diff:'med',piege:true,expl:"Quand le conflit collectif s'étend sur les ressorts territoriaux de plusieurs inspections du travail, il est notifié au Directeur GÉNÉRAL du Travail (pas à l'Inspecteur, pas au Ministre).",ref:"Partie 2 › Chap. 2 › I › Page 42"},
  {q:"Mme Kabré est embauchée en CDD pour un an. À l'arrivée du terme, son employeur lui dit qu'elle ne bénéficiera pas d'indemnité compensatrice de préavis. A-t-il raison ?",type:'multi',opts:[{t:"Non, tout contrat donne droit au préavis",c:false},{t:"Oui, l'absence de préavis à l'arrivée du terme est précisément un inconvénient du CDD pour le travailleur",c:true},{t:"Non, elle a droit au préavis si elle a plus d'1 an d'ancienneté",c:false},{t:"Oui, mais seulement si c'est stipulé dans le contrat",c:false}],diff:'med',piege:false,expl:"C'est un inconvénient classique du CDD : la cessation des relations de travail à l'arrivée du terme prive le travailleur de la MESURE DE PROTECTION PAR LE PRÉAVIS.",ref:"Chap. 2 › I.1.b › Page 15"},
  {q:"Une infirmière travaille dans une clinique privée. Son horaire de présence est de 45h/semaine. Peut-elle prétendre à des heures supplémentaires ?",type:'multi',opts:[{t:"Oui, car 45h > 40h légales",c:false},{t:"Non, car 45h est la durée d'équivalence applicable à son secteur (hôpitaux/cliniques)",c:true},{t:"Oui, pour les 5 heures dépassant les 40h légales",c:false},{t:"Non, car les heures supplémentaires ne s'appliquent pas au secteur de la santé",c:false}],diff:'hard',piege:true,expl:"Pour les hôpitaux, cliniques et dispensaires, 45h de présence est considérée équivalente à 40h de travail effectif. Il n'y a donc pas d'heures supplémentaires à partir de 45h dans ce secteur.",ref:"Partie 3 › Chap. 1 › I › Page 47"},
  {q:"M. Diallo est engagé comme représentant commercial exclusif d'une seule société, avec un horaire et une discipline imposés. Son contrat est :",type:'multi',opts:[{t:"Un contrat de mandat car il représente la société",c:false},{t:"Un contrat de travail car il est soumis à subordination",c:true},{t:"Un contrat d'entreprise car il est rémunéré à la commission",c:false},{t:"Un contrat d'apprentissage",c:false}],diff:'med',piege:true,expl:"Si le représentant travaille pour UNE SEULE société et est assujetti à un horaire + discipline → contrat de travail. Si plusieurs entreprises + large indépendance → contrat de mandat.",ref:"Chap. 1 › I.1.1 › Page 11"},
  {q:"Une entreprise de BTP décide de mettre ses ouvriers en chômage technique pendant 6 mois. M. Ilboudo refuse les nouvelles conditions. Qui est responsable de la rupture ?",type:'multi',opts:[{t:"M. Ilboudo car il refuse de s'adapter",c:false},{t:"L'entreprise, car le chômage technique est une modification substantielle",c:true},{t:"Les deux parties à égalité",c:false},{t:"Personne, c'est un cas de force majeure",c:false}],diff:'hard',piege:false,expl:"Le chômage technique constitue une modification substantielle des clauses du contrat. Si le travailleur refuse les nouvelles conditions, la rupture est du FAIT DE L'EMPLOYEUR.",ref:"Chap. 4 › II › Page 23"},
  {q:"Un ouvrier payé à l'heure est malade pendant 14 mois. Son employeur peut-il le licencier ?",type:'multi',opts:[{t:"Non, la maladie suspend le contrat sans limite de durée",c:false},{t:"Oui, après 1 an de suspension pour maladie non professionnelle, avec respect des formalités de licenciement",c:true},{t:"Oui, dès le premier jour d'absence",c:false},{t:"Non, jamais pendant une maladie",c:false}],diff:'hard',piege:true,expl:"Art.93-3 CTB : la suspension pour maladie non professionnelle est limitée à 1 an (prorogé jusqu'au remplacement du malade). Au-delà, l'employeur peut procéder à un licenciement dans les formes légales.",ref:"Chap. 3 › a › Page 18"},
  {q:"M. Nikiema effectue 10 heures supplémentaires de jour un samedi (jour ouvrable ordinaire). Quel taux de majoration s'applique-t-il pour les 8 premières heures ?",type:'multi',opts:[{t:"60% car c'est le week-end",c:false},{t:"15% car c'est dans la limite des 8 premières heures",c:true},{t:"35% car c'est un samedi",c:false},{t:"50% car il dépasse les 8 heures",c:false}],diff:'med',piege:true,expl:"Le samedi est un JOUR OUVRABLE ordinaire (juridiquement). Le repos hebdomadaire = dimanche par principe. Donc : 15% pour les 8 premières heures supp. de jour, et 35% pour les 2 heures suivantes.",ref:"Partie 3 › Chap. 2 › II.1 › Page 52"},
  {q:"Un CDD est conclu avec une clause permettant à l'une ou l'autre partie de rompre avec préavis. Quelle est la nature réelle de ce contrat ?",type:'multi',opts:[{t:"CDD normal avec une souplesse supplémentaire",c:false},{t:"CDI à terme maximum",c:true},{t:"Contrat d'entreprise",c:false},{t:"CDD nul car la clause est illicite",c:false}],diff:'hard',piege:true,expl:"Un CDD contenant une clause de rupture avec préavis est en réalité un CDI À TERME MAXIMUM. La possibilité de rupture unilatérale est caractéristique du CDI, pas du CDD.",ref:"Chap. 2 › I.1.b › Page 15"},
  {q:"Une secrétaire (salaire mensuel) est licenciée après 7 ans dans l'entreprise, avec un salaire global mensuel moyen de 120 000 FCFA. Quel est le montant de son indemnité pour les années 6 et 7 ?",type:'multi',opts:[{t:"25% × 120 000 × 2 = 60 000 FCFA",c:false},{t:"30% × 120 000 × 2 = 72 000 FCFA",c:true},{t:"40% × 120 000 × 2 = 96 000 FCFA",c:false},{t:"35% × 120 000 × 2 = 84 000 FCFA",c:false}],diff:'hard',piege:false,expl:"CCIP Art.35 : années 6 à 10 = 30% par année. Pour 2 années (6ème et 7ème) : 30% × 120 000 × 2 = 72 000 FCFA. Les 5 premières années sont à 25%.",ref:"Chap. 5 › II › Page 29"},
  {q:"Un entrepreneur individuel reçoit une lettre de mission pour animer 3 jours de formation. Il organise son travail à sa guise. Quel type de contrat le lie à l'entreprise ?",type:'multi',opts:[{t:"Contrat de travail à durée déterminée",c:false},{t:"Contrat de mandat",c:false},{t:"Contrat d'entreprise",c:true},{t:"Contrat d'apprentissage",c:false}],diff:'med',piege:false,expl:"Tâche déterminée + exécution de sa propre initiative + pas de subordination permanente + rémunération forfaitaire = CONTRAT D'ENTREPRISE (exemple-type du cours : séminaire animé par un consultant).",ref:"Chap. 1 › I.1.1.a › Page 10"},
  {q:"M. Bélem, gardien de nuit dans un immeuble de bureaux, est présent 72h par semaine. Doit-il recevoir des heures supplémentaires ?",type:'multi',opts:[{t:"Oui, 32 heures supplémentaires (72 - 40)",c:false},{t:"Non, 72h est la durée d'équivalence légale pour les gardiens de nuit",c:true},{t:"Oui, 22 heures supplémentaires (72 - 50)",c:false},{t:"Oui, 12 heures supplémentaires (72 - 60)",c:false}],diff:'med',piege:false,expl:"Arrêté 2007-004 : pour les gardiens de jour et de nuit, 72 heures de présence hebdomadaire est considérée équivalente à 40 heures de travail effectif. Pas d'heures supplémentaires donc.",ref:"Partie 3 › Chap. 1 › I › Page 47"},
  {q:"Un conflit individuel est porté à l'Inspection du Travail. L'inspecteur rédige un PV de conciliation partielle. Qu'advient-il ?",type:'multi',opts:[{t:"Le PV partiel n'a aucune valeur juridique",c:false},{t:"Les points d'accord valent titre exécutoire ; le reste fait l'objet d'un PV de non-conciliation",c:true},{t:"L'affaire repart intégralement devant le tribunal",c:false},{t:"L'employeur peut ignorer les points d'accord",c:false}],diff:'hard',piege:false,expl:"En cas de conciliation partielle : le PV signé vaut titre exécutoire pour les points d'accord. Un PV de non-conciliation est dressé pour le surplus, permettant l'action judiciaire sur les points restants.",ref:"Partie 2 › Chap. 1 › I › Page 39"},
  {q:"Un travailleur est détenu pour motifs politiques. Son contrat est :",type:'multi',opts:[{t:"Automatiquement rompu dès le premier jour de détention",c:false},{t:"Suspendu pendant la durée de la détention",c:true},{t:"Transformé en CDD pendant la détention",c:false},{t:"Maintenu mais sans salaire uniquement 30 jours",c:false}],diff:'med',piege:false,expl:"Art.93-13 CTB : la détention pour motifs politiques est un cas de suspension du contrat de travail. Le contrat n'est pas rompu.",ref:"Chap. 3 › a › Page 19"},
  {q:"M. Ouattara, directeur technique, démissionne du jour au lendemain sans respecter son préavis de 3 mois. L'employeur subit un préjudice réel. Que peut faire l'employeur ?",type:'multi',opts:[{t:"Rien, le travailleur a le droit de démissionner librement",c:false},{t:"Qualifier la démission d'abusive et réclamer des dommages-intérêts",c:true},{t:"Forcer le travailleur à rester jusqu'au terme du préavis",c:false},{t:"Obtenir automatiquement une indemnité égale à 6 mois de salaire",c:false}],diff:'hard',piege:false,expl:"Quand la démission cause un préjudice à l'employeur, elle peut être qualifiée d'ABUSIVE, ce qui permet à l'employeur de réclamer des dommages-intérêts (mais pas de forcer le salarié à rester).",ref:"Chap. 5 › I › Page 29"},
  {q:"Un maître artisan a 10 salariés. Combien d'apprentis peut-il accueillir au maximum ?",type:'multi',opts:[{t:"5 apprentis (moitié des salariés)",c:true},{t:"10 apprentis (autant que de salariés)",c:false},{t:"3 apprentis maximum légal absolu",c:false},{t:"Pas de limite légale fixée",c:false}],diff:'med',piege:false,expl:"Le maître ne doit pas avoir un nombre d'apprentis supérieur à la MOITIÉ de l'effectif de ses salariés dans le métier objet de l'apprentissage. 10 salariés → maximum 5 apprentis.",ref:"Chap. 6 › II.1 › Page 33"},
  {q:"La sentence arbitrale d'un conflit collectif peut faire l'objet de :",type:'multi',opts:[{t:"Un appel devant la Cour d'Appel",c:false},{t:"Un pourvoi devant la Chambre Sociale de la Cour de Cassation",c:true},{t:"Un recours devant le Ministre du Travail uniquement",c:false},{t:"Aucun recours — la sentence est définitive et irrévocable",c:false}],diff:'hard',piege:false,expl:"La sentence arbitrale peut faire l'objet d'un pourvoi (recours en cassation) devant la CHAMBRE SOCIALE de la COUR DE CASSATION. Si annulée, l'affaire est renvoyée au Ministre pour désigner un nouveau conseil d'arbitrage.",ref:"Partie 2 › Chap. 2 › I › Page 44"},
  {q:"Un travailleur licencié pour baisse de rendement conteste son licenciement. Ce licenciement est-il abusif ?",type:'multi',opts:[{t:"Oui, car la baisse de rendement n'est pas un motif légitime",c:false},{t:"Non, la baisse de rendement est un motif professionnel légitime (incompétence, inaptitude)",c:true},{t:"Oui, car le travailleur n'a pas eu droit à un avertissement préalable",c:false},{t:"Cela dépend du secteur d'activité",c:false}],diff:'med',piege:true,expl:"La baisse de rendement est un motif d'ordre PROFESSIONNEL (inaptitude professionnelle) qui constitue un motif LÉGITIME de licenciement. Ce n'est donc pas un licenciement abusif.",ref:"Chap. 5 › I.2 › Page 28"},
  {q:"M. Tapsoba travaille comme chauffeur de taxi pour le compte d'un propriétaire de véhicule, sous sa dépendance et avec salaire. Sa situation est :",type:'multi',opts:[{t:"Contrat de louage de chose car il utilise le véhicule d'autrui",c:false},{t:"Contrat de travail car il est salarié et sous dépendance du propriétaire",c:true},{t:"Contrat de mandat car il représente le propriétaire",c:false},{t:"Pas de contrat — relation informelle",c:false}],diff:'med',piege:true,expl:"Si le chauffeur de taxi perçoit un salaire ET se trouve sous la dépendance du propriétaire → CONTRAT DE TRAVAIL. Le lien de subordination prime sur le fait qu'il utilise le véhicule d'autrui.",ref:"Chap. 1 › I.1.1 › Page 12"},
  {q:"Un conflit collectif est soumis à l'arbitrage. Les parties refusent la sentence. Quel est le délai pour notifier ce refus ?",type:'multi',opts:[{t:"24 heures après la notification",c:false},{t:"48 heures après la notification",c:true},{t:"7 jours après la notification",c:false},{t:"15 jours après la notification",c:false}],diff:'hard',piege:false,expl:"Les parties peuvent refuser l'application de la sentence en notifiant leur refus dans les 48 HEURES qui suivent la notification au Ministre chargé du travail.",ref:"Partie 2 › Chap. 2 › I › Page 43"},
  {q:"Pendant l'exécution du préavis, le travailleur licencié est autorisé à s'absenter pour rechercher un emploi :",type:'multi',opts:[{t:"1 heure par jour ou 1 jour par semaine",c:false},{t:"2 heures par jour ou 2 jours par semaine",c:true},{t:"4 heures par jour uniquement",c:false},{t:"Aucune absence autorisée pendant le préavis",c:false}],diff:'med',piege:false,expl:"CCIP : pendant le préavis (licenciement ou démission), le travailleur est autorisé à s'absenter 2 heures par jour OU 2 jours par semaine pour chercher un nouvel emploi. Les jours peuvent être bloqués en fin de préavis.",ref:"Chap. 5 › I.2.a › Page 26"},
  {q:"Mme Bonkoungou démissionne car son employeur lui a proposé une importante mutation non prévue au contrat qu'elle a refusée. Comment qualifier juridiquement cette situation ?",type:'multi',opts:[{t:"Démission simple : elle choisit de partir",c:false},{t:"Démission forcée assimilée à un licenciement du fait de l'employeur",c:true},{t:"Faute de l'employeur sans conséquence juridique",c:false},{t:"Accord mutuel des parties",c:false}],diff:'hard',piege:true,expl:"Quand la démission est PROVOQUÉE par le comportement de l'employeur (modification substantielle non prévue refusée), la jurisprudence qualifie cela de DÉMISSION FORCÉE et l'assimile à un licenciement.",ref:"Chap. 4 › II + Chap. 5 › I › Page 23"},
  {q:"Un apprenti mineur de 13 ans se présente pour signer un contrat d'apprentissage. Ce contrat peut-il être valide ?",type:'multi',opts:[{t:"Oui, avec l'accord des parents",c:false},{t:"Non, l'apprenti ne peut pas être engagé avant l'âge de 14 ans",c:true},{t:"Oui, si l'Inspecteur du Travail donne son accord",c:false},{t:"Oui, si c'est pour une profession non dangereuse",c:false}],diff:'med',piege:false,expl:"Le CTB est formel : l'apprenti ne peut être engagé avant l'âge de 14 ans. En dessous de cet âge, le contrat d'apprentissage ne peut pas être valablement conclu.",ref:"Chap. 6 › I › Page 31"},
  {q:"Un établissement de vente de denrées alimentaires au détail souhaite ne pas accorder le repos dominical à tout son personnel. Quelle règle s'applique ?",type:'multi',opts:[{t:"Impossible : le dimanche est toujours le jour de repos",c:false},{t:"Possible avec réduction à une demi-journée et repos compensateur par roulement",c:true},{t:"Possible sans aucune condition",c:false},{t:"Possible uniquement avec l'accord de tous les employés",c:false}],diff:'hard',piege:false,expl:"Dans les établissements de vente de denrées alimentaires au détail, le repos peut être réduit à une demi-journée, avec un repos compensateur d'une journée accordé par roulement pour deux réductions d'une demi-journée.",ref:"Partie 3 › Chap. 2 › II.2 › Page 56"},
  {q:"M. Sanou veut déposer une plainte contre son employeur devant le tribunal du travail. Quels tribunaux sont compétents (plusieurs réponses) ?",type:'multi',opts:[{t:"Le tribunal du lieu du travail",c:true},{t:"Le tribunal du lieu de résidence du travailleur",c:true},{t:"Le tribunal de commerce",c:false},{t:"Le tribunal de grande instance",c:false}],diff:'med',piege:false,expl:"En cas de licenciement, le travailleur a le choix entre le tribunal du lieu du travail OU celui du lieu de sa résidence. C'est un choix accordé au travailleur.",ref:"Partie 2 › Chap. 1 › I › Page 39"},
  {q:"Un employeur effectue des heures supplémentaires pendant plus de 6 mois consécutifs. Quelle formalité s'impose ?",type:'multi',opts:[{t:"Obtenir l'autorisation du Ministre du Travail",c:false},{t:"Consulter les représentants du personnel et informer l'Inspection du Travail",c:true},{t:"Payer une taxe spéciale au Trésor",c:false},{t:"Aucune formalité particulière",c:false}],diff:'hard',piege:false,expl:"Pour une période d'heures supplémentaires ≥ 6 mois, l'employeur doit consulter les représentants du personnel sur les modalités pratiques, et les résultats de cette consultation doivent être portés à la connaissance de l'Inspection du Travail.",ref:"Partie 3 › Chap. 2 › Page 50"},
  {q:"M. Coulibaly était responsable de caisse avant de démissionner. Peut-il quitter immédiatement son poste ?",type:'multi',opts:[{t:"Oui, la démission prend effet immédiatement à sa notification",c:false},{t:"Non, il doit d'abord rendre ses comptes de gestion",c:true},{t:"Non, il doit attendre 6 mois",c:false},{t:"Oui, si l'employeur libère expressément",c:false}],diff:'med',piege:false,expl:"Le travailleur responsable d'un service, d'une caisse ou d'un stock qui résilie son contrat ne peut quitter son emploi sans avoir RENDU SES COMPTES.",ref:"Chap. 5 › I.2.a › Page 27"},
  {q:"Les indemnités suivantes sont EXCLUES du calcul de l'indemnité compensatrice de préavis (plusieurs réponses) :",type:'multi',opts:[{t:"Indemnité de transport",c:true},{t:"Indemnité de logement",c:true},{t:"Prime d'ancienneté",c:false},{t:"Prime de rendement",c:true}],diff:'hard',piege:true,expl:"Sont EXCLUS : indemnités de transport, logement, primes de rendement, d'assiduité (= remboursements de frais ou primes non liées à la nature du travail). INCLUS : salaire catégoriel, prime d'ancienneté, heures supplémentaires, indemnités de fonction.",ref:"Chap. 5 › I.2.c › Page 27"},
  {q:"Un travailleur est absent 2 mois pour soigner son conjoint malade (cas 17 de l'Art.93). Son contrat est-il compté dans son ancienneté ?",type:'multi',opts:[{t:"Oui, toutes les suspensions comptent pour l'ancienneté",c:false},{t:"Non, ce cas de suspension (n°17) n'est pas compté comme temps de service",c:true},{t:"Oui, car il s'agit d'une cause personnelle",c:false},{t:"Oui, si la durée est inférieure à 3 mois",c:false}],diff:'hard',piege:false,expl:"Le point 17 (absence pour soigner le conjoint malade, limite 3 mois) figure parmi les cas de suspension qui ne sont PAS considérés comme temps de service pour l'ancienneté (liste : points 1, 6, 12, 13, 14, 15, 16, 17, 18).",ref:"Chap. 3 › a › Page 19"},
  {q:"Un syndicat de travailleurs d'une usine obtient une sentence arbitrale favorable. L'employeur refuse d'appliquer la sentence. Après un refus valide, qui désigne le nouveau conseil d'arbitrage ?",type:'multi',opts:[{t:"Le Directeur Général du Travail",c:false},{t:"Le Ministre chargé du travail",c:true},{t:"La Chambre Sociale de la Cour de Cassation",c:false},{t:"Les parties se mettent d'accord elles-mêmes",c:false}],diff:'hard',piege:false,expl:"Si la sentence est annulée suite à un pourvoi, l'affaire est renvoyée au MINISTRE chargé du travail, qui désignera un NOUVEAU conseil d'arbitrage, autrement composé.",ref:"Partie 2 › Chap. 2 › I › Page 44"}
];

// ✏ ZONE D — SÉRIE 3 : EXAMEN RÉEL (sujet PDF UE8 — 20 questions dans l'ordre)
const serie3 = [
  {q:"Le lock-out est une décision par laquelle un employeur interdit :",type:'multi',opts:[{t:"Aux clients l'accès de l'entreprise à l'occasion d'un conflit collectif de travail",c:false},{t:"Aux salariés l'accès de l'entreprise à l'occasion d'un conflit collectif de travail",c:true},{t:"Aux partenaires financiers et techniques de l'entreprise à l'occasion d'un conflit collectif de travail",c:false},{t:"À une équipe de contrôle de l'inspection du travail à l'occasion d'un conflit collectif de travail",c:false}],diff:'easy',piege:true,expl:"Définition exacte du lock-out (Glossaire CTB) : l'employeur interdit aux SALARIÉS l'accès de l'entreprise lors d'un conflit collectif. Aucune des autres catégories n'est visée.",ref:"Glossaire CTB › Page 59"},
  {q:"La caractéristique essentielle du contrat de travail à durée indéterminée est :",type:'multi',opts:[{t:"Le caractère indéterminé du contrat",c:false},{t:"La faculté de résiliation de commun accord entre les parties au contrat",c:false},{t:"L'interdiction de la rupture unilatérale du contrat",c:false},{t:"La faculté de résiliation unilatérale et réciproque laissée à chacun des contractants",c:true}],diff:'med',piege:true,expl:"La caractéristique ESSENTIELLE du CDI est la faculté de résiliation UNILATÉRALE et RÉCIPROQUE. Attention : le 'caractère indéterminé' décrit la durée mais ne définit pas l'essence du contrat.",ref:"Chap. 5 › I › Page 26"},

const series=[serie1,serie2,serie3];
const STORAGE_KEY='QCM_PROGRESS_M20';
let currentSerie=0,currentQ=0,sessionQs=[],answers={},validated={},markedWrong={},wrongList=[],isRetryMode=false,pendingResume=null;
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({serie:currentSerie,question:currentQ,answers,validated,markedWrong,wrongList,isRetryMode,sessionOrder:sessionQs.map(q=>q.origIdx)}));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function clearProgress(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function checkResume(){const saved=loadProgress();if(!saved||Object.keys(saved.validated||{}).length===0)return;pendingResume=saved;const names=['Série 1 — Théorie','Série 2 — Cas Pratiques','Série 3 — Examen Réel'];document.getElementById('resumeInfo').textContent=(names[saved.serie]||'Série '+(saved.serie+1))+' · Question '+(saved.question+1);document.getElementById('resumeOverlay').style.display='flex';}
function doResume(){document.getElementById('resumeOverlay').style.display='none';if(!pendingResume)return;const s=pendingResume;currentSerie=s.serie;currentQ=s.question;answers=s.answers||{};validated=s.validated||{};markedWrong=s.markedWrong||{};wrongList=s.wrongList||[];isRetryMode=s.isRetryMode||false;const src=series[currentSerie];sessionQs=(s.sessionOrder||[]).map(origIdx=>{const q=src[origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});updateSerieButtons();updateScoreLive();renderQuestion();showSection('qcm');}
function doRestart(){document.getElementById('resumeOverlay').style.display='none';clearProgress();pendingResume=null;loadSerie(0);}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateSerieButtons(){document.querySelectorAll('.serie-btn').forEach((b,i)=>b.classList.toggle('active',i===currentSerie&&!isRetryMode));}
function updateScoreLive(){const vKeys=Object.keys(validated);let correct=0;sessionQs.forEach((q,i)=>{if(!validated[i])return;const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);if(cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x)))correct++;});const vCount=vKeys.length;document.getElementById('liveCorrect').textContent=correct;document.getElementById('liveWrong').textContent=vCount-correct;document.getElementById('liveTotal').textContent=sessionQs.length;document.getElementById('livePct').textContent=vCount>0?Math.round((correct/vCount)*100)+'%':'—';}
function loadSerie(idx,retry=false){currentSerie=idx;isRetryMode=retry;currentQ=0;answers={};validated={};if(!retry){wrongList=[];const shuffledIdxs=shuffleArray(series[idx].map((_,i)=>i));sessionQs=shuffledIdxs.map(origIdx=>{const q=series[idx][origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});}updateSerieButtons();updateScoreLive();renderQuestion();clearProgress();}
function loadRetry(){if(wrongList.length===0)return;isRetryMode=true;currentQ=0;answers={};validated={};sessionQs=wrongList.map(qi=>{const q=series[currentSerie][qi];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx:qi};});updateScoreLive();renderQuestion();}
function renderQuestion(){const container=document.getElementById('qcmContainer');const total=sessionQs.length;const pct=total>0?((currentQ+1)/total)*100:0;document.getElementById('qcmProgressBar').style.width=pct+'%';if(currentQ>=total){showScore();return;}const q=sessionQs[currentQ];const isVal=!!validated[currentQ];const sel=answers[currentQ]||[];const isMarked=!!markedWrong[q.origIdx];const letters=['A','B','C','D','E','F'];const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const isCorrect=isVal&&cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));let optsHtml='';q.shuffledOpts.forEach((opt,i)=>{let cls='option-item';if(isVal){cls+=' disabled';if(opt.c)cls+=' correct';else if(sel.includes(i))cls+=' wrong';}else if(sel.includes(i))cls+=' selected';optsHtml+=`<button class="${cls}" onclick="selectOpt(${i})" ${isVal?'disabled':''}><div class="option-letter">${letters[i]}</div><div class="option-text">${opt.t}</div></button>`;});const feedbackHtml=isVal?`<div class="feedback-banner ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ Bonne réponse !':'❌ Mauvaise réponse'}</div>`:'';const explHtml=isVal?`<div class="explanation-box"><div class="explanation-title">💡 Explication</div><div class="explanation-text">${q.expl}</div><span class="page-ref">📄 ${q.ref}</span></div>`:'';const multiHint=`<div class="multi-hint">⚠ Sélectionnez la ou les réponses correctes</div>`;const markLabel=isMarked?'✕ Retirer marque':'🔶 Marquer';container.innerHTML=`<div class="question-card"><div class="question-meta"><span class="q-num">Q${currentQ+1}/${total}${isRetryMode?' (Révision)':''}</span><span class="badge badge-${q.diff==='easy'?'easy':q.diff==='med'?'med':'hard'}">${q.diff==='easy'?'🟢 Facile':q.diff==='med'?'🟡 Moyen':'🔴 Difficile'}</span>${q.piege?'<span class="badge badge-piege">⚠ PIÈGE POSSIBLE</span>':''}${isMarked?'<span class="badge badge-marked">🔶 Marquée</span>':''}</div><div class="question-text">${q.q}</div>${multiHint}<div class="options-list">${optsHtml}</div>${feedbackHtml}${explHtml}</div><div class="qcm-nav">${!isVal?`<button class="btn-primary" onclick="validateQ()" ${sel.length===0?'disabled':''}>✓ Valider</button>`:`<button class="btn-primary" onclick="nextQ()">Suivant →</button>`}${currentQ>0?`<button class="btn-secondary" onclick="prevQ()">← Précédent</button>`:''}<button class="mark-btn ${isMarked?'marked':''}" onclick="toggleMark(${q.origIdx})">${markLabel}</button></div>`;}
function selectOpt(i){if(validated[currentQ])return;const q=sessionQs[currentQ];if(!answers[currentQ])answers[currentQ]=[];const idx=answers[currentQ].indexOf(i);if(idx>-1)answers[currentQ].splice(idx,1);else answers[currentQ].push(i);renderQuestion();}
function validateQ(){const q=sessionQs[currentQ];const sel=answers[currentQ]||[];if(sel.length===0)return;validated[currentQ]=true;const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const ok=cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));if(!ok&&!wrongList.includes(q.origIdx))wrongList.push(q.origIdx);if(!ok)markedWrong[q.origIdx]=true;updateScoreLive();saveProgress();renderQuestion();}
function nextQ(){currentQ++;saveProgress();renderQuestion();}
function prevQ(){if(currentQ>0){currentQ--;saveProgress();renderQuestion();}}
function toggleMark(origIdx){markedWrong[origIdx]=!markedWrong[origIdx];if(!markedWrong[origIdx]){const idx=wrongList.indexOf(origIdx);if(idx>-1)wrongList.splice(idx,1);}else if(!wrongList.includes(origIdx))wrongList.push(origIdx);saveProgress();renderQuestion();}
function showScore(){const total=sessionQs.length;const correct=sessionQs.filter((q,i)=>{const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);return cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));}).length;const wrong=total-correct;const pct=Math.round((correct/total)*100);const markedCount=Object.values(markedWrong).filter(v=>v).length;clearProgress();document.getElementById('qcmContainer').innerHTML=`<div class="score-card" id="scoreCard" style="display:block"><div class="score-big">${pct}%</div><div class="score-label">${isRetryMode?'Session de révision terminée':'Série '+(currentSerie+1)+' terminée'}</div><div class="score-stats"><div class="score-stat green"><div class="score-stat-val">${correct}</div><div class="score-stat-label">✅ Correct</div></div><div class="score-stat red"><div class="score-stat-val">${wrong}</div><div class="score-stat-label">❌ Incorrect</div></div><div class="score-stat"><div class="score-stat-val">${total}</div><div class="score-stat-label">Total</div></div>${markedCount>0?`<div class="score-stat orange"><div class="score-stat-val">${markedCount}</div><div class="score-stat-label">🔶 Marquées</div></div>`:''}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn-primary" onclick="loadSerie(${currentSerie})">🔄 Recommencer</button>${wrongList.length>0?`<button class="btn-retry" onclick="loadRetry()">🎯 Questions ratées (${wrongList.length})</button>`:''}</div><div style="margin-top:16px;font-size:12px;color:var(--text3)">${pct>=70?'🎉 Excellent !':pct>=50?'📚 Continuez à réviser.':'⚠ Révisez les fiches et recommencez.'}</div></div>`;document.getElementById('qcmProgressBar').style.width='100%';}

  </div>
</div>
<div class="methode-card" style="margin-top:12px">
  <div class="methode-card-title">💰 Barème Indemnité de Licenciement (CCIP Art.35)</div>
  <table class="chiffres-table">
    <tr><th>Période</th><th>Taux / an</th><th>Base de calcul</th></tr>
    <tr><td>Années 1 à 5</td><td>25%</td><td rowspan="3">Salaire global mensuel moyen des 6 derniers mois (hors remboursements de frais)</td></tr>
    <tr><td>Années 6 à 10</td><td>30%</td></tr>
    <tr><td>Au-delà de 10 ans</td><td>40%</td></tr>
  </table>
  <div class="key-box"><div class="key-title">Exemple de calcul (Exercice cours)</div><div class="key-text">M. OUEDRAOGO — 10/02/2000 au 11/11/2011 = 11 ans et 9 mois ≈ 11,75 ans<br>Salaire global = 85 000 + (4% × 85 000) = 85 000 + 3 400 = 88 400 FCFA<br>Indemnité = (5 × 25% × 88 400) + (5 × 30% × 88 400) + (1,75 × 40% × 88 400)<br>= 11 050 × 5 + 13 260 × 5 + 35 360 × 1,75 = 55 250 + 66 300 + 61 880 = <strong>183 430 FCFA</strong></div></div>
</div>
<div class="methode-card" style="margin-top:12px">
  <div class="methode-card-title">🔄 Schéma de Décision — Conflit Individuel vs Collectif</div>
  <div class="schema-step"><div class="schema-num">?</div><div class="schema-text"><strong>Question clé :</strong> les intérêts en jeu sont-ils collectifs ou individuels ?</div></div>
  <div class="def-grid">
    <div class="def-item">
      <div class="def-term">→ INDIVIDUELS</div>
      <div class="def-text">Conflit INDIVIDUEL (Art.319)<br>Procédure : Délégués → Inspection → Tribunal du Travail</div>
    </div>
    <div class="def-item">
      <div class="def-term">→ COLLECTIFS</div>
      <div class="def-text">Conflit COLLECTIF (Art.367)<br>Procédure : Conciliation (Inspecteur ou DG du Travail) → Arbitrage (Ministre) → Cour de Cassation</div>
    </div>
  </div>
</div>
<div class="methode-card" style="margin-top:12px">
  <div class="methode-card-title">🏗 Schéma — Qui notifier pour un conflit collectif ?</div>
  <div class="schema-step"><div class="schema-num">1</div><div class="schema-text"><strong>Conflit sur 1 seul ressort territorial</strong> → INSPECTEUR (ou contrôleur) du travail du ressort → tente la conciliation dans 15 jours</div></div>
  <div class="schema-step"><div class="schema-num">2</div><div class="schema-text"><strong>Conflit sur plusieurs ressorts</strong> → DIRECTEUR GÉNÉRAL DU TRAVAIL → tente la conciliation</div></div>
  <div class="schema-step"><div class="schema-num">3</div><div class="schema-text"><strong>Conciliation échoue</strong> → MINISTRE DU TRAVAIL désigne le conseil d'ARBITRAGE (dans 10 jours)</div></div>
  <div class="schema-step"><div class="schema-num">4</div><div class="schema-text"><strong>Refus de la sentence (dans 48h)</strong> → Possibilité de pourvoi devant la CHAMBRE SOCIALE de la COUR DE CASSATION</div></div>
</div>
<div class="methode-card" style="margin-top:12px">
  <div class="methode-card-title">📋 Majorations Heures Supplémentaires — Tableau de Référence</div>
  <table class="chiffres-table">
    <tr><th>Situation</th><th>Majoration</th></tr>
    <tr><td>8 premières heures sup. de JOUR (jours ordinaires)</td><td>+15%</td></tr>
    <tr><td>Heures sup. au-delà des 8h, de JOUR (jours ordinaires)</td><td>+35%</td></tr>
    <tr><td>Heures sup. de JOUR — jour de repos ou férié</td><td>+60%</td></tr>
    <tr><td>Heures sup. de NUIT — jours ordinaires</td><td>+50%</td></tr>
    <tr><td>Heures sup. de NUIT — jour de repos ou férié</td><td>+120%</td></tr>
    <tr><td>Heures de RÉCUPÉRATION (autorisées par Inspecteur)</td><td>Taux NORMAL (0%)</td></tr>
  </table>
  <div class="piege-box"><div class="piege-title">⚠ Samedi ≠ Jour de repos</div><div class="piege-text">Le samedi est un JOUR OUVRABLE ordinaire. Seul le dimanche est le jour de repos hebdomadaire par principe. Les majorations de 60% et 120% ne s'appliquent pas au samedi sauf dérogation.</div></div>
</div>
