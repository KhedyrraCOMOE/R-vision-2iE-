<style>

:root {

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; overflow-x: hidden; }
.credit-banner { background: linear-gradient(90deg, rgba(0,212,170,0.13), rgba(0,153,255,0.08)); border-bottom: 1px solid rgba(0,212,170,0.25); padding: 8px 16px; text-align: center; font-size: 11px; color: var(--accent); font-family: 'Space Mono', monospace; letter-spacing: 0.4px; line-height: 1.6; }

.header { background: linear-gradient(135deg, #0d1520 0%, #111827 50%, #0a1628 100%); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 100; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 16px; flex-wrap: wrap; }
.header-logo { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; flex-shrink: 0; }
.header-title { font-family: 'DM Serif Display', serif; font-size: 18px; color: var(--text); -webkit-flex: 1; flex: 1; }
.header-timer-zone { display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 10px; }
.timer-display { font-family: 'Space Mono', monospace; font-size: 22px; color: var(--accent4); min-width: 80px; text-align: center; padding: 6px 12px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--r2); transition: all 0.3s; }
.timer-display.alert { color: var(--red); border-color: var(--red); -webkit-animation: blink 0.5s infinite; animation: blink 0.5s infinite; }

@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.4} }
.btn-sm { padding: 6px 12px; border-radius: var(--r2); border: 1px solid var(--border); background: var(--bg3); color: var(--text2); font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; transition: all 0.2s; white-space: nowrap; -webkit-appearance: none; appearance: none; }

.nav { display: -webkit-flex; display: flex; gap: 4px; padding: 12px 20px 0; border-bottom: 1px solid var(--border); background: var(--bg2); overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }

.nav-tab { padding: 10px 18px; border-radius: 8px 8px 0 0; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--text3); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; white-space: nowrap; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 7px; -webkit-appearance: none; appearance: none; }

.section { display: none; }
.section.active { display: block; }

.chiffres-table td { padding: 7px 10px; border: 1px solid var(--border); color: var(--text2); vertical-align: top; }

.memo-section-title { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 6px; }
.qcm-header { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 20px; margin-bottom: 16px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 12px; flex-wrap: wrap; }
.serie-selector { display: -webkit-flex; display: flex; gap: 8px; flex-wrap: wrap; }

.serie-btn:hover { border-color: var(--border2); color: var(--text); }

.qcm-progress-bar-wrap { background: var(--bg4); height: 6px; border-radius: 3px; margin-bottom: 16px; overflow: hidden; }

.score-live-val.green { color: var(--green); } .score-live-val.red { color: var(--red); } .score-live-val.blue { color: var(--accent2); }

.badge-piege { background: rgba(255,107,53,0.15); color: var(--orange); border: 1px solid rgba(255,107,53,0.3); }

.question-text { font-size: 15px; font-weight: 500; color: var(--text); line-height: 1.6; margin-bottom: 16px; }
.options-list { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; gap: 8px; }

.option-item.wrong { border-color: var(--red); background: rgba(255,77,106,0.08); }

.option-item.selected .option-letter { background: var(--accent2); border-color: var(--accent2); color: #fff; }

.option-item.wrong .option-letter { background: var(--red); border-color: var(--red); color: #fff; }
.option-text { font-size: 13px; color: var(--text2); line-height: 1.5; -webkit-flex: 1; flex: 1; }
.multi-hint { font-size: 11px; color: var(--accent4); margin-bottom: 10px; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; gap: 6px; font-style: italic; }

.feedback-banner.correct { background: rgba(0,200,150,0.12); border: 1px solid rgba(0,200,150,0.4); color: var(--green); }

.explanation-title { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--accent4); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }

.page-ref { display: inline-block; margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 10px; color: var(--text3); background: var(--bg4); padding: 2px 8px; border-radius: 4px; border: 1px solid var(--border); }
.qcm-nav { display: -webkit-flex; display: flex; gap: 10px; flex-wrap: wrap; -webkit-align-items: center; align-items: center; }
.btn-primary { padding: 10px 20px; background: var(--accent); color: #000; border: none; border-radius: var(--r2); font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer; transition: all 0.2s; -webkit-appearance: none; appearance: none; }

.methode-card-title { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--accent2); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }

  {q:"L'assurance tous risques chantier (TRC) est :",type:'multi',opts:[{t:"Un document facultatif",c:true},{t:"Souscrite obligatoirement par l'entrepreneur",c:false},{t:"Un document contractuel obligatoire du marché",c:false},{t:"Délivrée par l'administration",c:false}],diff:'med',piege:true,expl:"La TRC est FACULTATIVE. Elle est souscrite par le MOA ou toute personne avec intérêt global sur le chantier — mais elle n'est pas obligatoire.",ref:"Chapitre 2 › Section I › Page 12"},
  {q:"L'assurance TRC couvre les dommages :",type:'multi',opts:[{t:"Jusqu'à la réception provisoire",c:true},{t:"Jusqu'à la réception définitive",c:false},{t:"Pendant 10 ans après la réception définitive",c:false},{t:"Uniquement pendant la phase de gros œuvre",c:false}],diff:'med',piege:true,expl:"La garantie TRC s'entend jusqu'à la réception PROVISOIRE pour tous les dommages matériels. Elle ne couvre pas après la réception définitive.",ref:"Chapitre 2 › Section I › Page 12"},
  {q:"Le permis de construire est délivré par :",type:'multi',opts:[{t:"Une administration",c:true},{t:"Le maître de l'ouvrage",c:false},{t:"Un géomètre expert",c:false},{t:"Le bureau de contrôle technique",c:false}],diff:'easy',piege:false,expl:"Le permis de construire est une autorisation administrative obligatoire. Il est délivré par une administration et non par le MOA ou un prestataire privé.",ref:"Chapitre 2 › Section II › Page 12"},
  {q:"Le permis de construire est-il nécessaire si des ingénieurs qualifiés sont présents sur le chantier ?",type:'multi',opts:[{t:"Oui, il reste obligatoire dans tous les cas",c:true},{t:"Non, la présence d'ingénieurs qualifiés le remplace",c:false},{t:"Seulement pour les projets de plus de 500 m²",c:false},{t:"Il est facultatif si le MOA est une personne morale de droit public",c:false}],diff:'med',piege:true,expl:"Le permis de construire est une autorisation administrative OBLIGATOIRE sans exception. La présence d'ingénieurs qualifiés ne dispense en aucun cas de l'obtenir.",ref:"Chapitre 2 › Section II › Page 12"},
  {q:"Selon la norme NF P 03-001, l'ordre de service de démarrage des travaux doit être notifié :",type:'multi',opts:[{t:"Entre 15 et 30 jours avant la date fixée comme origine du délai contractuel",c:true},{t:"Entre 0 et 15 jours avant le début du délai contractuel",c:false},{t:"Entre 16 et 31 jours avant le début du délai contractuel",c:false},{t:"Entre 0 et 24 jours avant le début du délai contractuel",c:false}],diff:'med',piege:true,expl:"La norme NF P 03-001 fixe que l'OS de démarrage doit être notifié entre 30 et 15 jours avant la date d'origine du délai. Soit : entre 15 et 30 jours.",ref:"Chapitre 2 › Section III › Page 12-13"},
  {q:"L'ordre de service de commencer les travaux est établi par :",type:'multi',opts:[{t:"Le maître d'ouvrage",c:true},{t:"Le service administratif de l'État",c:false},{t:"Le bureau de contrôle",c:false},{t:"L'architecte",c:false}],diff:'easy',piege:false,expl:"L'OS de commencer les travaux est établi par le maître d'ouvrage. Il est adressé à l'entreprise pour déclencher contractuellement le délai d'exécution.",ref:"Chapitre 2 › Section III › Page 12"},
  {q:"L'ordre de service de commencer les travaux est établi pour :",type:'multi',opts:[{t:"L'entreprise",c:true},{t:"Le service administratif de l'État",c:false},{t:"L'assureur",c:false},{t:"Le bureau de contrôle",c:false}],diff:'easy',piege:false,expl:"L'OS est adressé à l'entreprise pour lui signifier la date de démarrage contractuel des travaux.",ref:"Chapitre 2 › Section III › Page 12"},
  {q:"Le plan d'installation de chantier est établi par :",type:'multi',opts:[{t:"L'entrepreneur",c:true},{t:"L'architecte",c:false},{t:"Le contrôle technique",c:false},{t:"Le maître d'ouvrage délégué",c:false}],diff:'easy',piege:false,expl:"Le plan d'installation de chantier est établi par l'entreprise, puis approuvé par le maître d'œuvre.",ref:"Chapitre 2 › Section IV › Page 13"},
  {q:"La date contractuelle de démarrage des travaux est mentionnée sur :",type:'multi',opts:[{t:"L'ordre de service de commencer les travaux",c:true},{t:"Le plan d'implantation",c:false},{t:"Les plans d'exécution",c:false},{t:"Le contrat entre le MOA et l'entreprise",c:false}],diff:'med',piege:true,expl:"C'est l'OS de commencer les travaux qui mentionne la date de début du délai contractuel. L'acte d'engagement précise le délai global mais c'est l'OS qui fixe le point de départ.",ref:"Chapitre 2 › Section III › Page 12-13"},
  {q:"La réunion de chantier est organisée en général de façon :",type:'multi',opts:[{t:"Hebdomadaire",c:true},{t:"Mensuelle",c:false},{t:"Bimensuelle",c:false},{t:"Trimestrielle",c:false}],diff:'easy',piege:false,expl:"La réunion de chantier (ou rendez-vous de chantier) est organisée en général de façon hebdomadaire pour régler les problèmes administratifs, techniques et matériels.",ref:"Chapitre 3 › Section I.1 › Page 18"},
  {q:"La réunion de chantier peut se tenir malgré l'absence :",type:'multi',opts:[{t:"Du maître d'ouvrage",c:true},{t:"De l'entreprise",c:false},{t:"Du bureau de suivi et de contrôle",c:false},{t:"Du maître d'œuvre",c:false}],diff:'med',piege:true,expl:"La présence de l'entreprise est obligatoire. La réunion peut se tenir même si le MOA est absent (il reçoit le PV quand même). Le bureau de suivi/contrôle et le MOE sont aussi indispensables.",ref:"Chapitre 3 › Section I.1.c › Page 19"},
  {q:"Le procès-verbal de chantier a pour objet principal de :",type:'multi',opts:[{t:"Constater l'application des clauses du marché",c:true},{t:"Fixer le prix des travaux supplémentaires",c:false},{t:"Autoriser le démarrage des travaux",c:false},{t:"Recevoir provisoirement les ouvrages",c:false}],diff:'easy',piege:false,expl:"Le PV a pour objet principal de constater l'application des clauses du marché et d'acter ce qui s'est dit lors de la réunion.",ref:"Chapitre 3 › Section I.2.a › Page 19-20"},
  {q:"Lors d'une réunion hebdomadaire, qui rédige le PV de chantier ?",type:'multi',opts:[{t:"Le chef de mission du bureau de contrôle ou le maître d'œuvre",c:true},{t:"Le conducteur des travaux de l'entreprise",c:false},{t:"Le chef de chantier de l'entreprise",c:false},{t:"Le maître d'ouvrage ou son représentant",c:false}],diff:'med',piege:true,expl:"C'est en général le maître d'œuvre ou le contrôle technique (chef de mission du bureau de contrôle) qui est chargé de convoquer, animer la réunion et établir le PV. Jamais l'entreprise.",ref:"Chapitre 3 › Section I.2.a › Page 20"},
  {q:"Le PV de chantier doit obligatoirement comporter :",type:'multi',opts:[{t:"Le numéro du marché ou bon de commande",c:true},{t:"Les observations de la mission de contrôle",c:true},{t:"Les observations du maître d'ouvrage",c:true},{t:"L'heure d'arrivée des différents acteurs",c:false}],diff:'hard',piege:true,expl:"Le PV comporte : nom du projet, N° PV, N° marché, date, intervenants, signatures, pagination, observations de toutes les parties. L'heure d'arrivée n'est PAS une mention requise → piège classique.",ref:"Chapitre 3 › Section I.2.b-c › Page 20-21"},
  {q:"Le PV de remise de site est établi :",type:'multi',opts:[{t:"Au démarrage des travaux pour remettre le site à l'entrepreneur",c:true},{t:"À la fin des travaux avant la réception provisoire",c:false},{t:"Un an après la réception provisoire",c:false},{t:"Lors de la première réunion de chantier",c:false}],diff:'med',piege:false,expl:"Le PV de remise de site est spécifique au démarrage. Il formalise la remise physique du site à l'entrepreneur adjudicataire.",ref:"Chapitre 3 › Section I.3.a › Page 21"},
  {q:"La réception définitive a lieu :",type:'multi',opts:[{t:"Généralement un an après la levée de toutes les réserves de la réception provisoire",c:true},{t:"Immédiatement après la réception provisoire sans réserve",c:false},{t:"Six mois après la fin des travaux",c:false},{t:"Deux ans après la réception provisoire",c:false}],diff:'med',piege:true,expl:"La réception définitive a lieu généralement 1 an après la levée de toutes les réserves formulées lors de la réception provisoire.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Le PV de réception définitive conditionne :",type:'multi',opts:[{t:"Le paiement de la retenue de garantie (ou son déblocage si caution bancaire)",c:true},{t:"Le début du délai contractuel",c:false},{t:"Le paiement du premier acompte à l'entreprise",c:false},{t:"La délivrance du permis de construire",c:false}],diff:'med',piege:false,expl:"La réception définitive permet le versement de la retenue de garantie ou son déblocage si elle avait été fournie sous forme de caution bancaire.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Le journal de chantier est tenu à l'initiative de :",type:'multi',opts:[{t:"Le maître d'œuvre ou le bureau de suivi et de contrôle",c:true},{t:"L'entreprise uniquement",c:false},{t:"Le maître d'ouvrage",c:false},{t:"Le contrôleur technique agréé",c:false}],diff:'easy',piege:false,expl:"Le journal de chantier est tenu à l'initiative du maître d'œuvre ou du bureau de suivi et de contrôle.",ref:"Chapitre 3 › Section II › Page 22"},
  {q:"Le journal de chantier est accessible :",type:'multi',opts:[{t:"À toutes les personnes liées au chantier",c:true},{t:"À l'entreprise et au maître d'œuvre uniquement",c:false},{t:"À l'entreprise et au maître d'ouvrage uniquement",c:false},{t:"Uniquement le jour de la réunion hebdomadaire",c:false}],diff:'med',piege:true,expl:"Le journal de chantier est accessible à toutes les personnes liées au chantier. Toute personne peut y annoter ses observations. L'original reste sur le chantier.",ref:"Chapitre 3 › Section II › Page 22-23"},
  {q:"Le rapport mensuel d'avancement est établi par :",type:'multi',opts:[{t:"Le maître d'œuvre ou le bureau de suivi et de contrôle",c:true},{t:"L'entreprise",c:false},{t:"Le maître d'ouvrage",c:false},{t:"L'assureur",c:false}],diff:'easy',piege:true,expl:"Le rapport mensuel est établi par le MOE ou le bureau de suivi et contrôle. L'entreprise n'établit PAS ce rapport — c'est un piège fréquent.",ref:"Chapitre 3 › Section III › Page 23"},
  {q:"Le rapport mensuel d'avancement est établi principalement pour :",type:'multi',opts:[{t:"Le maître d'ouvrage",c:true},{t:"Le maître d'œuvre",c:false},{t:"L'assureur",c:false},{t:"L'entreprise",c:false}],diff:'easy',piege:false,expl:"Le rapport mensuel d'avancement est destiné principalement au maître d'ouvrage pour l'informer des progrès et difficultés.",ref:"Chapitre 3 › Section III › Page 23"},
  {q:"Le rapport mensuel d'avancement des travaux est :",type:'multi',opts:[{t:"Un document non contractuel rédigé par le MOE/bureau contrôle",c:true},{t:"Un document contractuel du marché",c:false},{t:"Rédigé par l'entreprise",c:false},{t:"Un document permettant le paiement du maître d'œuvre",c:false}],diff:'med',piege:true,expl:"Le rapport mensuel n'est PAS un document contractuel du marché. Il est rédigé par le MOE/bureau contrôle (pas l'entreprise) et ne sert pas directement au paiement.",ref:"Chapitre 3 › Section III › Page 23"},
  {q:"Quels sont les documents en cours de chantier établis par le bureau de contrôle technique ?",type:'multi',opts:[{t:"Le rapport mensuel d'avancement",c:true},{t:"Le procès-verbal de chantier",c:true},{t:"Le planning d'exécution des travaux",c:false}],diff:'med',piege:true,expl:"Le bureau de contrôle établit le rapport mensuel d'avancement ET le PV de chantier. Le planning d'exécution des travaux est établi par l'entreprise.",ref:"Chapitre 3 › Sections I-III › Page 18-25"},
  {q:"Le document établi par l'entreprise en cours de chantier est :",type:'multi',opts:[{t:"Le planning d'exécution des travaux",c:true},{t:"Le rapport mensuel d'avancement",c:false},{t:"Le procès-verbal de chantier",c:false}],diff:'med',piege:true,expl:"L'entreprise établit le planning d'exécution des travaux. Le PV et le rapport mensuel sont établis par le MOE ou le bureau de contrôle.",ref:"Chapitre 3 › Sections I-III › Page 18-25"},
  {q:"Le rapport mensuel d'avancement recense :",type:'multi',opts:[{t:"Les réceptions partielles d'ouvrages avec dates et référence des PV",c:true},{t:"La liste des engins présents chaque jour",c:false},{t:"Le détail de chaque réunion hebdomadaire",c:false},{t:"Les salaires de l'ensemble du personnel",c:false}],diff:'med',piege:false,expl:"Dans la section 'Revue des activités importantes', le rapport mensuel recense les réceptions partielles d'ouvrages avec les dates, les acteurs présents et les références des PV.",ref:"Chapitre 3 › Section III.2 › Page 23"},
  {q:"Dans quel(s) document(s) de chantier peut-on retrouver à la fois le numéro du marché et le taux d'avancement des travaux ?",type:'multi',opts:[{t:"Le procès-verbal de chantier",c:true},{t:"Le rapport mensuel d'avancement des travaux",c:true},{t:"Le journal de chantier",c:false}],diff:'hard',piege:true,expl:"Le PV comporte le N° de marché et l'état d'avancement (%). Le rapport mensuel contient aussi ces deux informations. Le journal de chantier ne comporte pas systématiquement le N° de marché.",ref:"Chapitre 3 › Sections I.2 et III › Page 20-24"},
  {q:"Les réunions de chantier ont pour but :",type:'multi',opts:[{t:"D'informer et de prendre des décisions vis-à-vis des actions à engager",c:true},{t:"De permettre aux acteurs de discuter les meilleurs moyens pour la réalisation de l'ouvrage",c:true},{t:"De permettre le paiement de l'entrepreneur",c:false},{t:"De permettre aux acteurs de modifier les termes du contrat",c:false}],diff:'med',piege:true,expl:"Les réunions de chantier visent à informer, prendre des décisions, et rechercher les meilleurs moyens. Elles ne servent PAS à payer l'entrepreneur ni à modifier le contrat.",ref:"Chapitre 3 › Section I.1 › Page 18"},
  {q:"Pour la préparation d'une réunion hebdomadaire, il est nécessaire de disposer des informations sur :",type:'multi',opts:[{t:"Les moyens humains déployés par l'entreprise",c:true},{t:"Les moyens matériels déployés par l'entreprise",c:true},{t:"La présence effective des participants à la réunion",c:true},{t:"Les moyens financiers de l'entreprise",c:false}],diff:'med',piege:true,expl:"Pour préparer la réunion : liste des membres présents, moyens humains, moyens matériels, taux d'exécution. Les moyens financiers de l'entreprise ne font pas partie des informations requises pour la préparation.",ref:"Chapitre 3 › Section I.1.a › Page 19"},
  {q:"Le PV de réception provisoire est :",type:'multi',opts:[{t:"Établi avant le PV de réception définitive",c:true},{t:"Signé au minimum par l'entrepreneur, le MOA et le MOE",c:true},{t:"Facultatif si l'entreprise a fourni toutes les garanties",c:false},{t:"Rédigé en l'absence de l'entreprise pour relever les malfaçons",c:false}],diff:'hard',piege:true,expl:"Le PV provisoire est toujours établi AVANT le définitif. Il est signé par l'entrepreneur + MOE + MOA (minimum). Il ne peut pas être rédigé en l'absence de l'entrepreneur.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Lors du PV de remise d'ouvrage, à partir de quand le MOA prend-il la charge de l'ouvrage ?",type:'multi',opts:[{t:"À dater de la remise formelle par le PV",c:true},{t:"Un an après la réception provisoire",c:false},{t:"Au moment de la réception définitive",c:false},{t:"Lors de la signature de l'acte d'engagement",c:false}],diff:'med',piege:false,expl:"À dater de la remise formalisée dans le PV de remise d'ouvrage, la garde et la charge de l'ouvrage sont transférées au maître d'ouvrage.",ref:"Chapitre 3 › Section I.3.b › Page 21-22"},
  {q:"Le contenu journalier du journal de chantier comprend :",type:'multi',opts:[{t:"Le temps de travail et les journées d'intempérie",c:true},{t:"Les effectifs des entreprises et l'avancement du chantier",c:true},{t:"Les pannes d'engins et les approvisionnements",c:true},{t:"La situation financière mensuelle",c:false}],diff:'med',piege:false,expl:"Le journal comporte : constatations générales (temps de travail, effectifs, avancement), observations ponctuelles (pannes, approvisionnements, remarques d'exécution). La situation financière est dans le rapport mensuel.",ref:"Chapitre 3 › Section II › Page 22"},
  {q:"Le rapport mensuel d'avancement traite des activités du projet de façon :",type:'multi',opts:[{t:"Brève et succincte",c:true},{t:"Exhaustive et très détaillée",c:false},{t:"Uniquement chiffrée sans commentaires",c:false},{t:"Uniquement narrative sans données chiffrées",c:false}],diff:'easy',piege:false,expl:"Le rapport mensuel ne traite pas de façon détaillée l'avancement du projet, mais de façon brève et succincte. L'objectif est d'informer le MOA, pas de produire un rapport exhaustif.",ref:"Chapitre 3 › Section III › Page 23"},
  {q:"L'assurance TRC peut être souscrite par :",type:'multi',opts:[{t:"Le maître d'ouvrage",c:true},{t:"L'entreprise (toute personne avec intérêt global)",c:true},{t:"Le bailleur de fond",c:false},{t:"Un sous-traitant seul",c:false}],diff:'hard',piege:true,expl:"La TRC est souscrite par le MOA ou à sa demande ou par toute autre personne qui a un intérêt global sur le chantier. Le bailleur de fond et le sous-traitant seul n'entrent pas dans cette catégorie selon le cours.",ref:"Chapitre 2 › Section I › Page 12"},
  {q:"En fin de chantier, quels documents le MOA doit-il s'attendre à recevoir du contrôle et/ou de l'entreprise ?",type:'multi',opts:[{t:"Le journal de chantier",c:true},{t:"Les plans de recollements",c:true},{t:"Le plan d'installation du chantier",c:false},{t:"La caution d'avance de démarrage",c:false}],diff:'hard',piege:true,expl:"Le MOA reçoit : le journal de chantier (il le conserve après réception) + les plans de recollements + les DOE (dossiers des ouvrages exécutés). Le plan d'installation et la caution d'avance ne sont pas remis au MOA en fin de chantier.",ref:"Chapitre 3 › Section I.3.b et II › Page 21-23"}
];

// ✏ ZONE C — SÉRIE 2 : CAS PRATIQUES
const serie2 = [
  {q:"Sur le chantier de construction d'un barrage à Ouagadougou, M. Kaboré représente la structure qui finance et commande les travaux. Il est responsable du financement et a défini le programme. Quel est son rôle ?",type:'multi',opts:[{t:"Maître d'ouvrage",c:true},{t:"Maître d'œuvre",c:false},{t:"Entrepreneur",c:false},{t:"Contrôleur technique",c:false}],diff:'easy',piege:false,expl:"M. Kaboré correspond à la définition du MOA : il finance, a défini le programme, et est l'initiateur de la commande.",ref:"Chapitre 1 › Section I › Page 5"},
  {q:"Sur un chantier de construction d'école, l'architecte DIALLO reçoit chaque mardi un rapport de l'ingénieur du BET sur les fondations. Ce type d'échange entre l'architecte et le BET relève d'une liaison :",type:'multi',opts:[{t:"Opérationnelle",c:true},{t:"Contractuelle",c:false},{t:"Légale",c:false},{t:"Administrative",c:false}],diff:'med',piege:false,expl:"L'architecte et le BET collaborent sans contrat direct entre eux → liaison opérationnelle. L'architecte a un contrat avec le MOA ; le BET peut aussi en avoir un avec le MOA mais pas avec l'architecte directement.",ref:"Chapitre 1 › Section I › Page 6-7"},
  {q:"La société SOGEA souhaite construire un entrepôt logistique de 2 000 m². Le responsable sécurité de SOGEA demande si un permis de construire est nécessaire, étant donné que leur chef de projet est un ingénieur génie civil expérimenté. Que lui répondez-vous ?",type:'multi',opts:[{t:"Oui, le permis est obligatoire quelle que soit la qualification des personnes présentes",c:true},{t:"Non, la présence d'un ingénieur qualifié dispense du permis",c:false},{t:"Seulement si le projet dépasse 5 000 m²",c:false},{t:"Le permis est facultatif pour les entrepôts industriels",c:false}],diff:'med',piege:true,expl:"Le permis de construire est une autorisation administrative OBLIGATOIRE. Aucune qualification professionnelle ne peut s'y substituer.",ref:"Chapitre 2 › Section II › Page 12"},
  {q:"Le 1er juillet, le MOA envoie un OS de démarrage des travaux en indiquant que le délai contractuel commence le 20 juillet. Cet OS est-il conforme à la norme NF P 03-001 ?",type:'multi',opts:[{t:"Oui, car il y a 19 jours entre l'envoi et le démarrage, ce qui est dans la fourchette 15-30 jours",c:true},{t:"Non, il aurait dû être envoyé le 5 juillet au plus tard",c:false},{t:"Non, l'OS doit être envoyé exactement 15 jours avant",c:false},{t:"Non, l'OS est établi par l'architecte, pas le MOA",c:false}],diff:'hard',piege:true,expl:"19 jours se situe entre 15 et 30 jours → conforme. La norme NF P 03-001 exige une notification entre 15 et 30 jours avant l'origine du délai. L'OS est bien établi par le MOA.",ref:"Chapitre 2 › Section III › Page 12-13"},
  {q:"Le chantier de construction du siège de la mairie de Kaya a débuté il y a 3 semaines. Un incendie se déclare dans la zone de stockage des matériaux. L'assurance TRC souscrite avant le démarrage prendra-t-elle en charge ce sinistre ?",type:'multi',opts:[{t:"Oui, car l'incendie est survenu avant la réception provisoire",c:true},{t:"Non, l'incendie n'est pas couvert par la TRC",c:false},{t:"Oui, mais seulement si l'entrepreneur est reconnu fautif",c:false},{t:"Non, la TRC ne couvre que les effondrements structurels",c:false}],diff:'med',piege:false,expl:"La TRC couvre l'incendie jusqu'à la réception provisoire des travaux. Un incendie 3 semaines après le démarrage est bien dans la période de couverture.",ref:"Chapitre 2 › Section I › Page 12"},
  {q:"La réception provisoire du chantier de la route nationale RN2 a eu lieu le 15 mars 2023 avec 3 réserves. Toutes les réserves ont été levées le 30 avril 2023. Quand peut avoir lieu la réception définitive ?",type:'multi',opts:[{t:"Vers le 30 avril 2024 (1 an après la levée des réserves)",c:true},{t:"Vers le 15 mars 2024 (1 an après la réception provisoire)",c:false},{t:"Immédiatement après la levée de la dernière réserve",c:false},{t:"Deux ans après la réception provisoire",c:false}],diff:'hard',piege:true,expl:"La réception définitive a lieu généralement 1 an après la LEVÉE DES RÉSERVES, pas 1 an après la réception provisoire. Ici : levée le 30 avril 2023 → définitive vers le 30 avril 2024.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Lors de la réunion de chantier du mardi 10 octobre, le MOA est retenu à Ouagadougou pour une réunion d'urgence. Peut-on tenir la réunion de chantier en son absence ?",type:'multi',opts:[{t:"Oui, la réunion peut se tenir et le MOA recevra le PV",c:true},{t:"Non, la réunion ne peut pas se tenir sans le MOA",c:false},{t:"Oui, mais aucun PV ne peut être rédigé en son absence",c:false},{t:"Non, il faut reporter d'au moins 72h",c:false}],diff:'med',piege:true,expl:"La réunion peut se tenir en l'absence du MOA. Le PV lui sera diffusé ensuite. Seule la présence de l'entreprise est obligatoire en marchés publics et privés.",ref:"Chapitre 3 › Section I.1.c › Page 19"},
  {q:"L'entreprise BATIBUR conteste un retard qui lui est imputé. Pour prouver qu'elle était en attente d'approvisionnements fournis par le MOA, quel document permet de retrouver l'historique de cette situation ?",type:'multi',opts:[{t:"Le journal de chantier",c:true},{t:"Le plan d'installation de chantier",c:false},{t:"L'acte d'engagement",c:false},{t:"Le CCTP",c:false}],diff:'med',piege:false,expl:"Le journal de chantier sert à centraliser les informations liées à l'exécution et à retrouver l'historique en cas de contestations. C'est son rôle clé.",ref:"Chapitre 3 › Section II › Page 23"},
  {q:"Le chef de mission du bureau de contrôle SOCOTEC rédige chaque semaine le PV de réunion de chantier. Le conducteur de travaux de l'entreprise EDIFICIO lui demande pourquoi c'est lui qui le rédige. Quelle est la bonne réponse ?",type:'multi',opts:[{t:"Car c'est en général le maître d'œuvre ou le bureau de contrôle qui convoque, anime et rédige le PV",c:true},{t:"Car l'entreprise a demandé à ne plus le rédiger",c:false},{t:"Car le MOA a délégué cette tâche au bureau de contrôle par avenant",c:false},{t:"Car le CCAG impose que seul le bureau de contrôle rédige les PV",c:false}],diff:'med',piege:false,expl:"C'est en général le MOE ou le bureau de contrôle qui est chargé de convoquer, animer la réunion et établir le PV. Ce n'est pas une décision arbitraire, c'est la règle générale.",ref:"Chapitre 3 › Section I.2.a › Page 20"},
  {q:"Pour le projet de construction d'un château d'eau à Koudougou, le bureau de contrôle doit produire son rapport de fin de mois. Ce rapport doit inclure :",type:'multi',opts:[{t:"Les réceptions partielles d'ouvrages avec dates et références des PV",c:true},{t:"Les réunions hebdomadaires avec dates et PV",c:true},{t:"La situation financière du projet",c:true},{t:"Les heures de présence de chaque ouvrier",c:false}],diff:'med',piege:false,expl:"Le rapport mensuel comprend : présentation projet, activités importantes (réceptions partielles, réunions), état d'avancement, problèmes/recommandations, situation financière. Le détail des heures de chaque ouvrier n'en fait pas partie.",ref:"Chapitre 3 › Section III › Page 23-25"},
  {q:"Après une réunion de chantier, l'entreprise AFRIBUILD conteste une observation qui lui a été adressée oralement. Quel document fait foi pour prouver que cette observation a bien été formulée ?",type:'multi',opts:[{t:"Le procès-verbal de chantier",c:true},{t:"Le planning d'exécution",c:false},{t:"Le rapport mensuel d'avancement",c:false},{t:"L'acte d'engagement",c:false}],diff:'med',piege:false,expl:"Le PV de chantier permet d'acter ce qui s'est dit lors de la réunion, y compris les observations adressées à l'entreprise. C'est le document de référence pour les contestations immédiates.",ref:"Chapitre 3 › Section I.2.a › Page 19-20"},
  {q:"La réception provisoire des travaux de construction d'un lycée a eu lieu avec 2 réserves. L'entrepreneur TRAORÉ demande à être libéré de ses obligations. Quand cela est-il possible ?",type:'multi',opts:[{t:"Après la réception définitive qui suit la levée de toutes les réserves",c:true},{t:"Immédiatement après la réception provisoire",c:false},{t:"Après le paiement du dernier décompte",c:false},{t:"Dès la signature du PV de réception provisoire",c:false}],diff:'med',piege:true,expl:"L'entrepreneur est libéré de ses obligations après la réception définitive (qui a lieu 1 an après la levée de toutes les réserves). La réception provisoire avec réserves ne libère pas l'entrepreneur.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Sur le chantier d'un immeuble de bureaux à Ouagadougou, le MOA souhaite connaître le taux d'avancement global au 15 du mois. Il consulte le PV de la réunion du 12. Il y trouve un taux de 45%. Ce taux représente :",type:'multi',opts:[{t:"L'évaluation de l'état d'avancement global de tous les postes entamés, exprimé en % par rapport à l'ouvrage entier",c:true},{t:"Le pourcentage du montant déjà payé à l'entreprise",c:false},{t:"Le nombre de jours travaillés sur le nombre total prévu",c:false},{t:"Le ratio postes terminés / postes prévus",c:false}],diff:'hard',piege:false,expl:"Le taux d'exécution général est obtenu en rapportant l'avancement des postes entamés à la réalisation de l'ouvrage tout entier, exprimé en pourcentage.",ref:"Chapitre 3 › Section I.2.c › Page 21"},
  {q:"Le MOA du projet de barrage hydroélectrique reçoit en janvier le rapport mensuel d'avancement de décembre. Il constate que le taux physique est de 38% mais que le taux financier (paiements effectués) est de 52%. Quelle partie du rapport mensuel contient l'information sur les paiements ?",type:'multi',opts:[{t:"La situation financière",c:true},{t:"La présentation du projet",c:false},{t:"La revue des activités importantes",c:false},{t:"L'état d'avancement des travaux",c:false}],diff:'med',piege:false,expl:"La situation financière est la 5ème partie du rapport mensuel. Elle récapitule l'ensemble des paiements, décomptes, cautions et avances.",ref:"Chapitre 3 › Section III.5 › Page 24-25"},
  {q:"Le directeur des travaux de l'entreprise BÂTI-SAHEL veut consulter le journal de chantier pour vérifier une date d'approvisionnement litigieuse. L'agent du bureau de contrôle lui refuse l'accès. A-t-il le droit de refuser ?",type:'multi',opts:[{t:"Non, le journal de chantier est accessible à toutes les personnes liées au chantier",c:true},{t:"Oui, seul le MOE y a accès",c:false},{t:"Oui, l'accès est réservé au bureau de contrôle et au MOA",c:false},{t:"Non, mais seulement les jours de réunion hebdomadaire",c:false}],diff:'med',piege:false,expl:"Le journal de chantier est accessible à toutes les personnes liées au chantier. L'agent du bureau de contrôle ne peut pas en refuser l'accès.",ref:"Chapitre 3 › Section II › Page 22"},
  {q:"L'entreprise CONSTRUKTA est adjudicataire d'un marché de construction d'un pont. Avant le démarrage, elle doit établir un plan indiquant l'organisation générale du chantier, l'emplacement des engins et des zones de stockage. De quel document s'agit-il ?",type:'multi',opts:[{t:"Le plan d'installation de chantier",c:true},{t:"Le plan d'implantation des ouvrages",c:false},{t:"Le plan d'exécution",c:false},{t:"Le CCTP",c:false}],diff:'easy',piege:false,expl:"Le plan d'installation de chantier est établi par l'entrepreneur. Il prévoit le matériel nécessaire, l'aménagement des lieux et donne une vision globale de l'organisation du chantier.",ref:"Chapitre 2 › Section IV › Page 13"},
  {q:"Suite à un sinistre sur le chantier du barrage de Bagré causé par une crue exceptionnelle (force majeure), le MOA se demande si la TRC couvre ce type de dommage. Que lui répondez-vous ?",type:'multi',opts:[{t:"Oui, la TRC couvre les dommages causés par des forces majeures (comme les inondations) jusqu'à la réception provisoire",c:true},{t:"Non, la force majeure exonère toutes les assurances",c:false},{t:"Oui, mais seulement si l'ouvrage est déjà à 50% d'avancement",c:false},{t:"Non, la TRC ne couvre que les malfaçons de l'entreprise",c:false}],diff:'med',piege:false,expl:"La TRC couvre l'ensemble des dommages matériels causés aux ouvrages en cours d'exécution, y compris ceux provenant de forces majeures.",ref:"Chapitre 2 › Section I › Page 12"},
  {q:"Le rapport mensuel de mars d'un chantier de construction de logements sociaux indique une évolution hebdomadaire des taux : sem1=1,5%, sem2=1,88%, sem3=2,15%, sem4=2,70%. Quel est le taux d'avancement global à la fin de la 4ème semaine ?",type:'multi',opts:[{t:"2,70% (taux cumulé à la fin de la sem4)",c:true},{t:"8,23% (somme de toutes les semaines)",c:false},{t:"0,55% (évolution de la dernière semaine)",c:false},{t:"2,15% (taux de la semaine précédente)",c:false}],diff:'hard',piege:true,expl:"Le taux global est le taux cumulé. À la sem4, il est de 2,70%. Les 1,5%, 1,88% etc. sont des taux GLOBAUX et non des évolutions. L'évolution hebdomadaire (la différence) est une information distincte.",ref:"Chapitre 3 › Section III.3 › Page 24"},
  {q:"Lors de la réception provisoire d'un bâtiment administratif, le MOA constate plusieurs défauts de carrelage. Il refuse la réception. L'entrepreneur conteste. Dans quel document ces faits seront-ils officiellement consignés ?",type:'multi',opts:[{t:"Le procès-verbal de réception provisoire (avec réserves ou refus)",c:true},{t:"Le journal de chantier",c:false},{t:"Le rapport mensuel d'avancement",c:false},{t:"L'ordre de service de commencer les travaux",c:false}],diff:'med',piege:false,expl:"La réception des travaux fait l'objet d'un PV de réception. En cas de malfaçons, la réception peut être refusée ou acceptée avec réserves, tout cela consigné dans le PV.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Le bureau de contrôle BETSAFE signale dans le PV de la réunion du 5 novembre que les armatures des poteaux ne sont pas conformes aux plans. Cette observation est adressée à l'entreprise. Où doit figurer l'état de mise en œuvre de cette observation lors de la réunion suivante ?",type:'multi',opts:[{t:"Dans la section 'État de mise en œuvre des observations' du PV de la réunion suivante",c:true},{t:"Dans un rapport d'inspection spécifique",c:false},{t:"Dans le rapport mensuel uniquement",c:false},{t:"Dans un avenant au marché",c:false}],diff:'med',piege:false,expl:"À chaque réunion, les observations de la réunion précédente sont passées en revue pour apprécier leur application. Cette section s'appelle 'État de mise en œuvre des observations'.",ref:"Chapitre 3 › Section I.2.c › Page 21"},
  {q:"Le MOA d'un projet de station d'eau potable demande à l'entreprise HYDROCONSTRUCT de lui remettre, à la fin des travaux, tous les documents nécessaires à l'exploitation et à la maintenance des ouvrages. Parmi les documents ci-dessous, lesquels correspondent à cette demande ?",type:'multi',opts:[{t:"Les plans de recollements",c:true},{t:"Le journal de chantier",c:true},{t:"Les dossiers des ouvrages exécutés (DOE)",c:true},{t:"Le planning d'exécution prévisionnel",c:false}],diff:'hard',piege:false,expl:"Le PV de remise d'ouvrage doit être accompagné des DOE, plans de recollements, et tous documents permettant l'exploitation et l'entretien. Le journal de chantier est aussi conservé par le MOA. Le planning prévisionnel ne fait pas partie des livrables finaux.",ref:"Chapitre 3 › Section I.3.b › Page 21-22"},
  {q:"À l'issue d'une réunion de chantier, le chef de chantier de l'entreprise AFRICABAT demande à rédiger lui-même le PV car 'il était le plus présent'. Le bureau de contrôle refuse. Qui a raison ?",type:'multi',opts:[{t:"Le bureau de contrôle a raison : c'est lui (ou le MOE) qui rédige le PV",c:true},{t:"Le chef de chantier a raison : n'importe qui peut rédiger le PV",c:false},{t:"Le chef de chantier a raison si le MOE est absent",c:false},{t:"Le MOA doit trancher ce différend",c:false}],diff:'med',piege:false,expl:"Le PV est rédigé par le MOE ou le bureau de contrôle, qui en ont la charge. La présence physique ne confère pas ce rôle à l'entreprise.",ref:"Chapitre 3 › Section I.2.a › Page 20"},
  {q:"Un nouveau technicien arrive sur le chantier. Son chef lui dit que les informations sur les pannes de l'excavatrice de la semaine dernière sont consignées quelque part. Où doit-il chercher ?",type:'multi',opts:[{t:"Dans le journal de chantier",c:true},{t:"Dans le procès-verbal de chantier hebdomadaire",c:true},{t:"Dans le rapport mensuel d'avancement",c:false},{t:"Dans le CCTP",c:false}],diff:'med',piege:false,expl:"Les pannes d'engins sont des observations ponctuelles qui figurent dans le journal de chantier (quotidien) et peuvent aussi figurer dans le PV de chantier (hebdomadaire) si elles ont impacté l'avancement.",ref:"Chapitre 3 › Sections I et II › Page 20-22"},
  {q:"Dans le cadre d'un marché public de construction d'un hôpital, l'entreprise principale veut sous-traiter les travaux d'électricité. Lors des réunions hebdomadaires, la présence du sous-traitant électricité est :",type:'multi',opts:[{t:"Possible car le MOE peut convoquer ceux dont la participation est jugée nécessaire",c:true},{t:"Impossible car seuls les acteurs contractuels principaux participent",c:false},{t:"Obligatoire en vertu du CCAG",c:false},{t:"Laissée à la discrétion de l'entreprise principale uniquement",c:false}],diff:'hard',piege:false,expl:"Le MOE convoque les personnes visées dans les documents contractuels ou celles dont la participation est jugée nécessaire, ce qui peut inclure les sous-traitants.",ref:"Chapitre 3 › Section I.1.c › Page 19"},
  {q:"Le chantier de construction d'une école primaire à Bobo-Dioulasso est terminé. Le MOA veut savoir si la retenue de garantie de 5% du marché peut être libérée. Quelle est la condition préalable ?",type:'multi',opts:[{t:"La signature du PV de réception définitive",c:true},{t:"La signature du PV de réception provisoire",c:false},{t:"La levée de toutes les réserves de la réception provisoire",c:false},{t:"Le paiement du dernier décompte mensuel",c:false}],diff:'med',piege:true,expl:"La retenue de garantie est conditionnée par la réception DÉFINITIVE (pas provisoire). La levée des réserves est nécessaire pour déclencher le délai menant à la réception définitive, mais c'est bien la réception définitive qui libère la retenue.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"L'ingénieur superviseur du projet de route bitumée BOAD-RN4 prépare le rapport mensuel d'août. Il doit mentionner toutes les réunions de chantier tenues en août. Dans quelle section les place-t-il ?",type:'multi',opts:[{t:"Revue des activités importantes",c:true},{t:"Présentation du projet",c:false},{t:"Problèmes et recommandations",c:false},{t:"Situation financière",c:false}],diff:'med',piege:false,expl:"Les réunions hebdomadaires de chantier (avec dates et PV) sont recensées dans la section 'Revue des activités importantes' du rapport mensuel.",ref:"Chapitre 3 › Section III.2 › Page 23"},
  {q:"Le technicien du bureau de contrôle CONTROL-PRO note chaque jour les effectifs présents, l'avancement et les incidents sur le chantier du centre de santé. Ce document tenu au quotidien est :",type:'multi',opts:[{t:"Le journal de chantier",c:true},{t:"Le procès-verbal de chantier",c:false},{t:"Le rapport mensuel d'avancement",c:false},{t:"Le plan d'installation de chantier",c:false}],diff:'easy',piege:false,expl:"Le journal de chantier est tenu au quotidien et contient les constatations générales (effectifs, avancement) et observations ponctuelles.",ref:"Chapitre 3 › Section II › Page 22"},
  {q:"Lors de la remise de site pour la construction d'un château d'eau, qui peut signer le PV de remise de site ?",type:'multi',opts:[{t:"Le maître d'ouvrage",c:true},{t:"Le maître d'œuvre",c:true},{t:"La mission de contrôle",c:true},{t:"L'assureur TRC",c:false}],diff:'med',piege:false,expl:"La remise est faite par le MOA, le MOA délégué ou l'autorité en charge de la passation. Le MOE et la mission de contrôle peuvent être associés et signataires. L'assureur n'est pas partie au PV de remise de site.",ref:"Chapitre 3 › Section I.3.a › Page 21"},
  {q:"Le MOA d'un projet PNUD demande au bureau de contrôle si le rapport mensuel d'avancement devra mentionner la date d'achèvement prévue du projet. Est-ce bien une information du rapport mensuel ?",type:'multi',opts:[{t:"Oui, cette information peut figurer dans la section état d'avancement / situation des travaux",c:true},{t:"Non, la date d'achèvement prévue ne figure jamais dans le rapport mensuel",c:false},{t:"Seulement si le projet accuse du retard",c:false},{t:"Uniquement dans le rapport annuel",c:false}],diff:'hard',piege:true,expl:"Selon les sujets d'examen, la date d'achèvement projetée peut figurer dans le rapport mensuel. Il recense aussi les réceptions partielles. Les deux informations peuvent coexister.",ref:"Chapitre 3 › Section III.3 › Page 24"},
  {q:"L'entreprise TEKBAT conteste l'état d'avancement de 32% mentionné dans le PV du 14 mars. Elle affirme que le taux réel est de 40%. Quelle procédure doit-on suivre ?",type:'multi',opts:[{t:"Inscrire les observations de l'entreprise dans le PV suivant et revoir le taux contradictoirement",c:true},{t:"Annuler le PV du 14 mars et en produire un nouveau",c:false},{t:"Saisir immédiatement le tribunal administratif",c:false},{t:"Modifier le taux dans le rapport mensuel sans changer le PV",c:false}],diff:'hard',piege:false,expl:"Le PV sert à acter les observations de toutes les parties. L'entreprise peut exprimer son désaccord dans la section 'Observations' du PV suivant, et le taux est revu contradictoirement lors de la réunion suivante.",ref:"Chapitre 3 › Section I.2.c › Page 21"},
  {q:"La caution bancaire remise par l'entreprise BATIPRO en lieu et place de la retenue de garantie sera débloquée :",type:'multi',opts:[{t:"Après la réception définitive des travaux",c:true},{t:"Après la réception provisoire sans réserve",c:false},{t:"Après le paiement du dernier décompte",c:false},{t:"6 mois après la réception provisoire",c:false}],diff:'med',piege:false,expl:"La réception définitive permet le versement de la retenue de garantie ou son déblocage si elle avait été fournie sous forme de caution bancaire.",ref:"Chapitre 3 › Section I.3.c › Page 22"},
  {q:"Sur le chantier du centre administratif régional, l'équipe du lundi matin constate que le journal de chantier a disparu. Quelle mesure préventive aurait permis d'éviter ce problème ?",type:'multi',opts:[{t:"Réaliser régulièrement des photocopies du journal",c:true},{t:"Numériser les PV hebdomadaires",c:false},{t:"Remettre le journal au MOA chaque semaine",c:false},{t:"Ne tenir le journal que lors des réunions hebdomadaires",c:false}],diff:'med',piege:false,expl:"Pour pallier la perte fréquente du journal de chantier (accessible à tous et donc exposé), il est recommandé d'en établir régulièrement des photocopies.",ref:"Chapitre 3 › Section II › Page 23"},
  {q:"Le rapport mensuel du mois de mai d'un chantier d'adduction d'eau indique : taux physique 58%, mais le taux financier (paiements effectués) n'est que de 35%. Ce décalage reflète probablement :",type:'multi',opts:[{t:"Des retards de paiement ou des décomptes non encore réglés par le MOA",c:true},{t:"Une erreur dans le calcul du taux physique",c:false},{t:"Une avance de démarrage trop élevée",c:false},{t:"Un problème dans les plans d'exécution",c:false}],diff:'hard',piege:false,expl:"Un taux physique plus élevé que le taux financier indique que les travaux avancent plus vite que les paiements, ce qui peut signaler des retards de paiement ou des décomptes en attente de règlement.",ref:"Chapitre 3 › Section III.5 › Page 24-25"},
  {q:"Le MOE convoque la réunion de chantier du 3 novembre en invitant le MOA, l'entreprise principale, le BET et le bureau de contrôle. Le MOA ne peut pas venir. L'entreprise envoie uniquement le chef de chantier au lieu du conducteur des travaux. La réunion peut-elle se tenir ?",type:'multi',opts:[{t:"Oui, le MOA peut être absent ; la présence de l'entreprise (même via le chef de chantier) permet la tenue de la réunion",c:true},{t:"Non, le conducteur de travaux est obligatoire",c:false},{t:"Non, le MOA doit impérativement être présent",c:false},{t:"Oui, mais aucune décision ne peut être prise sans le conducteur de travaux",c:false}],diff:'hard',piege:true,expl:"La réunion peut se tenir sans le MOA. L'entreprise doit être représentée (présence obligatoire), mais le cours ne précise pas que seul le conducteur de travaux est accepté — la présence de l'entreprise est satisfaite.",ref:"Chapitre 3 › Section I.1.c › Page 19"},
  {q:"Le bureau de contrôle doit préparer le rapport mensuel d'octobre pour le MOA d'un projet de 500 logements sociaux. Pour structurer son rapport, il doit respecter les 5 parties standards. Dans quel ordre logique doivent-elles apparaître ?",type:'multi',opts:[{t:"Présentation → Activités importantes → État d'avancement → Problèmes/Recommandations → Situation financière",c:true},{t:"Situation financière → Présentation → Activités → Avancement → Problèmes",c:false},{t:"État d'avancement → Présentation → Problèmes → Activités → Finances",c:false},{t:"Présentation → Situation financière → Activités → Avancement → Problèmes",c:false}],diff:'med',piege:false,expl:"Les 5 parties du rapport mensuel dans l'ordre : 1. Présentation du projet, 2. Revue des activités importantes, 3. État d'avancement/Situation des travaux, 4. Problèmes/Progrès/Recommandations, 5. Situation financière.",ref:"Chapitre 3 › Section III › Page 23-25"},
  {q:"L'entrepreneur CONSTRUBF remet au MOA à la fin des travaux les documents suivants : plans de recollements, journal de chantier, DOE. Il prétend avoir tout remis. Le bureau de contrôle estime que quelque chose manque. Qu'est-ce qui manque ?",type:'multi',opts:[{t:"Tous les documents permettant l'exploitation, l'entretien et le bon fonctionnement de l'ouvrage",c:true},{t:"Le planning d'exécution des travaux",c:false},{t:"Les PV de réunion hebdomadaire",c:false},{t:"Le plan d'installation du chantier",c:false}],diff:'hard',piege:false,expl:"Le PV de remise d'ouvrage doit être accompagné de tous les documents permettant l'exploitation, l'entretien et le bon fonctionnement de l'ouvrage — pas seulement plans de recollements et journal. Il peut manquer des notices de maintenance, schémas de fonctionnement, etc.",ref:"Chapitre 3 › Section I.3.b › Page 21-22"}
];

// ✏ ZONE D — SÉRIE 3 : EXAMEN RÉEL (questions des sujets PDF dans l'ordre)
const serie3 = [
  {q:"Le rapport mensuel d'avancement est établi pour :",type:'multi',opts:[{t:"Le maître d'ouvrage",c:true},{t:"Le maître d'œuvre",c:false},{t:"L'assureur",c:false},{t:"L'entreprise",c:false}],diff:'easy',piege:false,expl:"Le rapport mensuel d'avancement est établi par le MOE ou le bureau de suivi et contrôle, à destination principalement du maître d'ouvrage.",ref:"Chapitre 3 › Section III › Page 23"},
  {q:"Quels sont les documents, en cours de chantier, établis par l'entreprise ?",type:'multi',opts:[{t:"Le planning d'exécution des travaux",c:true},{t:"Le rapport mensuel d'avancement",c:false},{t:"Le procès-verbal de chantier",c:false}],diff:'med',piege:true,expl:"L'entreprise établit le planning d'exécution des travaux. Le rapport mensuel et le PV de chantier sont établis par le MOE ou le bureau de contrôle.",ref:"Chapitre 3 › Sections I-III › Page 18-25"},
  {q:"Le rapport d'avancement mensuel des travaux :",type:'multi',opts:[{t:"Recense les réceptions partielles d'ouvrages",c:true},{t:"Est un document contractuel du marché",c:false},{t:"Permet le paiement du maître d'œuvre",c:false},{t:"Est rédigé par l'entreprise",c:false}],diff:'med',piege:true,expl:"Le rapport mensuel recense les réceptions partielles d'ouvrages (dans la section 'Revue des activités importantes'). Ce n'est pas un document contractuel, pas rédigé par l'entreprise, ne sert pas directement à payer le MOE.",ref:"Chapitre 3 › Section III.2 › Page 23"},

const series=[serie1,serie2,serie3];
const STORAGE_KEY='QCM_PROGRESS_M16';
let currentSerie=0,currentQ=0,sessionQs=[],answers={},validated={},markedWrong={},wrongList=[],isRetryMode=false,pendingResume=null;
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({serie:currentSerie,question:currentQ,answers,validated,markedWrong,wrongList,isRetryMode,sessionOrder:sessionQs.map(q=>q.origIdx)}));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function clearProgress(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function checkResume(){const saved=loadProgress();if(!saved||Object.keys(saved.validated||{}).length===0)return;pendingResume=saved;const names=['Série 1 — Théorie','Série 2 — Cas Pratiques','Série 3 — Examen Réel'];document.getElementById('resumeInfo').textContent=(names[saved.serie]||'Série '+(saved.serie+1))+' · Question '+(saved.question+1);document.getElementById('resumeOverlay').style.display='flex';}
function doResume(){document.getElementById('resumeOverlay').style.display='none';if(!pendingResume)return;const s=pendingResume;currentSerie=s.serie;currentQ=s.question;answers=s.answers||{};validated=s.validated||{};markedWrong=s.markedWrong||{};wrongList=s.wrongList||[];isRetryMode=s.isRetryMode||false;const src=series[currentSerie];sessionQs=(s.sessionOrder||[]).map(origIdx=>{const q=src[origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});updateSerieButtons();updateScoreLive();renderQuestion();showSection('qcm');}
function doRestart(){document.getElementById('resumeOverlay').style.display='none';clearProgress();pendingResume=null;loadSerie(0);}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateSerieButtons(){document.querySelectorAll('.serie-btn').forEach((b,i)=>b.classList.toggle('active',i===currentSerie&&!isRetryMode));}
function updateScoreLive(){const vKeys=Object.keys(validated);let correct=0;sessionQs.forEach((q,i)=>{if(!validated[i])return;const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);if(cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x)))correct++;});const vCount=vKeys.length;document.getElementById('liveCorrect').textContent=correct;document.getElementById('liveWrong').textContent=vCount-correct;document.getElementById('liveTotal').textContent=sessionQs.length;document.getElementById('livePct').textContent=vCount>0?Math.round((correct/vCount)*100)+'%':'—';}
function loadSerie(idx,retry=false){currentSerie=idx;isRetryMode=retry;currentQ=0;answers={};validated={};if(!retry){wrongList=[];const shuffledIdxs=shuffleArray(series[idx].map((_,i)=>i));sessionQs=shuffledIdxs.map(origIdx=>{const q=series[idx][origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});}updateSerieButtons();updateScoreLive();renderQuestion();clearProgress();}
function loadRetry(){if(wrongList.length===0)return;isRetryMode=true;currentQ=0;answers={};validated={};sessionQs=wrongList.map(qi=>{const q=series[currentSerie][qi];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx:qi};});updateScoreLive();renderQuestion();}
function renderQuestion(){const container=document.getElementById('qcmContainer');const total=sessionQs.length;const pct=total>0?((currentQ+1)/total)*100:0;document.getElementById('qcmProgressBar').style.width=pct+'%';if(currentQ>=total){showScore();return;}const q=sessionQs[currentQ];const isVal=!!validated[currentQ];const sel=answers[currentQ]||[];const isMarked=!!markedWrong[q.origIdx];const letters=['A','B','C','D','E','F'];const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const isCorrect=isVal&&cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));let optsHtml='';q.shuffledOpts.forEach((opt,i)=>{let cls='option-item';if(isVal){cls+=' disabled';if(opt.c)cls+=' correct';else if(sel.includes(i))cls+=' wrong';}else if(sel.includes(i))cls+=' selected';optsHtml+=`<button class="${cls}" onclick="selectOpt(${i})" ${isVal?'disabled':''}><div class="option-letter">${letters[i]}</div><div class="option-text">${opt.t}</div></button>`;});const feedbackHtml=isVal?`<div class="feedback-banner ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ Bonne réponse !':'❌ Mauvaise réponse'}</div>`:'';const explHtml=isVal?`<div class="explanation-box"><div class="explanation-title">💡 Explication</div><div class="explanation-text">${q.expl}</div><span class="page-ref">📄 ${q.ref}</span></div>`:'';const multiHint=`<div class="multi-hint">⚠ Sélectionnez la ou les réponses correctes</div>`;const markLabel=isMarked?'✕ Retirer marque':'🔶 Marquer';container.innerHTML=`<div class="question-card"><div class="question-meta"><span class="q-num">Q${currentQ+1}/${total}${isRetryMode?' (Révision)':''}</span><span class="badge badge-${q.diff==='easy'?'easy':q.diff==='med'?'med':'hard'}">${q.diff==='easy'?'🟢 Facile':q.diff==='med'?'🟡 Moyen':'🔴 Difficile'}</span>${q.piege?'<span class="badge badge-piege">⚠ PIÈGE POSSIBLE</span>':''}${isMarked?'<span class="badge badge-marked">🔶 Marquée</span>':''}</div><div class="question-text">${q.q}</div>${multiHint}<div class="options-list">${optsHtml}</div>${feedbackHtml}${explHtml}</div><div class="qcm-nav">${!isVal?`<button class="btn-primary" onclick="validateQ()" ${sel.length===0?'disabled':''}>✓ Valider</button>`:`<button class="btn-primary" onclick="nextQ()">Suivant →</button>`}${currentQ>0?`<button class="btn-secondary" onclick="prevQ()">← Précédent</button>`:''}<button class="mark-btn ${isMarked?'marked':''}" onclick="toggleMark(${q.origIdx})">${markLabel}</button></div>`;}
function selectOpt(i){if(validated[currentQ])return;const q=sessionQs[currentQ];if(!answers[currentQ])answers[currentQ]=[];const idx=answers[currentQ].indexOf(i);if(idx>-1)answers[currentQ].splice(idx,1);else answers[currentQ].push(i);renderQuestion();}
function validateQ(){const q=sessionQs[currentQ];const sel=answers[currentQ]||[];if(sel.length===0)return;validated[currentQ]=true;const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const ok=cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));if(!ok&&!wrongList.includes(q.origIdx))wrongList.push(q.origIdx);if(!ok)markedWrong[q.origIdx]=true;updateScoreLive();saveProgress();renderQuestion();}
function nextQ(){currentQ++;saveProgress();renderQuestion();}
function prevQ(){if(currentQ>0){currentQ--;saveProgress();renderQuestion();}}
function toggleMark(origIdx){markedWrong[origIdx]=!markedWrong[origIdx];if(!markedWrong[origIdx]){const idx=wrongList.indexOf(origIdx);if(idx>-1)wrongList.splice(idx,1);}else if(!wrongList.includes(origIdx))wrongList.push(origIdx);saveProgress();renderQuestion();}
function showScore(){const total=sessionQs.length;const correct=sessionQs.filter((q,i)=>{const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);return cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));}).length;const wrong=total-correct;const pct=Math.round((correct/total)*100);const markedCount=Object.values(markedWrong).filter(v=>v).length;clearProgress();document.getElementById('qcmContainer').innerHTML=`<div class="score-card" id="scoreCard" style="display:block"><div class="score-big">${pct}%</div><div class="score-label">${isRetryMode?'Session de révision terminée':'Série '+(currentSerie+1)+' terminée'}</div><div class="score-stats"><div class="score-stat green"><div class="score-stat-val">${correct}</div><div class="score-stat-label">✅ Correct</div></div><div class="score-stat red"><div class="score-stat-val">${wrong}</div><div class="score-stat-label">❌ Incorrect</div></div><div class="score-stat"><div class="score-stat-val">${total}</div><div class="score-stat-label">Total</div></div>${markedCount>0?`<div class="score-stat orange"><div class="score-stat-val">${markedCount}</div><div class="score-stat-label">🔶 Marquées</div></div>`:''}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn-primary" onclick="loadSerie(${currentSerie})">🔄 Recommencer</button>${wrongList.length>0?`<button class="btn-retry" onclick="loadRetry()">🎯 Questions ratées (${wrongList.length})</button>`:''}</div><div style="margin-top:16px;font-size:12px;color:var(--text3)">${pct>=70?'🎉 Excellent !':pct>=50?'📚 Continuez à réviser.':'⚠ Révisez les fiches et recommencez.'}</div></div>`;document.getElementById('qcmProgressBar').style.width='100%';}

      <div class="schema-step"><div class="schema-num">ENT</div><div class="schema-text"><strong>Planning d'exécution des travaux</strong> · Plan d'installation de chantier (approuvé par MOE)</div></div>
      <div class="schema-step"><div class="schema-num">MOA</div><div class="schema-text"><strong>Ordre de service</strong> de commencer les travaux · Souscription TRC · Conservation journal après réception</div></div>
      <div class="schema-step"><div class="schema-num">ADM</div><div class="schema-text"><strong>Permis de construire</strong> (autorisation administrative obligatoire)</div></div>
    </div>
    <div class="methode-card">
      <div class="methode-card-title">📋 Schéma — Contenu du PV hebdomadaire</div>
      <div class="schema-step"><div class="schema-num">1</div><div class="schema-text"><strong>En-tête</strong> : Nom projet, N° PV, N° marché, date, lieu</div></div>
      <div class="schema-step"><div class="schema-num">2</div><div class="schema-text"><strong>Présents</strong> : Liste des intervenants (signatures en fin)</div></div>
      <div class="schema-step"><div class="schema-num">3</div><div class="schema-text"><strong>Moyens</strong> : Humains (personnel clé) + Matériels + Approvisionnements</div></div>
      <div class="schema-step"><div class="schema-num">4</div><div class="schema-text"><strong>Avancement</strong> : Taux d'exécution général en % (postes entamés)</div></div>
      <div class="schema-step"><div class="schema-num">5</div><div class="schema-text"><strong>Observations précédentes</strong> : État de mise en œuvre</div></div>
      <div class="schema-step"><div class="schema-num">6</div><div class="schema-text"><strong>Nouvelles observations</strong> : MOE, entreprise, contrôle, MOA</div></div>
      <div class="piege-box" style="margin-top:8px"><div class="piege-title">⚠ ABSENT du PV</div><div class="piege-text">L'heure d'arrivée des acteurs ≠ contenu PV</div></div>
    </div>
  </div>

  <div class="methode-card" style="margin-top:12px">
    <div class="methode-card-title">🔗 Tableau synthèse liaisons contractuelles / opérationnelles</div>
    <table class="chiffres-table">
      <thead><tr><th>Liaison</th><th>Type</th><th>Explication</th></tr></thead>
      <tbody>
        <tr><td>MOA ↔ Architecte/MOE</td><td style="color:var(--green)">Contractuelle</td><td>Contrat de maîtrise d'œuvre</td></tr>
        <tr><td>MOA ↔ Entrepreneur</td><td style="color:var(--green)">Contractuelle</td><td>Contrat d'entreprise (marché)</td></tr>
        <tr><td>MOA ↔ Contrôleur technique</td><td style="color:var(--green)">Contractuelle</td><td>Contrat d'agrément/mission</td></tr>
        <tr><td>Architecte ↔ BET</td><td style="color:var(--orange)">Opérationnelle</td><td>Collaboration sans contrat direct</td></tr>
        <tr><td>Architecte ↔ Entrepreneur</td><td style="color:var(--orange)">Opérationnelle</td><td>Coordination de chantier sans contrat direct</td></tr>
        <tr><td>BET ↔ Entrepreneur</td><td style="color:var(--orange)">Opérationnelle</td><td>Échanges techniques sans contrat direct</td></tr>
      </tbody>
    </table>
  </div>
`;}

document.addEventListener('DOMContentLoaded',()=>{buildFiches();buildMethode();loadSerie(0);checkResume();});
