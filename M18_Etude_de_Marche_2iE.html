    {t:"Un segment étroit aux besoins très spécifiques",c:true},
    {t:"Ciblée en général par une ou deux entreprises seulement",c:true},

  ], diff:'med', piege:true, expl:"La niche est un segment étroit aux besoins spécifiques qui offre un potentiel de RENTABILITÉ et de CROISSANCE. Contrairement aux segments larges, les niches ne sont ciblées que par 1 ou 2 entreprises. La réponse C est le piège (rentabilité n'est pas faible).", ref:"Chapitre 1 › Section A › Page 7"},

  {q:"La part de marché se calcule comme :", type:'multi', opts:[

  ], diff:'med', piege:false, expl:"La part de marché = ventes d'un produit / ventes totales du marché. Elle peut être en volume (unités vendues) ou en valeur (CA généré). Le potentiel de croissance = évolution globale du marché + évolution de sa part de marché.", ref:"Chapitre 1 › Section C › Page 9"},

  {q:"Le benchmarking consiste à :", type:'multi', opts:[

  {q:"La définition trop large d'un problème lors d'une étude de marché :", type:'multi', opts:[

    {t:"150 millions FCFA",c:false}
  ], diff:'med', piege:true, expl:"PDM = 50M / 200M = 0,25 = 25%. La réponse peut s'exprimer en % ou en ratio décimal. 150M est le reste du marché (autres acteurs), pas la PDM.", ref:"Chapitre 1 › Section C › Page 9"},

  {q:"Selon Aminata, responsable marketing, son étude de marché doit couvrir 4 sujets pour être efficace. Lesquels sont TOUS corrects ?", type:'multi', opts:[
    {t:"Le marché, l'offre, la demande, l'environnement",c:true},
    {t:"Les clients, la communication, le prix, la distribution",c:false},
    {t:"La réglementation, les concurrents, les fournisseurs, les banques",c:false},
    {t:"Ces 4 sujets permettent une démarche ordonnée et structurée",c:true}
  ], diff:'easy', piege:false, expl:"Les 4 sujets majeurs d'une étude de marché efficace : marché, offre, demande, environnement du projet.", ref:"Chapitre 3 › Intro › Page 16"},

  {q:"Kofi lance une app de livraison de repas à Abidjan. Il veut d'abord comprendre POURQUOI les clients commandent en ligne. Il choisit des entretiens en profondeur avec 12 consommateurs. Quel type d'analyse fait-il ?", type:'multi', opts:[
    {t:"Une analyse qualitative",c:true},
    {t:"Des entretiens face à face (type qualitatif)",c:true},
    {t:"Une analyse quantitative",c:false},
    {t:"Une étude basée sur des critères comportementaux",c:true}
  ], diff:'med', piege:true, expl:"Kofi veut comprendre (processus de décision) → analyse qualitative. Les entretiens face à face en profondeur sont un type d'étude qualitative. Ce n'est pas du quantitatif (qui vise à mesurer sur grands échantillons).", ref:"Chapitre 3 › Données primaires › Page 18"},

  {q:"Mariam dirige une boulangerie artisanale. Pour se différencier du supermarché concurrent, elle offre la livraison à domicile gratuite, un service de commande par WhatsApp et une garantie fraîcheur. Quels types de différenciation utilise-t-elle ?", type:'multi', opts:[
    {t:"Différenciation par le service",c:true},
    {t:"Différenciation par le produit",c:false},
    {t:"Différenciation par le personnel",c:false},
    {t:"Avantage concurrentiel par le service",c:true}
  ], diff:'med', piege:true, expl:"Livraison gratuite, commande WhatsApp, garantie fraîcheur → différenciation par le SERVICE (facilité de commande, livraison, service additionnel). Ce n'est pas de la différenciation par le produit (qui concerne la forme, design, etc.).", ref:"Chapitre 1 › Différenciation › Page 9"},

  {q:"Jean-Baptiste prépare son business plan pour un cabinet de conseil en BTP. Il a réalisé son étude de marché et les conclusions sont positives. Quelle est la prochaine étape logique ?", type:'multi', opts:[
    {t:"Réaliser le business plan",c:true},
    {t:"Lancer immédiatement l'activité",c:false},
    {t:"La suite logique de l'étude de marché est le business plan",c:true},
    {t:"Refaire une deuxième étude de marché pour confirmer",c:false}
  ], diff:'easy', piege:false, expl:"Si le résultat de l'étude de marché est concluant, la suite logique est la réalisation du business plan. On ne lance pas immédiatement sans business plan.", ref:"Chapitre 2 › Section VI › Page 15"},

  {q:"Adjoua veut vendre des pagnes traditionnels burkinabés via internet. Elle cible des acheteurs en France, en Belgique et au Canada. Son positionnement est :", type:'multi', opts:[
    {t:"International",c:true},
    {t:"Géographique multi-pays",c:true},
    {t:"Local",c:false},
    {t:"Possible grâce au développement d'internet",c:true}
  ], diff:'easy', piege:false, expl:"Adjoua cible plusieurs pays étrangers → positionnement géographique international. Internet a permis aux PME d'élargir grandement leur marché, y compris à l'international.", ref:"Chapitre 1 › Section B › Page 8"},

  {q:"Un groupe de 8 étudiants en entrepreneuriat teste un nouveau concept d'application de gestion budgétaire auprès d'un groupe de 15 consommateurs potentiels pour recueillir leurs perceptions. C'est :", type:'multi', opts:[
    {t:"Un entretien de groupe de consommateurs",c:true},
    {t:"Une étude qualitative",c:true},
    {t:"Une analyse quantitative",c:false},
    {t:"Un test de concept via le qualitatif",c:true}
  ], diff:'med', piege:true, expl:"L'objectif est de 'tester un concept et recueillir les perceptions' → entretien de groupe de consommateurs, qui est un type d'étude qualitative. Avec 15 personnes, ce n'est pas représentatif pour une analyse quantitative.", ref:"Chapitre 3 › Données primaires › Page 18"},

  {q:"Ibrahima souhaite lancer une marque de téléphones bas de gamme à prix réduit. Sa stratégie commerciale accepte des marges faibles mais cherche le volume. Quel type de positionnement adopte-t-il ?", type:'multi', opts:[
    {t:"Positionnement discounter / image de marque basse gamme",c:true},
    {t:"Positionnement prix bas",c:true},
    {t:"Positionnement image qualitative élevée",c:false},
    {t:"Stratégie de niche",c:false}
  ], diff:'med', piege:true, expl:"Ibrahima opte pour une image de discounter (prix faibles, moins de garantie sur la qualité) + positionnement prix bas pour attirer par le volume. Ce n'est pas une niche (marché restreint) ni une image qualitative.", ref:"Chapitre 1 › Section B › Page 8"},

  {q:"La Maison de l'Eau, entreprise spécialisée dans le forage, veut connaître combien d'entreprises similaires il y a au Burkina Faso, leurs prix, leur zone d'intervention et leur clientèle. Quelle phase de l'étude de marché réalise-t-elle ?", type:'multi', opts:[
    {t:"Phase 3 : analyse précise de l'offre",c:true},
    {t:"Étude de la concurrence directe",c:true},
    {t:"Phase 2 : analyse de la demande",c:false},
    {t:"Phase 1 : définition globale du marché",c:false}
  ], diff:'med', piege:true, expl:"Connaître les concurrents (nombre, prix, zone, clientèle) = Phase 3 : analyse précise de l'offre. La Phase 2 concerne les clients/demandeurs. La Phase 1 est la vue globale initiale.", ref:"Chapitre 2 › Phase n°3 › Page 13-14"},

  {q:"Un entrepreneur constate que son concurrent direct vend un service similaire à 50 000 FCFA et décide de vendre à 55 000 FCFA mais en incluant une garantie 2 ans et un service après-vente. C'est :", type:'multi', opts:[
    {t:"Un positionnement prix avec services supplémentaires",c:true},
    {t:"Un avantage concurrentiel",c:true},
    {t:"Une stratégie de pénétration par les bas prix",c:false},
    {t:"Une différenciation par le service",c:true}
  ], diff:'med', piege:true, expl:"Vendre plus cher avec des services supplémentaires pour justifier la différence de prix = avantage concurrentiel. La garantie et le SAV = différenciation par le service. Ce n'est pas une stratégie de bas prix (c'est plus cher).", ref:"Chapitre 1 › Sections B & Différenciation › Page 8-9"},

  {q:"Aminata collecte des données sur les ventes passées de son entreprise, les factures, les retours de marchandise et le budget communication. Ces données sont :", type:'multi', opts:[
    {t:"Des données secondaires internes",c:true},
    {t:"Des données primaires",c:false},
    {t:"Des informations déjà existantes dans l'entreprise",c:true},
    {t:"Des données secondaires externes",c:false}
  ], diff:'easy', piege:true, expl:"Ventes passées, factures, retours, budget communication = données secondaires INTERNES (déjà dans l'entreprise). Les données primaires sont collectées spécifiquement pour l'étude. Les externes viennent de sources extérieures.", ref:"Chapitre 3 › Données secondaires › Page 17"},

  {q:"Un cabinet de conseil en étude de marché propose à son client de mener des entretiens individuels en profondeur de 90 minutes avec une dizaine d'utilisateurs pour explorer leurs motivations profondes d'achat. C'est :", type:'multi', opts:[
    {t:"Des entretiens face à face",c:true},
    {t:"Une analyse qualitative",c:true},
    {t:"Une méthode pour comprendre le comportement d'achat",c:true},
    {t:"Une analyse quantitative avec échantillon représentatif",c:false}
  ], diff:'easy', piege:false, expl:"Entretiens individuels approfondis (1h-2h, dizaine de personnes) = entretiens face à face = analyse qualitative. L'objectif est de comprendre les motivations → critères comportementaux. Pas du quantitatif (qui nécessite un grand échantillon représentatif).", ref:"Chapitre 3 › Données primaires › Page 18"},

  {q:"Sylvie veut lancer des pizzas artisanales. Ses principales sources d'information secondaires externes seront :", type:'multi', opts:[
    {t:"Les rapports des fédérations de restaurateurs",c:true},
    {t:"La presse spécialisée en restauration",c:true},
    {t:"Les données de vente internes de ses propres commandes",c:false},
    {t:"Les études publiées par l'INSEE ou l'INS",c:true}
  ], diff:'easy', piege:true, expl:"Sources externes : fédérations, presse spécialisée, INSEE/INS. Les données de ventes internes = sources secondaires INTERNES (Sylvie n'a pas encore lancé, donc elle n'en a pas).", ref:"Chapitre 3 › Données secondaires › Page 17"},

  {q:"Dans le cadre d'une étude de marché pour une PME de plomberie, l'entrepreneur veut mesurer le taux de notoriété de sa marque auprès de 500 entreprises du BTP. Il utilisera :", type:'multi', opts:[
    {t:"Une analyse quantitative",c:true},
    {t:"Un questionnaire ou sondage",c:true},
    {t:"Un entretien de groupe de créativité",c:false},
    {t:"Un échantillon représentatif de la population cible",c:true}
  ], diff:'med', piege:false, expl:"Mesurer le taux de notoriété sur un grand panel (500 entreprises) = analyse quantitative via questionnaire/sondage avec un échantillon représentatif. Le groupe de créativité sert à faire émerger de nouvelles idées (qualitatif).", ref:"Chapitre 3 › Données primaires › Page 18"},

  {q:"Le marché des boites de conserves de tomates peut être subdivisé en concentré de tomates, tomates pelées et tomates cerises. Cette subdivision représente :", type:'multi', opts:[
    {t:"Un segment de produits",c:true},
    {t:"Une segmentation du marché par sous-groupes de produits",c:true},
    {t:"Un segment de consommateurs",c:false},
    {t:"Des niches de marché distinctes",c:false}
  ], diff:'med', piege:true, expl:"Subdiviser les ventes d'un produit générique (conserves de tomates) en sous-groupes (concentré, pelées, cerises) = segment par PRODUITS. Le segment consommateurs regroupe les acheteurs par critères démographiques, géographiques, etc.", ref:"Chapitre 1 › Section A › Page 7"},

  {q:"Une association de médecins au Burkina Faso recommande officiellement l'utilisation de moustiquaires imprégnées de marque X à ses membres. Cette association joue le rôle de :", type:'multi', opts:[
    {t:"Prescripteur",c:true},
    {t:"Organisation recommandant l'achat d'un produit",c:true},
    {t:"Concurrent direct de la marque X",c:false},
    {t:"Leader d'opinion influençant les ventes",c:true}
  ], diff:'med', piege:false, expl:"Une association qui recommande l'achat d'un produit = prescripteur. Elle joue aussi le rôle de leader d'opinion (acteur influençant les ventes). Elle n'est pas un concurrent.", ref:"Sujet d'examen UE7 › Q30 & Chapitre 1 › Page 5"},

  {q:"Sébastien décide de définir le problème de son étude comme suit : 'Comment améliorer globalement la qualité de vie des habitants de Ouagadougou ?'. Son mentor lui dit que cette définition est problématique. Pourquoi ?", type:'multi', opts:[
    {t:"La définition est trop large, les informations collectées pourraient être sans rapport avec son projet",c:true},
    {t:"Elle ne lui permettra pas de prendre des décisions en connaissance de cause",c:true},
    {t:"Elle est trop étroite et risque de faire oublier des éléments importants",c:false},
    {t:"Elle augmentera les coûts de l'étude inutilement",c:true}
  ], diff:'med', piege:true, expl:"Une définition trop large = collecte d'infos intéressantes mais possiblement sans rapport avec le problème concret → impossibilité de décider correctement + coûts inutiles. Ce n'est pas une définition trop étroite (qui est l'autre extrême).", ref:"Chapitre 3 › Section 1 › Page 16-17"},

  {q:"Un entrepreneur agroalimentaire au Sahel veut savoir si son yaourt à base de moringa se vendra bien dans les zones rurales. Il consulte des fournisseurs de lait, des distributeurs et des partenaires pour avoir leur avis. Cette approche correspond à :", type:'multi', opts:[
    {t:"Demander aux fournisseurs et partenaires (phase d'initiation à l'étude de marché)",c:true},
    {t:"Une démarche du Chapitre 4 : cas pratique",c:true},
    {t:"Une analyse des données secondaires externes",c:false},
    {t:"Une phase de collecte d'information primaire",c:true}
  ], diff:'hard', piege:true, expl:"Consulter fournisseurs et partenaires = démarche du cas pratique Chapitre 4. Cette collecte directe de nouvelles informations = données primaires. Ce ne sont pas des données secondaires externes (qui proviennent de publications existantes).", ref:"Chapitre 4 › Cas pratique › Page 21"},

  {q:"Une start-up technologique organise une session avec 10 utilisateurs potentiels pour générer de nouvelles idées de fonctionnalités pour son application. Cette session est :", type:'multi', opts:[
    {t:"Un entretien de groupe de créativité",c:true},
    {t:"Un type d'étude qualitative",c:true},
    {t:"Un entretien de groupe de consommateurs",c:false},
    {t:"Une méthode pour faire émerger de nouvelles idées ou tendances",c:true}
  ], diff:'med', piege:true, expl:"Faire émerger de nouvelles idées = entretien de groupe de CRÉATIVITÉ (qualitatif). Ce n'est pas un groupe de consommateurs (dont le but est de tester un produit/concept existant ou de recueillir perceptions d'un service).", ref:"Chapitre 3 › Données primaires › Page 18"},

  {q:"Moussa analyse les tableaux croisés de son enquête, calcule les coefficients de corrélation et utilise l'analyse factorielle des correspondances. Il est à :", type:'multi', opts:[
    {t:"L'étape 4 : Analyse des résultats",c:true},
    {t:"L'étape où il dégage la signification des résultats obtenus",c:true},
    {t:"L'étape 5 : Présentation des résultats",c:false},
    {t:"L'étape d'utilisation de techniques multivariées",c:true}
  ], diff:'med', piege:true, expl:"Tableaux croisés, coefficients de corrélation, techniques multivariées (analyse discriminante, analyse factorielle) → étape 4 = analyse des résultats. L'étape 5 c'est la rédaction du rapport/présentation.", ref:"Chapitre 3 › Section 4 › Page 19"},

  {q:"Awa veut ouvrir un salon de coiffure et décide d'utiliser un questionnaire en ligne pour interroger 300 femmes de Bobo-Dioulasso sur leurs habitudes et préférences de coiffure. Elle veut des données chiffrées pour valider ses hypothèses. C'est :", type:'multi', opts:[
    {t:"Une analyse quantitative",c:true},
    {t:"Une collecte de données primaires",c:true},
    {t:"Un sondage sur un échantillon représentatif",c:true},
    {t:"Une analyse qualitative pour comprendre les motivations",c:false}
  ], diff:'easy', piege:true, expl:"Questionnaire sur 300 femmes pour obtenir des données chiffrées → analyse quantitative. Elle collecte des données nouvelles (primaires). Ce n'est pas du qualitatif (qui cherche à comprendre en profondeur sur petit échantillon).", ref:"Chapitre 3 › Données primaires › Page 18"},

  {q:"Un rapport d'étude de marché se termine par la phrase : 'Au vu de ces résultats, nous recommandons de réorienter le produit vers le segment des 25-35 ans urbains, et d'augmenter le budget digital.' Cette phrase illustre :", type:'multi', opts:[
    {t:"La présentation des résultats et recommandations",c:true},
    {t:"L'étape 5 de l'étude de marché",c:true},
    {t:"Une conclusion exprimée dans l'optique de l'utilisateur",c:true},
    {t:"L'étape d'analyse des données",c:false}
  ], diff:'easy', piege:false, expl:"Une recommandation concrète orientée décision = présentation des résultats (étape 5), exprimée dans l'optique de l'utilisateur. L'analyse des données (étape 4) est le travail statistique qui précède.", ref:"Chapitre 3 › Section 5 › Page 19-20"},

  {q:"Paul dirige une PME de construction et veut lancer un nouveau service de maintenance. Il dispose déjà de données sur son CA, ses clients habituels et ses anciens devis. Ces données représentent :", type:'multi', opts:[
    {t:"Des données secondaires internes",c:true},
    {t:"Un point de départ avant de collecter des données primaires",c:true},
    {t:"Des données primaires collectées pour cette étude",c:false},
    {t:"Des données suffisantes pour une étude de marché complète",c:false}
  ], diff:'med', piege:true, expl:"CA, fichiers clients, anciens devis = données secondaires INTERNES (existantes dans l'entreprise). Elles sont un point de départ mais ne suffisent pas à elles seules pour une étude complète (il faut aussi des données primaires et sources externes).", ref:"Chapitre 3 › Données secondaires › Page 17"},

  {q:"La stratégie marketing des 4P pour une entreprise de livraison de repas inclut :", type:'multi', opts:[
    {t:"Produit : type de repas proposé",c:true},
    {t:"Prix : tarification des livraisons",c:true},
    {t:"Place : zone de livraison et canaux de commande",c:true},
    {t:"Promotion : publicité sur réseaux sociaux",c:true}
  ], diff:'easy', piege:false, expl:"Les 4P : Produit (type de repas), Prix (tarification), Place (distribution/zone), Promotion (communication). Toutes ces réponses sont correctes pour cet exemple concret.", ref:"Chapitre 4 › Stratégie marketing › Page 23"},

  {q:"Fatou, opératrice de téléphonie mobile, réalise que ses clients du quartier populaire ont des habitudes d'achat très différentes de ses clients des quartiers résidentiels. Elle décide de créer deux offres différentes. Sa démarche est :", type:'multi', opts:[
    {t:"Une segmentation du marché",c:true},
    {t:"Un ciblage différencié selon les segments",c:true},
    {t:"Un positionnement prix différent pour des segments différents",c:true},
    {t:"Une stratégie de concentration sur un seul couple produit/marché",c:false}
  ], diff:'hard', piege:true, expl:"Fatou segmente (2 groupes distincts), cible chaque segment différemment, et adapte son prix par segment. La concentration sur un seul couple produit/marché = choisir UN seul segment, ce qui est l'inverse de ce que fait Fatou.", ref:"Chapitre 1 › Sections A & B › Page 6-8"},

  {q:"Un entrepreneur du secteur hôtelier à Ouagadougou analyse le contexte politique instable, les tendances économiques, les habitudes touristiques et la réglementation hôtelière. Il est en train de réaliser :", type:'multi', opts:[
    {t:"La phase 4 de l'étude de marché",c:true},
    {t:"L'analyse de l'environnement du marché et du projet",c:true},
    {t:"L'identification des facteurs externes pouvant influencer son activité",c:true},
    {t:"La phase 2 de l'étude de marché",c:false}
  ], diff:'med', piege:false, expl:"Analyser le contexte politique, économique, social, technologique, écologique, légal = Phase 4 = analyse de l'environnement du marché et du projet. La Phase 2 porte sur la demande (les clients).", ref:"Chapitre 2 › Phase n°4 › Page 14"},

  {q:"Olivier, nouveau directeur commercial, souhaite savoir si son entreprise est plutôt bien ou mal positionnée face à ses concurrents sur des critères de technologie, coût, qualité et service. Cette démarche s'appelle :", type:'multi', opts:[
    {t:"Le benchmarking",c:true},
    {t:"Déterminer l'avantage concurrentiel de l'entreprise",c:true},
    {t:"La veille concurrentielle permanente",c:false},
    {t:"L'analyse comparative par rapport aux normes du marché",c:true}
  ], diff:'med', piege:true, expl:"Se situer par rapport aux concurrents sur des critères standards = benchmarking. Cela permet de dégager l'avantage concurrentiel. La veille concurrentielle est le suivi continu de l'évolution de l'offre (différent du benchmarking ponctuel).", ref:"Chapitre 1 › Section C › Page 9"},

  {q:"Dans son étude de marché, Kone identifie que les ménages qui n'utilisent PAS encore l'eau potable représentent un segment à convertir. Ces ménages sont des :", type:'multi', opts:[
    {t:"Non-clients absolus (au moment de l'étude)",c:true},
    {t:"Clients potentiels à conquérir",c:true},
    {t:"Anciens clients ayant abandonné le produit",c:false},
    {t:"Un marché à développer",c:true}
  ], diff:'med', piege:true, expl:"Les ménages qui n'utilisent PAS le produit au moment de l'étude = non-clients absolus. Ils sont des clients potentiels à conquérir et représentent un marché à développer. Les 'abandonneurs' sont des anciens clients, une catégorie différente.", ref:"Sujet d'examen UE7 › Q23"},

  {q:"Une entreprise de textiles au Burkina propose des pagnes tisséset du wax imprimé. Elle décide de se spécialiser dans le wax pour plusieurs marchés différents (marché burkinabé, ivoirien, français). Cette stratégie de couverture est :", type:'multi', opts:[
    {t:"Une spécialisation par produit",c:true},
    {t:"Un produit unique pour plusieurs segments",c:true},
    {t:"Une spécialisation par marché",c:false},
    {t:"Une concentration sur un seul couple produit/marché",c:false}
  ], diff:'hard', piege:true, expl:"Se concentrer sur un PRODUIT (wax) pour PLUSIEURS segments (marchés différents) = spécialisation par PRODUIT. La spécialisation par marché = plusieurs produits pour un seul segment. La concentration = un seul produit pour un seul marché.", ref:"Chapitre 1 › Section A (Le ciblage) › Page 7"},

  {q:"Le Ministère de la Santé du Burkina Faso publie une liste de médicaments génériques recommandés. Les pharmacies font partie du marché :", type:'multi', opts:[
    {t:"Complémentaire au marché des médicaments de marque",c:true},
    {t:"Principal du médicament",c:true},
    {t:"De substitution si les génériques remplacent les princeps",c:true},
    {t:"Générique au sens large du besoin de santé",c:true}
  ], diff:'hard', piege:true, expl:"Question complexe : les génériques peuvent être complémentaires (pris en même temps que d'autres), du marché principal (médicaments de même type), de substitution (remplacent les princeps), ou du marché générique (besoin santé global). Selon le cours, le marché complémentaire = produits complémentaires à un autre type de produit.", ref:"Sujet d'examen UE7 › Q21, Q29"},

  {q:"Lors de son étude de marché, Adama souhaite savoir si ses clients potentiels achèteront plus en saison sèche ou en saison des pluies. Il analyse :", type:'multi', opts:[
    {t:"La saisonnalité du marché",c:true},
    {t:"Un élément de l'étude sur le secteur et la réglementation",c:true},
    {t:"La demande en volume selon les périodes",c:true},
    {t:"Un élément de la phase n°2 uniquement",c:false}
  ], diff:'med', piege:true, expl:"La saisonnalité fait partie des questions sur le secteur et sa réglementation (Chapitre 2, section I). Elle est aussi liée à l'analyse de la demande en Phase 2, mais elle est d'abord mentionnée comme question sur le marché lui-même.", ref:"Chapitre 2 › Section I › Page 11"},

  {q:"Moussa lance une boutique de pièces détachées pour véhicules d'occasion. Avant de se lancer, il souhaite évaluer si son projet est viable. Sa première démarche devrait être :", type:'multi', opts:[
    {t:"Réaliser une étude de marché",c:true},
    {t:"Collecter des informations sur clients, concurrents et environnement",c:true},
    {t:"Lancer directement et ajuster au fil de l'eau",c:false},
    {t:"Rédiger d'abord le business plan",c:false}
  ], diff:'easy', piege:true, expl:"Avant de lancer une activité = étude de marché OBLIGATOIRE pour évaluer la viabilité et la rentabilité. Le business plan vient APRÈS une étude concluante. On ne lance pas directement sans étude.", ref:"Chapitre 1 › Importance › Page 4"},

  {q:"Dans le cadre de son étude de marché sur les équipements solaires, Bintou analyse les informations suivantes : 'Le marché du solaire en Afrique de l'Ouest a progressé de 35% en 5 ans, avec des prévisions de croissance de 20%/an.' Ces informations sont :", type:'multi', opts:[
    {t:"Des données secondaires externes",c:true},
    {t:"Des informations sur l'évolution du marché",c:true},
    {t:"Des données primaires collectées sur le terrain",c:false},
    {t:"Des informations pouvant provenir de la presse spécialisée ou d'instituts",c:true}
  ], diff:'med', piege:false, expl:"Des statistiques de marché publiées = données secondaires EXTERNES (presse spécialisée, rapports d'instituts). Ce ne sont pas des données primaires (qui nécessitent une collecte directe par Bintou elle-même).", ref:"Chapitre 3 › Données secondaires › Page 17"},

const series=[serie1,serie2,serie3];
const STORAGE_KEY='QCM_PROGRESS_M18';
let currentSerie=0,currentQ=0,sessionQs=[],answers={},validated={},markedWrong={},wrongList=[],isRetryMode=false,pendingResume=null;
function saveProgress(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({serie:currentSerie,question:currentQ,answers,validated,markedWrong,wrongList,isRetryMode,sessionOrder:sessionQs.map(q=>q.origIdx)}));}catch(e){}}
function loadProgress(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY));}catch(e){return null;}}
function clearProgress(){try{localStorage.removeItem(STORAGE_KEY);}catch(e){}}
function checkResume(){const saved=loadProgress();if(!saved||Object.keys(saved.validated||{}).length===0)return;pendingResume=saved;const names=['Série 1 — Théorie','Série 2 — Cas Pratiques','Série 3 — Examen Réel'];document.getElementById('resumeInfo').textContent=(names[saved.serie]||'Série '+(saved.serie+1))+' · Question '+(saved.question+1);document.getElementById('resumeOverlay').style.display='flex';}
function doResume(){document.getElementById('resumeOverlay').style.display='none';if(!pendingResume)return;const s=pendingResume;currentSerie=s.serie;currentQ=s.question;answers=s.answers||{};validated=s.validated||{};markedWrong=s.markedWrong||{};wrongList=s.wrongList||[];isRetryMode=s.isRetryMode||false;const src=series[currentSerie];sessionQs=(s.sessionOrder||[]).map(origIdx=>{const q=src[origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});updateSerieButtons();updateScoreLive();renderQuestion();showSection('qcm');}
function doRestart(){document.getElementById('resumeOverlay').style.display='none';clearProgress();pendingResume=null;loadSerie(0);}
function shuffleArray(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function updateSerieButtons(){document.querySelectorAll('.serie-btn').forEach((b,i)=>b.classList.toggle('active',i===currentSerie&&!isRetryMode));}
function updateScoreLive(){const vKeys=Object.keys(validated);let correct=0;sessionQs.forEach((q,i)=>{if(!validated[i])return;const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);if(cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x)))correct++;});const vCount=vKeys.length;document.getElementById('liveCorrect').textContent=correct;document.getElementById('liveWrong').textContent=vCount-correct;document.getElementById('liveTotal').textContent=sessionQs.length;document.getElementById('livePct').textContent=vCount>0?Math.round((correct/vCount)*100)+'%':'—';}
function loadSerie(idx,retry=false){currentSerie=idx;isRetryMode=retry;currentQ=0;answers={};validated={};if(!retry){wrongList=[];const shuffledIdxs=shuffleArray(series[idx].map((_,i)=>i));sessionQs=shuffledIdxs.map(origIdx=>{const q=series[idx][origIdx];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx};});}updateSerieButtons();updateScoreLive();renderQuestion();clearProgress();}
function loadRetry(){if(wrongList.length===0)return;isRetryMode=true;currentQ=0;answers={};validated={};sessionQs=wrongList.map(qi=>{const q=series[currentSerie][qi];return{...q,shuffledOpts:shuffleArray(q.opts.map((o,oi)=>({...o,origIdx:oi}))),origIdx:qi};});updateScoreLive();renderQuestion();}
function renderQuestion(){const container=document.getElementById('qcmContainer');const total=sessionQs.length;const pct=total>0?((currentQ+1)/total)*100:0;document.getElementById('qcmProgressBar').style.width=pct+'%';if(currentQ>=total){showScore();return;}const q=sessionQs[currentQ];const isVal=!!validated[currentQ];const sel=answers[currentQ]||[];const isMarked=!!markedWrong[q.origIdx];const letters=['A','B','C','D','E','F'];const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const isCorrect=isVal&&cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));let optsHtml='';q.shuffledOpts.forEach((opt,i)=>{let cls='option-item';if(isVal){cls+=' disabled';if(opt.c)cls+=' correct';else if(sel.includes(i))cls+=' wrong';}else if(sel.includes(i))cls+=' selected';optsHtml+=`<button class="${cls}" onclick="selectOpt(${i})" ${isVal?'disabled':''}><div class="option-letter">${letters[i]}</div><div class="option-text">${opt.t}</div></button>`;});const feedbackHtml=isVal?`<div class="feedback-banner ${isCorrect?'correct':'wrong'}">${isCorrect?'✅ Bonne réponse !':'❌ Mauvaise réponse'}</div>`:'';const explHtml=isVal?`<div class="explanation-box"><div class="explanation-title">💡 Explication</div><div class="explanation-text">${q.expl}</div><span class="page-ref">📄 ${q.ref}</span></div>`:'';const multiHint=`<div class="multi-hint">⚠ Sélectionnez la ou les réponses correctes</div>`;const markLabel=isMarked?'✕ Retirer marque':'🔶 Marquer';container.innerHTML=`<div class="question-card"><div class="question-meta"><span class="q-num">Q${currentQ+1}/${total}${isRetryMode?' (Révision)':''}</span><span class="badge badge-${q.diff==='easy'?'easy':q.diff==='med'?'med':'hard'}">${q.diff==='easy'?'🟢 Facile':q.diff==='med'?'🟡 Moyen':'🔴 Difficile'}</span>${q.piege?'<span class="badge badge-piege">⚠ PIÈGE POSSIBLE</span>':''}${isMarked?'<span class="badge badge-marked">🔶 Marquée</span>':''}</div><div class="question-text">${q.q}</div>${multiHint}<div class="options-list">${optsHtml}</div>${feedbackHtml}${explHtml}</div><div class="qcm-nav">${!isVal?`<button class="btn-primary" onclick="validateQ()" ${sel.length===0?'disabled':''}>✓ Valider</button>`:`<button class="btn-primary" onclick="nextQ()">Suivant →</button>`}${currentQ>0?`<button class="btn-secondary" onclick="prevQ()">← Précédent</button>`:''}<button class="mark-btn ${isMarked?'marked':''}" onclick="toggleMark(${q.origIdx})">${markLabel}</button></div>`;}
function selectOpt(i){if(validated[currentQ])return;const q=sessionQs[currentQ];if(!answers[currentQ])answers[currentQ]=[];const idx=answers[currentQ].indexOf(i);if(idx>-1)answers[currentQ].splice(idx,1);else answers[currentQ].push(i);renderQuestion();}
function validateQ(){const q=sessionQs[currentQ];const sel=answers[currentQ]||[];if(sel.length===0)return;validated[currentQ]=true;const cIdxs=q.shuffledOpts.map((o,i)=>o.c?i:-1).filter(x=>x>=0);const ok=cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));if(!ok&&!wrongList.includes(q.origIdx))wrongList.push(q.origIdx);if(!ok)markedWrong[q.origIdx]=true;updateScoreLive();saveProgress();renderQuestion();}
function nextQ(){currentQ++;saveProgress();renderQuestion();}
function prevQ(){if(currentQ>0){currentQ--;saveProgress();renderQuestion();}}
function toggleMark(origIdx){markedWrong[origIdx]=!markedWrong[origIdx];if(!markedWrong[origIdx]){const idx=wrongList.indexOf(origIdx);if(idx>-1)wrongList.splice(idx,1);}else if(!wrongList.includes(origIdx))wrongList.push(origIdx);saveProgress();renderQuestion();}
function showScore(){const total=sessionQs.length;const correct=sessionQs.filter((q,i)=>{const sel=answers[i]||[];const cIdxs=q.shuffledOpts.map((o,oi)=>o.c?oi:-1).filter(x=>x>=0);return cIdxs.length===sel.length&&cIdxs.every(x=>sel.includes(x))&&sel.every(x=>cIdxs.includes(x));}).length;const wrong=total-correct;const pct=Math.round((correct/total)*100);const markedCount=Object.values(markedWrong).filter(v=>v).length;clearProgress();document.getElementById('qcmContainer').innerHTML=`<div class="score-card" id="scoreCard" style="display:block"><div class="score-big">${pct}%</div><div class="score-label">${isRetryMode?'Session de révision terminée':'Série '+(currentSerie+1)+' terminée'}</div><div class="score-stats"><div class="score-stat green"><div class="score-stat-val">${correct}</div><div class="score-stat-label">✅ Correct</div></div><div class="score-stat red"><div class="score-stat-val">${wrong}</div><div class="score-stat-label">❌ Incorrect</div></div><div class="score-stat"><div class="score-stat-val">${total}</div><div class="score-stat-label">Total</div></div>${markedCount>0?`<div class="score-stat orange"><div class="score-stat-val">${markedCount}</div><div class="score-stat-label">🔶 Marquées</div></div>`:''}</div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;"><button class="btn-primary" onclick="loadSerie(${currentSerie})">🔄 Recommencer</button>${wrongList.length>0?`<button class="btn-retry" onclick="loadRetry()">🎯 Questions ratées (${wrongList.length})</button>`:''}</div><div style="margin-top:16px;font-size:12px;color:var(--text3)">${pct>=70?'🎉 Excellent !':pct>=50?'📚 Continuez à réviser.':'⚠ Révisez les fiches et recommencez.'}</div></div>`;document.getElementById('qcmProgressBar').style.width='100%';}
